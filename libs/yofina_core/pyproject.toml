[project]
name = "yofina-core"
version = "0.1.0"
description = "Gói dùng chung của Yofina Foresight cho agent, Lambda tool và pipeline."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",  # zoneinfo trên Windows; Lambda Linux cũng không hại
]

[project.optional-dependencies]
# boto3 có sẵn trong runtime Lambda; chỉ cần khi chạy ngoài đó (đọc SSM, Data API...).
aws = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yofina_core"]
