  /nudges/today:
    get:
      tags: [nudges]
      operationId: getTodayNudge
      summary: Bản tin chủ động của hôm nay (tối đa một việc)
      x-lambda: ledger
      description: |
        Bản tin mà cổng giá trị của batch đêm đã chọn cho ngày mô phỏng hôm nay (dòng `nudges` có `source = system`, tối đa MỘT mỗi ngày,
        DB bảo đảm), dựng thành khối `proactive_card` có `nudge_id`. Thứ tự ưu tiên của cổng (`yofina_core.wallet.NUDGE_GATE_ORDER`): hũ
        thiết yếu sắp cạn, nghĩa vụ trong 3 ngày, lộ trình mới chờ chọn, hỏi gộp, điểm chống chịu tụt nhóm, nhận xét hành vi; chỉ chọn khi
        giá trị ước tính vượt ngưỡng; loại người dùng đã bấm "Ít nhắc loại này" bị hạ một bậc; sở thích trong bộ nhớ ("đừng nhắc buổi
        sáng") được tôn trọng. Không có bản tin (chưa vượt ngưỡng, đã bỏ qua, batch chưa chạy) thì `nudge` và `card` vắng; `suppressed`
        nói loại nào bị bỏ và vì sao (để giải thích, không hiện như cảnh báo). Không ghi gì, không qua model. Thẻ tất định của
        `GET /overview` (phase 2) vẫn còn; giao diện ưu tiên bản tin này khi có.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Bản tin hôm nay (có thể trống).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeTodayResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /nudges/{nudge_id}/feedback:
    post:
      tags: [nudges]
      operationId: submitNudgeFeedback
      summary: Phản hồi một bản tin (đã làm, bỏ qua, để sau, ít nhắc loại này)
      x-lambda: ledger
      description: |
        Ghi `outcome` của một bản tin (`acted`, `dismissed`, `snoozed`, `less_like_this`) vào dòng `nudges` và một dòng `feedback`
        (`block_id` là id thẻ, `option_id` là loại bản tin). `less_like_this` làm cổng hạ loại đó một bậc ở các ngày sau. Không đụng tiền
        nên KHÔNG qua token (như `POST /feedback`). Idempotent: gửi lại cùng outcome không đổi gì; outcome khác thì ghi đè (người dùng đổi
        ý). Bản tin của người khác hoặc không tồn tại đều 404 `NUDGE_NOT_FOUND`; chỉ phản hồi được bản tin `source = system`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/NudgeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudgeFeedbackRequest'
      responses:
        '200':
          description: Đã ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NudgeFeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /memory:
    get:
      tags: [memory]
      operationId: listMemory
      summary: Bộ nhớ dài hạn của tôi
      x-lambda: ledger
      description: |
        Liệt kê bản ghi AgentCore Memory dưới gốc namespace của người gọi (`/yofina/users/{sub}/`, `yofina_core.memory`): sở thích, sự thật
        về người dùng, tóm tắt phiên (trích từ hội thoại), hồ sơ hành vi và bài học của agent (hệ thống tự tạo). Mới nhất trước. Bản ghi
        không có số dư, giao dịch thô hay PII (đã che trước khi ghi). Server bỏ mọi bản ghi có namespace không thuộc người gọi
        (`kind_of_namespace`). `cursor` là `next_cursor` của trang trước (mờ). Memory không trả lời thì 503 `MEMORY_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: kind
          in: query
          required: false
          description: Chỉ một loại bản ghi.
          schema:
            $ref: '#/components/schemas/MemoryKind'
        - name: limit
          in: query
          required: false
          description: Số bản ghi tối đa mỗi trang (1 đến 100, mặc định 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        '200':
          description: Các bản ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [memory]
      operationId: clearMemory
      summary: Xóa toàn bộ bộ nhớ dài hạn của tôi
      x-lambda: ledger
      description: |
        Xóa MỌI bản ghi dài hạn dưới gốc namespace của người gọi (liệt kê theo `namespacePath` rồi `BatchDeleteMemoryRecords` từng 100 bản
        ghi; AgentCore không có API xóa theo người dùng) và mọi sự kiện ngắn hạn của `actorId` = `sub` (`ListSessions`, `ListEvents`,
        `DeleteEvent`). Không đụng Aurora hay S3. Không qua token (không đổi số dư; giao diện hỏi lại trước khi gọi). Idempotent: không còn
        gì thì trả 0. Xóa dở (một phần lỗi) thì 200 với `failed` lớn hơn 0; gọi lại để xóa nốt.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Số bản ghi và sự kiện đã xóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryClearResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /memory/{record_id}:
    delete:
      tags: [memory]
      operationId: deleteMemoryRecord
      summary: Xóa một bản ghi bộ nhớ
      x-lambda: ledger
      description: |
        Server đọc bản ghi (`GetMemoryRecord`), kiểm namespace thuộc người gọi rồi mới xóa (`DeleteMemoryRecord` kèm namespace cho điều
        kiện IAM). Bản ghi của người khác hoặc không tồn tại đều 404 `MEMORY_RECORD_NOT_FOUND` như nhau. Không qua token.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/MemoryRecordIdPath'
      responses:
        '200':
          description: Đã xóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecordDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/delete-data/confirmations:
    post:
      tags: [privacy]
      operationId: createDeleteDataConfirmation
      summary: Cấp token xác nhận cho "Xóa dữ liệu của tôi"
      x-lambda: ledger
      description: |
        Gọi khi người dùng bấm nút xác nhận cuối ở màn Hồ sơ. Như `POST /confirmations` nhưng CHỈ nhận `tool` = `delete_my_data` và
        `params` = `{scope: all}` (`PrivacyToolName`, `DeleteMyDataParams`); cùng khóa HMAC, cùng bảng `jti`, cùng thời gian sống token.
        Trả `ConfirmationResponse` có `preview` (tóm tắt những gì sẽ bị xóa: hồ sơ, hũ, sổ cái, hội thoại, tệp đã nạp, bộ nhớ; cảnh báo
        không hoàn tác được). Không ghi gì. Đang có một lần xóa chạy dở thì vẫn cấp (lần xóa sau làm tiếp phần còn lại).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDataConfirmationRequest'
      responses:
        '200':
          description: Token đã cấp (`tool` là `delete_my_data`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/delete-data:
    post:
      tags: [privacy]
      operationId: deleteMyData
      summary: Xóa dữ liệu của tôi (Aurora, S3, Memory) với token xác nhận
      x-lambda: ledger
      description: |
        Kiểm token (chữ ký, hạn, tool `delete_my_data`, sub, hash tham số, `jti` chưa dùng; lỗi như `POST /actions`: 403 `TOKEN_INVALID`
        hoặc `TOKEN_EXPIRED`, 409 `TOKEN_REUSED` hoặc `PARAMS_MISMATCH`). Thiếu `confirm_token` thì không xóa gì, trả 428
        `NEEDS_CONFIRMATION`. Có token hợp lệ: ghi một dòng `data_deletions` (`running`), xóa S3 (mọi object dưới tiền tố `{sub}/` của bucket
        nạp), Memory (như `DELETE /memory`), rồi Aurora (hàm `app_delete_user_data`: mọi bảng của người dùng kể cả `audit_events` và
        `users`, một transaction) và trả `DataDeletion`: `done` khi cả ba bước xong, `partial` khi S3 hoặc Memory lỗi (Aurora đã xóa;
        gọi lại với token mới để làm tiếp), `failed` khi Aurora lỗi. Nhật ký `data_deletions` không chứa dữ liệu đã xóa. Sau đó tài khoản
        Cognito vẫn còn và đăng nhập lại là tài khoản trắng. Đang có lần xóa `running` của chính người gọi thì trả lần đó, không chạy
        song song.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDataRequest'
      responses:
        '200':
          description: Kết quả lần xóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/NeedsConfirmation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ops/traces:
    get:
      tags: [ops]
      operationId: listOpsTraces
      summary: Danh sách lượt của mọi người dùng (màn trace, chỉ nhóm ops)
      x-lambda: ledger
      x-required-group: ops
      description: |
        Bản ghi lượt (`audit_events`, `event_type = agent_turn`) của MỌI người dùng, mới nhất trước, lọc theo khoảng thời gian thật, ý
        định, kết quả, độ trễ tối thiểu. Đọc qua hàm `SECURITY DEFINER` `app_ops_list_traces` (migration 0053) chỉ trả cột đã chọn;
        người dùng hiện bằng `user_ref` (12 ký tự đầu của sha256 của `sub`, không đảo ngược được), không có câu hỏi hay câu trả lời.
        Không thuộc nhóm Cognito `ops` thì 403 `FORBIDDEN`. Không đọc CloudWatch Transaction Search.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: from
          in: query
          required: false
          description: Thời điểm thật bắt đầu (RFC 3339, UTC). Mặc định 7 ngày trước.
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - name: to
          in: query
          required: false
          description: Thời điểm thật kết thúc (RFC 3339, UTC). Mặc định bây giờ.
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - name: intent
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z_]{0,31}$'
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum: [ok, rejected, error]
        - name: min_duration_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Số lượt tối đa (1 đến 100, mặc định 50).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Danh sách lượt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsTraceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ops/traces/{trace_id}:
    get:
      tags: [ops]
      operationId: getOpsTrace
      summary: Chi tiết một lượt (màn trace X1, chỉ nhóm ops)
      x-lambda: ledger
      x-required-group: ops
      description: |
        Mọi bước của một lượt: router (ý định), kế hoạch và từng lần gọi tool kèm thời lượng và trạng thái (`step_timings` có `step` là tên
        đầy đủ của tool), verifier, luật đã kiểm, dữ liệu đã dùng (nhãn đã che PII bằng `yofina_core.pii`), độ tin cậy, khối đã phát (chỉ id
        và loại), token và chi phí ước tính (`est_cost_vnd`, số nguyên VND theo bảng giá trong cấu hình). Mở từ hàng "Mã trace" của bảng
        "Vì sao". Không thuộc nhóm `ops` thì 403 `FORBIDDEN`; không có trace thì 404 `TRACE_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/TraceIdPath'
      responses:
        '200':
          description: Chi tiết lượt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsTraceDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ops/summary:
    get:
      tags: [ops]
      operationId: getOpsSummary
      summary: Tổng hợp vận hành (chỉ nhóm ops)
      x-lambda: ledger
      x-required-group: ops
      description: |
        Trong khoảng `from`..`to` (thời điểm thật, mặc định 7 ngày gần nhất, tối đa 31 ngày): số lượt, độ trễ p50 và p95 của lượt, số lần
        gọi tool và tỷ lệ lỗi tool (từ `step_timings`), số lần luật chặn (luật `fail` trong `rules_checked`), lượt bị từ chối và lỗi, số
        lượt gọi model theo ngày (ngày của múi giờ tính trần, bảng `yofina-usage`) so với trần trong cấu hình (`llm_defaults.json`), có
        tách theo từng model (`by_model`). Hàm `app_ops_summary` (SECURITY DEFINER) chỉ trả số tổng hợp. Không thuộc nhóm `ops` thì 403
        `FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: from
          in: query
          required: false
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - name: to
          in: query
          required: false
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
      responses:
        '200':
          description: Số tổng hợp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /cashflow:
    get:
      tags: [wallet]
      operationId: getCashflow
      summary: Thu, chi và chi theo hũ của kỳ lương này so với kỳ trước cùng thời điểm (bản REST của get_cashflow_summary)
      x-lambda: ledger
      description: |
        Bản REST của tool `ledger___get_cashflow_summary` cho ba biểu đồ chi tiêu của màn Hoạt động (B1 chi theo hũ, B5 đường lũy kế, B7
        thu và chi; docs/research/spending-visualization.md). Không có tham số: kỳ là kỳ lương hiện tại theo ngày mô phỏng, từ ngày lương
        gần nhất (ngày lương trong hồ sơ) tới hôm nay; chưa khai ngày lương thì như tool, từ mùng 1 của tháng (`period.kind` =
        `calendar_month`). Mọi tổng thu, tổng chi, chi theo hũ đều do ĐÚNG hàm của tool (`app_get_cashflow_summary`) tính, nên trùng số
        với tool: `spent_vnd` là chi của VÍ (nguồn jar và credit, kể cả Trả sau và khoản trả nghĩa vụ), không gồm chuyển hũ và chi ngoài ví.

        - `previous`: kỳ lương trước TÍNH TỚI CÙNG SỐ NGÀY (ngày thứ `period.day_index` của kỳ trước, không quá ngày cuối kỳ trước), để so
          công bằng. Vắng (cùng với `change` và `previous_daily`) khi chưa có giao dịch nào từ ngày đầu kỳ trước trở về trước: kỳ
          trước chưa trọn dữ liệu thì phần thiếu sẽ bị so như chi 0 ₫.
        - `daily`: chi từng ngày của kỳ này (cùng hàm với khoảng một ngày) và lũy kế; `previous_daily`: cả kỳ trước, để đường kỳ trước
          kéo hết kỳ.
        - Tách nghĩa vụ và Trả sau (`obligation_vnd`, `credit_vnd`, `regular_spent_vnd`, `regular_cumulative_vnd`, `change.regular_vnd`):
          chỉ có khi `split_complete` đúng. Cộng từ các dòng chi của `app_list_transactions` cùng bộ lọc với tool; server chỉ trả khi đọc
          hết và số dòng từng hũ khớp `tx_count` của tool. `obligation_vnd` là dòng có `obligation_id`; `credit_vnd` là dòng trả bằng
          Trả sau không gắn nghĩa vụ; chi thường ngày `regular_spent_vnd` = `spent_vnd` − `obligation_vnd`.
        - Chênh lệch (`change`, `by_jar[].change_vnd`) và `net_vnd` (lương trừ chi, không tính tiền vào khác) do server trừ.

        Chỉ đọc, không qua model. Danh tính lấy từ `sub` của JWT; mọi hàm SQL đặt `app.user_id` nên RLS chỉ cho thấy dòng của người gọi.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Dòng tiền của kỳ lương này và kỳ trước cùng thời điểm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token Cognito (không phải ID token), gửi trong header Authorization: Bearer <token>.'
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context. Nếu có, trace-id của nó là `trace_id` của khối; nếu không server sinh.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    JobIdPath:
      name: job_id
      in: path
      required: true
      description: Id lần nạp (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    RowIdPath:
      name: row_id
      in: path
      required: true
      description: Id một dòng của lần nạp (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    JarCodePath:
      name: jar_code
      in: path
      required: true
      description: Mã hũ (khóa của hũ trong một người dùng).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
    TraceIdPath:
      name: trace_id
      in: path
      required: true
      description: Mã trace của câu trả lời cần giải thích (từ `trace_id` của khối).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
    StepIdPath:
      name: step_id
      in: path
      required: true
      description: Id một bước của lộ trình (`step_id`, ổn định trong một phiên bản).
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,31}$'
    RoadmapVersionPath:
      name: version
      in: path
      required: true
      description: Số phiên bản lộ trình.
      schema:
        $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
    RoadmapJobIdPath:
      name: job_id
      in: path
      required: true
      description: Id lần sinh lại lộ trình (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    NudgeIdPath:
      name: nudge_id
      in: path
      required: true
      description: Id bản tin (`nudge_id` của thẻ chủ động, UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    MemoryRecordIdPath:
      name: record_id
      in: path
      required: true
      description: Id bản ghi AgentCore Memory (`mem-...`, 40 đến 50 ký tự).
      schema:
        $ref: '#/components/schemas/MemoryRecordId'
  schemas:
    ErrorCode:
      type: string
      description: Mã lỗi máy đọc được; khớp yofina_core.errors.ErrorCode.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - PARAMS_INVALID
        - JAR_NOT_FOUND
        - INSUFFICIENT_FUNDS
        - AMOUNT_LIMIT_EXCEEDED
        - NEEDS_CONFIRMATION
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_REUSED
