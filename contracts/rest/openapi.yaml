          type: string
          minLength: 1
          maxLength: 200
    TxType:
      type: object
      required: [tx_type, label, direction]
      additionalProperties: false
      properties:
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        label:
          type: string
          minLength: 1
          maxLength: 60
        direction:
          description: out (chi), in (tiền vào).
          type: string
          enum: [out, in]
        is_person_transfer:
          description: |
            Đúng với loại "chuyển tiền cho người khác" (`transfer_person`): màn chọn người nhận dùng cờ này, không đoán theo tên.
            Cờ ở bảng tra `tx_type_map.is_person_transfer` (migration 0008). Server luôn gửi.
          type: boolean
        default_jar:
          description: Hũ chuẩn của loại này (bước 0 của phân loại), nếu người dùng có hũ đó.
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        system_role:
          type: string
          enum: [other_income, unclassified]
    TxTypesResponse:
      type: object
      required: [tx_types]
      additionalProperties: false
      properties:
        tx_types:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/TxType'
    PayeesResponse:
      type: object
      required: [payees]
      additionalProperties: false
      properties:
        payees:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Payee'
    ObligationsResponse:
      type: object
      required: [app_date, obligations, total_due_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
        total_due_vnd:
          description: Tổng amount_vnd của các khoản active trong danh sách.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    FeeLine:
      description: Một dòng của biểu phí có cấu trúc (bảng fee_schedules), đang hiệu lực tại ngày mô phỏng.
      type: object
      required: [fee_type, period, condition_code, source_name, source_url, effective_from]
      additionalProperties: false
      properties:
        fee_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        rate_percent:
          type: number
          minimum: 0
        period:
          type: string
          enum: [per_month, per_transaction, once]
        condition_code:
          type: string
          enum: [always, month_has_transaction, overdue]
        condition_note:
          type: string
          maxLength: 200
        source_name:
          type: string
          maxLength: 200
        source_url:
          type: string
          pattern: '^https://'
        effective_from:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    CreditLineResponse:
      type: object
      required: [app_date, credit_line, fees]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        credit_line:
          oneOf:
            - $ref: '../tools/ledger.results.schema.json#/$defs/CreditLine'
            - type: 'null'
        fees:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FeeLine'
    SalaryEventsResponse:
      type: object
      required: [salary_events]
      additionalProperties: false
      properties:
        salary_events:
          type: array
          maxItems: 20
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/SalaryEvent'
    JarTemplate:
      type: object
      required: [code, name, color_key, icon_key, kind, default_split_percent, is_default]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        purpose:
          type: string
          enum: [buffer, sinking, goal, long_term]
          description: Vai trò tùy chọn của hũ để dành.
        default_split_percent:
          type: number
          minimum: 0
          maximum: 100
        is_default:
          type: boolean
    SplitProposalRequest:
      type: object
      additionalProperties: false
      description: Khoản biết trước trong 12 tháng tới (chưa lưu). Vắng thì chỉ tính theo nghĩa vụ đã khai.
      properties:
        sinking_items:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/SplitProposalKnownItem'
    SplitProposalKnownItem:
      type: object
      additionalProperties: false
      required: [name, amount_vnd, needed_date]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        needed_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    SplitProposalJar:
      type: object
      additionalProperties: false
      required: [code, name, kind, split_before, split_after]
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        kind:
          type: string
          enum: [spending, saving, obligation]
        purpose:
          type: string
          enum: [buffer, sinking, goal, long_term]
        split_before:
          type: number
          minimum: 0
          maximum: 100
        split_after:
          type: number
          minimum: 0
          maximum: 100
        amount_before_vnd:
          description: Phần lương mỗi kỳ trước khi đổi (cùng quy tắc chia của `confirm_salary`).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        amount_after_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        delta_vnd:
          type: integer
    SplitProposalSinkingItem:
      type: object
      additionalProperties: false
      required: [name, amount_vnd, needed_date, remaining_vnd, paydays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        needed_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        remaining_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        paydays:
          type: integer
          minimum: 0
        per_payday_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
    SplitProposalCheck:
      type: object
      additionalProperties: false
      required: [jar_code, jar_name, payday, due_vnd, available_vnd, items]
      properties:
        jar_code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        jar_name:
          type: string
          maxLength: 40
        payday:
          description: Ngày lương kết thúc kỳ; các khoản tính là khoản đến hạn TRƯỚC ngày này.
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        due_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        available_vnd:
          type: integer
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [label, date, amount_vnd]
            properties:
              label:
                type: string
                maxLength: 80
              date:
                $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
              amount_vnd:
                $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        shortfall:
          type: object
          additionalProperties: false
          required: [label, date, shortfall_vnd]
          properties:
            label:
              type: string
              maxLength: 80
            date:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
            shortfall_vnd:
              $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
    SplitProposalResponse:
      type: object
      additionalProperties: false
      required: [app_date, as_of, status, jars]
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          type: string
          format: date-time
        status:
          type: string
          enum: [no_salary, salary_mismatch, no_obligation_jar, no_declarations, aligned, proposed, infeasible]
        salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        obligation_basis:
          type: string
          enum: [declared, template]
          description: '`template`: hũ Nghĩa vụ chưa có số khai, đang giữ tỷ lệ mẫu.'
        obligations_monthly_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        required_percent:
          type: number
          minimum: 0
        reasons:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [jar_code, text]
            properties:
              jar_code:
                type: string
                maxLength: 32
              text:
                type: string
                minLength: 1
                maxLength: 160
        jars:
          type: array
          maxItems: 21
          items:
            $ref: '#/components/schemas/SplitProposalJar'
        sinking_items:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/SplitProposalSinkingItem'
        checks:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/SplitProposalCheck'
        params:
          type: object
          description: Tham số `save_jars` (thay cả danh sách hũ) chỉ có khi `status` là `proposed`.
          required: [jars]
          properties:
            jars:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
        priority_obligations:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, name, kind, cycle, amount_vnd, monthly_vnd, is_essential]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                maxLength: 80
              kind:
                type: string
                enum: [bnpl, loan, rent, bill, subscription]
              cycle:
                type: string
                enum: [once, weekly, monthly, yearly]
              amount_vnd:
                $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
              monthly_vnd:
                $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
              is_essential:
                type: boolean
        salary_check:
          type: object
          additionalProperties: false
          required: [salary_event_id, received_vnd, declared_vnd, deviation_percent]
          properties:
            salary_event_id:
              type: string
              format: uuid
            received_vnd:
              $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
            declared_vnd:
              $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
            deviation_percent:
              type: number
        pending_salary:
          type: object
          additionalProperties: false
          required: [salary_event_id, amount_vnd]
          properties:
            salary_event_id:
              type: string
              format: uuid
            amount_vnd:
              $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
    JarTemplatesResponse:
      type: object
      required: [templates]
      additionalProperties: false
      properties:
        templates:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarTemplate'
    RecordTransactionParams:
      description: |
        Tham số của `record_transaction`. Chuẩn hóa ở server (contracts/README.md): điền `tx_type`
        mặc định (`other_expense` hoặc `income_other`), `funding` mặc định `jar`; nếu thiếu `jar` thì
        dùng hũ trả của nghĩa vụ nếu có `obligation_id`, nếu không thì suy từ loại giao dịch qua bảng tra.
        Khoản chi chưa có hũ vào Chưa phân loại. Tiền vào dùng hũ Tiền vào khác.
        Số tiền của giao dịch đã trả gồm cả khoản phí đã trả cùng giao dịch, nếu có.
        Phí Trả sau đến hạn được tính trong tổng nghĩa vụ. Bản chuẩn hóa mới là thứ được ký.
      type: object
      required: [kind, amount_vnd]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [expense, income]
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        pay_jar:
          description: Hũ trả khoản Trả sau khi đến hạn, nếu chưa lưu nguồn trả.
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        funding:
          description: jar (mặc định) hoặc credit (hạn mức Trả sau mô phỏng; chỉ với chi tiêu). external (ngoài ví) chỉ vào sổ cái qua confirm_rows.
          type: string
          enum: [jar, credit]
        payee_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        counterparty:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: string
          minLength: 1
          maxLength: 200
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        client_ref:
          description: Mã chống ghi trùng khi gửi lại; vào `dedupe_key` của sổ cái.
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]+$'
    AssignJarParams:
      type: object
      required: [transaction_id, jar]
      additionalProperties: false
      properties:
        transaction_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        remember:
          description: once (mặc định) hoặc always (lưu luật `category_rules` cho người nhận hoặc đối tác).
          type: string
          enum: [once, always]
    ObligationChange:
      description: |
        Một thay đổi nghĩa vụ trong `update_profile`. `upsert` không có `obligation_id` là thêm mới và
        cần `kind`, `name` và số tiền (`amount_vnd`, hoặc cặp `amount_min_vnd` + `amount_max_vnd` khi đó
        `amount_vnd` là trung điểm làm tròn xuống); có `obligation_id` là sửa. `delete` cần `obligation_id`
        (đặt trạng thái cancelled). Khoản trả sau (`bnpl`) không khai được.

        **`due_day` hay `due_date`**: `due_day` (1 đến 31) là NGÀY TRONG THÁNG của khoản lặp (`monthly`, và cũng dùng cho `yearly`
        khi cần): kẹp ngày cuối tháng, giữ nguyên qua các kỳ. `due_date` là NGÀY ĐẾN HẠN CỤ THỂ kế tiếp. Khoản `once` bắt buộc
        `due_date`. Khoản `monthly` chỉ cần một trong hai: có `due_day` thì server suy `due_date` (ngày đó sớm nhất không trước
        hôm nay mô phỏng); có `due_date` mà không `due_day` thì `due_day` lấy theo ngày của `due_date`. Khoản `weekly` cần
        `due_date` (kỳ sau cộng 7 ngày; `due_day` không dùng). Khi sửa (`obligation_id`) không điền mặc định nào.
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [upsert, delete]
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        kind:
          type: string
          enum: [loan, rent, bill, subscription]
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_min_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_max_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        fee_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        due_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        cycle:
          type: string
          enum: [once, weekly, monthly, yearly]
        pay_jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        is_essential:
          type: boolean
    UpdateProfileParams:
      description: |
        Phải có ít nhất một trường. Tài khoản chưa có hồ sơ (onboarding): lần gọi đầu phải có cả
        `monthly_salary_vnd` và `payday_day`; server tạo hồ sơ, hai hũ hệ thống và (nếu chưa có hũ nào)
        các hũ `is_default` của `jar_templates` với tỷ lệ mặc định. Dự báo được tính lại sau khi ghi.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        obligation:
          $ref: '#/components/schemas/ObligationChange'
    JarSpec:
      description: |
        Một hũ trong `save_jars`. Có `code` là sửa hũ đó; không có là tạo hũ mới (server sinh `code` từ
        `name`). `color_key` và `icon_key` là khóa giao diện ánh xạ (xem `GET /jar-templates`).
      type: object
      required: [name, color_key, icon_key, kind, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        purpose:
          type: string
          enum: [buffer, sinking, goal, long_term]
          description: Vai trò tùy chọn của hũ để dành.
        sinking_items:
          type: array
          maxItems: 40
          items:
            $ref: '../blocks/jar_summary.schema.json#/$defs/SinkingItem'
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    SaveJarsParams:
      description: |
        Thay cả danh sách hũ người dùng (không gồm hũ hệ thống) theo thứ tự trong mảng (thứ tự hiển thị).
        Hũ có purpose goal cần số tiền và ngày mục tiêu. Khoản của Quỹ dồn có tên duy nhất trong hũ và giữ ngày cần đã lưu.
        Tổng `split_percent` phải bằng 100. Hũ đang có mà không có trong danh sách chỉ bị bỏ khi số dư
        bằng 0 và không còn nghĩa vụ trả bằng hũ đó, nếu không trả 422 `JAR_PROTECTED`.
      type: object
      required: [jars]
      additionalProperties: false
      properties:
        jars:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarSpec'
    ConfirmSalaryParams:
      description: |
        split: chia số tiền lương vào hũ theo `split_percent` (làm tròn xuống từng hũ, phần dư vào hũ có tỷ lệ
        lớn nhất, hòa thì hũ đứng trước). keep_as_other: giữ ở Tiền vào khác (không phải lương). `update_declared_salary`
        chỉ có nghĩa khi `decision` là split: đặt lương đã khai bằng số vừa nhận.
      type: object
      required: [salary_event_id, decision]
      additionalProperties: false
      properties:
        salary_event_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [split, keep_as_other]
        update_declared_salary:
          type: boolean
    IngestSourceKind:
      description: image (ảnh chụp màn hình, hóa đơn) hoặc csv (tệp sao kê).
      type: string
      enum: [image, csv]
    IngestUploadRequest:
      type: object
      required: [source_kind, mime, size_bytes]
      additionalProperties: false
      properties:
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        mime:
          description: MIME của tệp (phải thuộc danh sách cho phép của loại này; S3 ép đúng giá trị này).
          type: string
          minLength: 3
          maxLength: 100
        size_bytes:
          description: Kích thước tệp (byte), không vượt giới hạn của loại này; S3 ép bằng content-length-range.
          type: integer
          minimum: 1
        consent:
          description: |
            Người dùng vừa đồng ý cho nguồn này (ảnh hoặc CSV) trên màn hình. Bắt buộc là true ở lần nạp đầu của nguồn (và sau khi
            rút đồng ý); server ghi `consents` với phiên bản văn bản đồng ý hiện hành (`ingest_consent_version`).
          type: boolean
    IngestUploadResponse:
      type: object
      required: [job_id, key, url, fields, expires_at, max_bytes, mime_types]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        key:
          description: Khóa S3 của tệp, dạng `{user_id}/{job_id}` (không có tên tệp gốc).
          type: string
          minLength: 1
          maxLength: 512
        url:
          description: URL của presigned POST (bucket `yofina-ingest-*`).
          type: string
          pattern: '^https://'
          maxLength: 2048
        fields:
          description: Các trường form phải gửi kèm (nguyên văn, trước trường `file`), gồm policy và chữ ký.
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        max_bytes:
          type: integer
          minimum: 1
        mime_types:
          description: Loại tệp được hỗ trợ của nguồn này (để hiển thị).
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    IngestJobResponse:
      type: object
      required: [job_id, status, source_kind, progress, rows_total, created_at, updated_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJobStatus'
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        rows_total:
          type: integer
          minimum: 0
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
        error_reason:
          $ref: '#/components/schemas/IngestErrorReason'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        updated_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        review:
          description: Có từ trạng thái review (cả khi done).
          $ref: '../blocks/ingest_review.schema.json'
        coverage_change:
          description: Có khi done.
          $ref: '../blocks/coverage_change.schema.json'
    IngestErrorReason:
      type: string
      description: |
        Lý do con khi `error_code = INGEST_NO_TRANSACTIONS` (vắng với mã khác): `unexecuted_form` (màn xác nhận, OTP, biểu mẫu
        chưa thực hiện), `not_completed` (giao dịch không thành công hoặc đang xử lý), `own_account_transfer` (chỉ nạp hoặc chuyển
        giữa tài khoản, ví, thẻ của chính mình), `cash_withdrawal` (rút tiền mặt), `no_amount` (không đọc được số tiền), `no_rows`
        (chứng từ tài chính không có khoản tiền nào, ví dụ bảng phí, màn tra soát). Lý do lấy theo dòng bị loại nhiều nhất.
      enum: [unexecuted_form, not_completed, own_account_transfer, cash_withdrawal, no_amount, no_rows]
    IngestJobSummary:
      description: |
        Một lần nạp trong danh sách gần đây; như `IngestJobResponse` nhưng không có `review` và `coverage_change`.
      type: object
      required: [job_id, status, source_kind, progress, rows_total, created_at, updated_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJobStatus'
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        rows_total:
          type: integer
          minimum: 0
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        updated_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    IngestJobListResponse:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/IngestJobSummary'
    IngestRowJarRequest:
      type: object
      required: [jar]
      additionalProperties: false
      properties:
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
    IngestRowJarResponse:
      type: object
      required: [row_id, suggested_jar, jar_source]
      additionalProperties: false
      properties:
        row_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        suggested_jar:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJar'
        jar_source:
          const: user
    ConfirmRowsParams:
      description: |
        Tham số của `confirm_rows`. Chuẩn hóa (`yofina_core.params.normalize_confirm_rows`, idempotent, không cần trạng thái):
        `rows` sắp theo `row_id`, mỗi dòng `{row_id, jar?, amount_vnd?}`; `reject_row_ids` sắp tăng dần; một dòng không được vừa ghi vừa bỏ;
        ít nhất một dòng. Dòng ghi phải còn mở (`auto_added`, `pending`); dòng `duplicate` không ghi được. `amount_vnd` chỉ nhận ở
        dòng ngoại tệ (có `fx`): số VND người dùng nhập (ví dụ số trên sao kê thẻ, đã gồm phí chuyển đổi); vắng thì ghi số ước
        tính đang hiển thị. Dòng ngoại tệ chưa có tỷ giá (`fx.status = rate_unavailable`) bắt buộc có `amount_vnd`.
      type: object
      required: [job_id]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        rows:
          type: array
          maxItems: 500
          items:
            type: object
            required: [row_id]
            additionalProperties: false
            properties:
              row_id:
                $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
              jar:
                $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
              amount_vnd:
                $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        reject_row_ids:
          type: array
          maxItems: 500
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    ActionResponse:
      description: Biên nhận của `POST /actions`, phân biệt bằng `type`.
      oneOf:
        - $ref: '../blocks/receipt.schema.json'
        - $ref: '../blocks/receipt_action.schema.json'
    JarsResponse:
      type: object
      required: [app_date, as_of, jars, jars_total_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        jars:
          type: array
          maxItems: 20
          items:
            $ref: '../blocks/jar_summary.schema.json#/$defs/JarBalance'
        jars_total_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    ConversationSummary:
      type: object
      required: [conversation_id, turns, last_activity_at, preview]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: integer
          minimum: 1
          description: Số lượt đã lưu.
        last_activity_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        preview:
          type: string
          maxLength: 120
          description: Câu hỏi đầu tiên của cuộc hội thoại, cắt tối đa 120 ký tự.
    ConversationListResponse:
      type: object
      required: [conversations]
      additionalProperties: false
      properties:
        conversations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationSummary'
    ConversationTurn:
      type: object
      required: [trace_id, created_at, user_text, assistant_text, blocks, resolutions]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        user_text:
          type: string
          maxLength: 4000
        assistant_text:
          type: string
          maxLength: 8000
          description: Câu trả lời bằng chữ agent đã phát (có thể rỗng nếu lượt chỉ có khối).
        blocks:
          type: array
          maxItems: 20
          description: Khối UI đã phát ở lượt, theo thứ tự phát (`seq`).
          items:
            $ref: '../blocks/block.schema.json'
        resolutions:
          type: array
          maxItems: 20
          description: Trạng thái của từng khối `confirm` trong `blocks`, cùng thứ tự (một phần tử mỗi khối).
          items:
            $ref: '#/components/schemas/ConfirmResolution'
    ConversationResponse:
      type: object
      required: [conversation_id, turns]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationTurn'
    ConfirmConversationId:
      description: |
        Id cuộc hội thoại chứa khối `confirm` (session id của chat). Gửi cùng `confirm_block_id`
        hoặc không gửi cả hai.
      type: string
      minLength: 1
      maxLength: 256
    ConfirmBlockRef:
      description: |
        `id` của khối `confirm` đang được thực hiện, dạng `confirm:{trace_id}:{params_hash[:12]}`.
        12 ký tự cuối phải khớp hash của `params` đang gửi, nếu không trả PARAMS_MISMATCH. Một
        `confirm_block_id` của một người dùng chỉ được thực hiện một lần (ALREADY_APPLIED).
      type: string
      maxLength: 128
      pattern: '^confirm:[A-Za-z0-9_-]{1,64}:[0-9a-f]{12}$'
    ConfirmResolution:
      description: |
        Trạng thái một khối `confirm` hoặc `confirm_action` trong lượt, do server giữ. `done`: đã thực hiện,
        kèm `receipt` (đúng khối `POST /actions` đã trả) và `resolved_at`; thắng mọi trạng thái khác. `cancelled`:
        người dùng đã bấm "Không" (`POST /confirmations/cancel`), kèm `resolved_at`, không có `receipt`; cũng thắng
        `expired`. `expired`: chưa xử lý và đã quá `expires_at` của đề nghị lúc đọc. `pending`: còn hạn, chưa xử lý.
      oneOf:
        - type: object
          required: [block_id, status, resolved_at, receipt]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: done
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
            receipt:
              $ref: '#/components/schemas/ActionResponse'
        - type: object
          required: [block_id, status, resolved_at]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: cancelled
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - type: object
          required: [block_id, status]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              enum: [pending, expired]
    CancelConfirmationRequest:
      type: object
      required: [conversation_id, confirm_block_id]
      additionalProperties: false
      properties:
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
    CancelConfirmationResponse:
      type: object
      required: [block_id, status, resolved_at]
      additionalProperties: false
      properties:
        block_id:
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        status:
          const: cancelled
        resolved_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    ToolName:
      type: string
      description: |
        Tên tool ghi của Lambda `ledger` (ngắn, không có tiền tố target). Mỗi giá trị có schema `params` riêng, xem `allOf` của
        `ConfirmationRequest` và `ActionRequest` và bảng ở mô tả của `POST /actions`. `confirm_rows` (phase 5) không thuộc tập này:
        xem `IngestToolName`.
      enum: [move_between_jars, record_transaction, assign_jar, update_profile, save_jars, confirm_salary, schedule_nudge]
    ParamsByTool:
      description: |
        Ràng buộc `params` theo `tool` (dùng chung cho `ConfirmationRequest` và `ActionRequest`). `params` chưa chuẩn hóa
        cũng được nhận (server chuẩn hóa lại và chỉ ký bản chuẩn hóa); trường lạ và `user_id` bị từ chối.
      allOf:
        - if:
            properties:
              tool:
                const: move_between_jars
          then:
            properties:
              params:
                $ref: '../blocks/confirm.schema.json#/$defs/MoveParams'
        - if:
            properties:
              tool:
                const: record_transaction
          then:
            properties:
              params:
                $ref: '#/components/schemas/RecordTransactionParams'
        - if:
            properties:
              tool:
                const: assign_jar
          then:
            properties:
              params:
                $ref: '#/components/schemas/AssignJarParams'
        - if:
            properties:
              tool:
                const: update_profile
          then:
            properties:
              params:
                $ref: '#/components/schemas/UpdateProfileParams'
        - if:
            properties:
              tool:
                const: save_jars
          then:
            properties:
              params:
                $ref: '#/components/schemas/SaveJarsParams'
        - if:
            properties:
              tool:
                const: confirm_salary
          then:
            properties:
              params:
                $ref: '#/components/schemas/ConfirmSalaryParams'
        - if:
            properties:
              tool:
                const: schedule_nudge
          then:
            properties:
              params:
                $ref: '#/components/schemas/ScheduleNudgeParams'
    IngestToolName:
      type: string
      description: |
        Tool ghi của Lambda `ingest` (phase 5), chỉ một giá trị. Tool khác gửi tới `/ingest/*` bị `PARAMS_INVALID`.
      enum: [confirm_rows]
    IngestConfirmationRequest:
      description: |
        Thân của `POST /ingest/confirmations`: như `ConfirmationRequest` nhưng `tool` chỉ là `confirm_rows` và `params` theo
        `ConfirmRowsParams`. Màn hình duyệt không có khối `confirm_action`, nên bỏ `conversation_id`, `confirm_block_id`,
        `params_hash`; đường chat (có khối) gửi như `POST /confirmations`.
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/IngestToolName'
        params:
          $ref: '#/components/schemas/ConfirmRowsParams'
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Như `ConfirmationRequest.params_hash`.
    IngestActionRequest:
      description: |
        Thân của `POST /ingest/actions`; như `ActionRequest` nhưng `tool` chỉ là `confirm_rows`.
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/IngestToolName'
        params:
          $ref: '#/components/schemas/ConfirmRowsParams'
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        confirm_token:
          description: Token từ `POST /ingest/confirmations`. Vắng thì không ghi, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    ConfirmationRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: |
            Sao nguyên từ khối `confirm` hoặc `confirm_action` (đã chuẩn hóa), hoặc do màn hình tự dựng. Schema
            theo `tool` ở `ParamsByTool`.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        params_hash:
          description: |
            `params_hash` của khối `confirm` hoặc `confirm_action` người dùng đang nhìn. Nếu gửi, server so với hash
            tự tính từ `tool` và `params`; lệch thì trả PARAMS_MISMATCH. Màn hình không có khối thì bỏ trường này.
          type: string
          pattern: '^[0-9a-f]{64}$'
    ConfirmationResponse:
      type: object
      required: [confirm_token, expires_at, ttl_seconds, tool, params, params_hash]
      additionalProperties: false
      properties:
        confirm_token:
          type: string
          description: Token mờ, dùng một lần, gắn với người dùng, tool và tham số.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          minLength: 3
          maxLength: 1024
        expires_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        ttl_seconds:
          type: integer
          minimum: 1
          description: Thời gian sống của token, từ cấu hình; frontend đếm ngược theo đây.
        tool:
          description: Tool đã ký; `confirm_rows` khi do `POST /ingest/confirmations` cấp, `delete_my_data` khi do `POST /me/delete-data/confirmations` cấp.
          anyOf:
            - $ref: '#/components/schemas/ToolName'
            - $ref: '#/components/schemas/IngestToolName'
            - $ref: '#/components/schemas/PrivacyToolName'
        params:
          description: Bản tham số đã chuẩn hóa mà token đã ký.
          type: object
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        preview:
          description: |
            Bản XEM TRƯỚC do SERVER tính (không ghi gì), cùng hình dạng `changes` và `warnings` của khối `confirm_action`, để
            màn "Xem lại" không tự tính gì: số dư trước và sau của từng hũ, với Trả sau (mô phỏng) thì khoản phải trả ngày
            đến hạn (đã gồm phí lấy từ `fee_schedules`) và hạn mức còn lại, với lương thì phần chia vào từng hũ. Luôn có
            ở phase 2; `warnings` vắng khi không có.
          type: object
          required: [summary, changes]
          additionalProperties: false
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 120
            changes:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '../blocks/confirm_action.schema.json#/$defs/ActionChange'
            warnings:
              type: array
              maxItems: 5
              items:
                type: string
                minLength: 1
                maxLength: 140
    ActionRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: Như `ConfirmationRequest.params`; phải khớp bản đã xác nhận (hash khớp), nếu không PARAMS_MISMATCH.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        confirm_token:
          description: Token từ `POST /confirmations`. Vắng thì không ghi, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    ResetResponse:
      type: object
      required: [reset_at, app_date, clock_offset_days, jars_count, transactions_count]
      additionalProperties: false
      properties:
        reset_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          description: Ngày mô phỏng sau khi đặt lại (ngày neo).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        clock_offset_days:
          type: integer
        jars_count:
          type: integer
          minimum: 0
        transactions_count:
          type: integer
          minimum: 0
        obligations_count:
          description: Số nghĩa vụ đã seed (phase 2).
          type: integer
          minimum: 0
        forecast_ready:
          description: Đúng nếu đã tính xong dự báo đồng bộ trước khi trả lời (phase 2), để mở app là có số.
          type: boolean
    ScheduleNudgeParams:
      description: |
        Tham số của `schedule_nudge` (target planner của agent, và REST). `op` mặc định `create`. create: bắt buộc `kind` và
        `fire_on` (ngày mô phỏng, sau hôm nay), tùy chọn `jar_code`, `note`, `scenario_id`. cancel (nút Hoàn tác): bắt buộc `nudge_id`
        (`reference_id` của biên nhận lúc đặt), không có trường khác. Chuẩn hóa: bỏ khóa null, `op` điền `create`, chuỗi cắt
        khoảng trắng, mã hũ chữ thường, uuid chữ thường; idempotent.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        op:
          type: string
          enum: [create, cancel]
        kind:
          type: string
          enum: [runout_warning, obligation_due, salary_pending, review_needed, low_data, purchase_review]
        fire_on:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        jar_code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        note:
          type: string
          minLength: 1
          maxLength: 120
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        nudge_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
      if:
        required: [op]
        properties:
          op:
            const: cancel
      then:
        required: [nudge_id]
        not:
          anyOf:
            - required: [kind]
            - required: [fire_on]
      else:
        required: [kind, fire_on]
        not:
          required: [nudge_id]
    AffordabilityRequest:
      description: |
        Yêu cầu kiểm tra trước khi quẹt. `funding_source` vắng thì xét cả hai nguồn. `jar` chỉ có nghĩa khi nguồn là hũ. `date` vắng
        thì hôm nay mô phỏng. Không có `user_id`.
      type: object
      required: [amount_vnd]
      additionalProperties: false
      properties:
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        funding_source:
          type: string
          enum: [jar, credit]
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        pay_jar:
          description: Hũ trả khoản Trả sau khi đến hạn, nếu chưa lưu nguồn trả.
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        label:
          type: string
          minLength: 1
          maxLength: 60
        date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    AffordabilityResponse:
      description: Khối `affordability_card` (cả phong bì), cùng khối với tool `forecast___affordability_check`.
      $ref: '../blocks/affordability_card.schema.json'
    TraceResponse:
      description: >-
        Bản ghi lượt cho bảng "Vì sao", gồm khối `explain` đã dựng và chi tiết kỹ thuật. Cùng `data` của tool `audit___get_trace`.
      $ref: '../tools/audit.results.schema.json#/$defs/TraceData'
    FeedbackRequest:
      type: object
      required: [trace_id, option_id, decision]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        block_id:
          description: Id khối `options` hoặc `affordability_card` chứa phương án.
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        option_id:
          description: '`option_id` của phương án trong khối.'
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        decision:
          type: string
          enum: [accepted, rejected]
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        reason:
          description: Lý do ngắn người dùng nêu (tùy chọn, không chứa PII).
          type: string
          minLength: 1
          maxLength: 200
    FeedbackResponse:
      type: object
      required: [feedback_id, decision, recorded_at]
      additionalProperties: false
      properties:
        feedback_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [accepted, rejected]
        recorded_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    ResilienceScoreResponse:
      description: Khối `resilience_score` (cả phong bì), cùng khối với tool `forecast___get_resilience_score`.
      $ref: '../blocks/resilience_score.schema.json'
    StressRequest:
      description: Yêu cầu chạy một cú sốc mẫu. `shock_id` là một trong các mã của `GET /resilience/shocks`.
      type: object
      required: [shock_id]
      additionalProperties: false
      properties:
        shock_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
    StressResultResponse:
      description: Khối `stress_result` (cả phong bì), cùng khối với tool `forecast___stress_test`.
      $ref: '../blocks/stress_result.schema.json'
    ShocksResponse:
      description: Các cú sốc mẫu đọc từ `shocks.json`.
      $ref: '../tools/forecast.results.schema.json#/$defs/ListShocksData'
    RoadmapResponse:
      description: Khối `roadmap` (cả phong bì), cùng khối với tool `planner___get_roadmap`.
      $ref: '../blocks/roadmap.schema.json'
    RoadmapDiffResponse:
      description: Khối `roadmap_diff` (cả phong bì).
      $ref: '../blocks/roadmap_diff.schema.json'
    ReviewListResponse:
      description: Khối `review_list` (cả phong bì).
      $ref: '../blocks/review_list.schema.json'
    RoadmapJob:
      description: |
        Một lần sinh lại lộ trình chạy nền (bảng `roadmap_jobs`), cùng hình dạng với `yofina_core.roadmap.RoadmapJob`. `stage` là bước đang
        chạy; `progress` 0 đến 100. `done` có `version` và `roadmap_id`; `failed` có `error_code` và `error_message`.
      type: object
      required: [job_id, status, trigger, progress, requested_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          type: string
          enum: [queued, running, done, failed]
        trigger:
          type: string
          enum: [user_request, behavior_changed, goal_changed, income_changed, forecast_drift]
        stage:
          type: string
          enum: [context, draft, allocate, suitability, save]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        requested_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        roadmap_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        error_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
    RoadmapVersionSummary:
      description: Một dòng của danh sách phiên bản, cùng hình dạng với `yofina_core.roadmap.RoadmapVersionSummary`.
      type: object
      required: [roadmap_id, version, status, reason_code, reason_text, created_at, app_date, feasibility, counts]
      additionalProperties: false
      properties:
        roadmap_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        status:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersionStatus'
        reason_code:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapReasonCode'
        reason_text:
          type: string
          minLength: 1
          maxLength: 160
        based_on_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        feasibility:
          type: string
          enum: [on_track, relaxed, infeasible]
        counts:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapCounts'
    RoadmapVersionsResponse:
      description: |
        Các phiên bản (mới nhất trước). `active_version` và `proposed_version` chỉ có khi có bản ở trạng thái đó; `current_job` chỉ có khi
        đang có một lần sinh lại chưa xong (queued hoặc running).
      type: object
      required: [versions]
      additionalProperties: false
      properties:
        versions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RoadmapVersionSummary'
        active_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        proposed_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        current_job:
          $ref: '#/components/schemas/RoadmapJob'
    RoadmapStepDecisionRequest:
      description: |
        Quyết định cho một bước của phiên bản `version`. `reason` (tùy chọn, không chứa PII) chỉ có nghĩa khi `rejected` ("hỏi một câu lý do"
        khi từ chối). Không có `user_id`.
      type: object
      required: [version, decision]
      additionalProperties: false
      properties:
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        decision:
          type: string
          enum: [accepted, rejected, pending]
        reason:
          type: string
          minLength: 1
          maxLength: 200
    RoadmapStepEditRequest:
      description: |
        Sửa một bước của phiên bản `version`: đổi số tiền (`amount_vnd`, số nguyên dương) hoặc ngày (`due_date`, ngày mô phỏng), ít nhất một
        trong hai. Không có `user_id`.
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        due_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
      anyOf:
        - required: [amount_vnd]
        - required: [due_date]
    RoadmapVersionDecisionRequest:
      description: '`adopt` là "Dùng bản mới", `keep_previous` là "Giữ bản cũ" (áp cho bản đang chờ chọn).'
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [adopt, keep_previous]
    RegenerateRoadmapRequest:
      description: |
        Yêu cầu sinh lại lộ trình. Mọi trường tùy chọn. `based_on_version` vắng thì lấy bản đang dùng. `alternative_id` là `option_id` của một
        trong hai lựa chọn của bản gốc khi mục tiêu chưa khả thi. `note` là ghi chú tự do của người dùng (lưu ở job, không đi vào sự kiện).
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 200
        alternative_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        based_on_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
    ReviewAskSkipRequest:
      description: Để sau câu hỏi gộp của `ask_date` (ngày mô phỏng).
      type: object
      required: [ask_date]
      additionalProperties: false
      properties:
        ask_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    ReviewAskResponse:
      description: Trạng thái câu hỏi gộp của ngày (cùng `ReviewAsk` của khối `review_list`).
      $ref: '../blocks/review_list.schema.json#/$defs/ReviewAsk'
    BehaviorProfileResponse:
      description: Hồ sơ hành vi (cùng `data` của tool `forecast___get_behavior_profile`).
      $ref: '../blocks/behavior_insight.schema.json#/$defs/BehaviorProfileData'
    NudgeKind:
      type: string
      description: |
        Loại của một dòng `nudges` (`yofina_core.wallet.ALL_NUDGE_KINDS`): sáu loại lên lịch được bằng `schedule_nudge` (phase 3) và ba
        loại chỉ cổng giá trị sinh (`roadmap_proposed`, `resilience_drop`, `behavior_insight`).
      enum: [runout_warning, obligation_due, salary_pending, review_needed, low_data, purchase_review, roadmap_proposed, resilience_drop, behavior_insight]
    NudgeOutcome:
      type: string
      description: Phản hồi với bản tin (`yofina_core.wallet.NUDGE_OUTCOMES`).
      enum: [acted, dismissed, snoozed, less_like_this]
    NudgeGate:
      description: |
        Lý do cổng giá trị chọn bản tin (cột `nudges.gate_reason`, để giải thích và truy vết): hạng của loại trong thứ tự ưu tiên (1 là
        cao nhất, sau khi hạ bậc vì "Ít nhắc loại này"), điểm giá trị và ngưỡng (cùng đơn vị, do cấu hình), số ứng viên đã xét.
      type: object
      required: [rank, score, threshold, candidates]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 20
        score:
          type: number
          minimum: 0
        threshold:
          type: number
          minimum: 0
        candidates:
          type: integer
          minimum: 1
          maximum: 20
        demoted:
          description: Loại này đã bị hạ một bậc vì người dùng bấm "Ít nhắc loại này".
          type: boolean
    Nudge:
      description: |
        Bản tin của hôm nay (một dòng `nudges`, `source = system`). `value_vnd` là giá trị ước tính bằng tiền (ví dụ khoản hụt tránh
        được, tổng chưa phân loại); vắng khi loại đó không đo bằng tiền. `outcome` vắng khi người dùng chưa phản hồi.
      type: object
      required: [nudge_id, kind, app_date, title, reason, gate]
      additionalProperties: false
      properties:
        nudge_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        kind:
          $ref: '#/components/schemas/NudgeKind'
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        title:
          type: string
          minLength: 1
          maxLength: 80
        reason:
          type: string
          minLength: 1
          maxLength: 200
        jar_code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        value_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        gate:
          $ref: '#/components/schemas/NudgeGate'
        outcome:
          $ref: '#/components/schemas/NudgeOutcome'
    NudgeSuppressed:
      type: object
      required: [kind, reason]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/NudgeKind'
        reason:
          description: below_threshold (chưa vượt ngưỡng), demoted (đã hạ bậc vì "Ít nhắc loại này"), quiet_hours (sở thích trong bộ nhớ, ví dụ không nhắc buổi sáng), lower_rank (đã có việc ưu tiên cao hơn).
          type: string
          enum: [below_threshold, demoted, quiet_hours, lower_rank]
    NudgeTodayResponse:
      description: |
        `nudge` và `card` đi cùng nhau (cùng có hoặc cùng vắng): `card` là khối `proactive_card` dựng từ `nudge` (có `nudge_id`, cùng
        `kind`, `title`, `reason`).
      type: object
      required: [app_date, suppressed]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        nudge:
          $ref: '#/components/schemas/Nudge'
        card:
          $ref: '../blocks/proactive_card.schema.json'
        suppressed:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/NudgeSuppressed'
    NudgeFeedbackRequest:
      type: object
      required: [outcome]
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/NudgeOutcome'
        reason:
          description: Lý do ngắn người dùng nêu (tùy chọn, không chứa PII).
          type: string
          minLength: 1
          maxLength: 200
    NudgeFeedbackResponse:
      type: object
      required: [nudge_id, outcome, recorded_at]
      additionalProperties: false
      properties:
        nudge_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        outcome:
          $ref: '#/components/schemas/NudgeOutcome'
        recorded_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    MemoryRecordId:
      type: string
      pattern: '^mem-[A-Za-z0-9_-]{36,46}$'
    MemoryKind:
      type: string
      description: |
        Loại bản ghi (`yofina_core.memory.MEMORY_KINDS`, suy từ namespace): preference (sở thích), fact (sự thật về người dùng),
        session_summary (tóm tắt phiên), behavior (hồ sơ hành vi do batch đêm ghi), lesson (bài học của agent từ phản hồi).
      enum: [preference, fact, session_summary, behavior, lesson]
    MemoryRecord:
      description: Một bản ghi bộ nhớ (không có namespace, strategy id hay `sub`).
      type: object
      required: [record_id, kind, source, text, created_at]
      additionalProperties: false
      properties:
        record_id:
          $ref: '#/components/schemas/MemoryRecordId'
        kind:
          $ref: '#/components/schemas/MemoryKind'
        source:
          description: conversation (trích tự động từ hội thoại bằng chiến lược có sẵn) hoặc system (bản ghi do hệ thống tự tạo).
          type: string
          enum: [conversation, system]
        text:
          type: string
          minLength: 1
          maxLength: 1000
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    MemoryListResponse:
      type: object
      required: [records]
      additionalProperties: false
      properties:
        records:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemoryRecord'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 2048
    MemoryRecordDeleteResponse:
      type: object
      required: [record_id, deleted]
      additionalProperties: false
      properties:
        record_id:
          $ref: '#/components/schemas/MemoryRecordId'
        deleted:
          const: true
    MemoryClearResponse:
      type: object
      required: [deleted_records, deleted_events, failed]
      additionalProperties: false
      properties:
        deleted_records:
          type: integer
          minimum: 0
        deleted_events:
          type: integer
          minimum: 0
        failed:
          description: Số bản ghi hoặc sự kiện xóa lỗi (gọi lại để xóa nốt).
          type: integer
          minimum: 0
    PrivacyToolName:
      type: string
      description: Tool ghi của nhóm quyền riêng tư, chỉ đi qua `/me/delete-data/*` (không thuộc `ToolName`, không phải tool Gateway).
      enum: [delete_my_data]
    DeleteMyDataParams:
      description: Phạm vi xóa; chỉ có `all` (bản chuẩn hóa luôn có `scope`).
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [all]
    DeleteDataConfirmationRequest:
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/PrivacyToolName'
        params:
          $ref: '#/components/schemas/DeleteMyDataParams'
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Như `ConfirmationRequest.params_hash` (màn hình không có khối thì bỏ).
    DeleteDataRequest:
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/PrivacyToolName'
        params:
          $ref: '#/components/schemas/DeleteMyDataParams'
        confirm_token:
          description: Token từ `POST /me/delete-data/confirmations`. Vắng thì không xóa gì, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    DeletionStep:
      description: Một bước của lần xóa. `deleted` là số object (S3), bản ghi và sự kiện (Memory) hoặc dòng (Aurora) đã xóa.
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, done, failed, skipped]
        deleted:
          type: integer
          minimum: 0
        error_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 40
    DataDeletion:
      description: |
        Một lần "Xóa dữ liệu của tôi" (dòng `data_deletions`; `yofina_core.privacy.DataDeletion` kiểm trạng thái khớp các bước).
      type: object
      required: [deletion_id, status, scope, requested_at, steps]
      additionalProperties: false
      properties:
        deletion_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          type: string
          enum: [running, done, partial, failed]
        scope:
          type: string
          enum: [all]
        requested_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        steps:
          type: object
          required: [s3, memory, aurora]
          additionalProperties: false
          properties:
            s3:
              $ref: '#/components/schemas/DeletionStep'
            memory:
              $ref: '#/components/schemas/DeletionStep'
            aurora:
              $ref: '#/components/schemas/DeletionStep'
    UserRef:
      description: Mã giả danh của người dùng trên màn vận hành (12 ký tự hex đầu của sha256 của `sub`), không phải `sub`.
      type: string
      pattern: '^[0-9a-f]{12}$'
    OpsTraceSummary:
      type: object
      required: [trace_id, created_at, user_ref, outcome, duration_ms, model_calls, input_tokens, output_tokens, est_cost_vnd, tool_calls, tool_errors, rules_failed]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        user_ref:
          $ref: '#/components/schemas/UserRef'
        intent:
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
        outcome:
          type: string
          enum: [ok, rejected, error]
        code:
          $ref: '#/components/schemas/ErrorCode'
        duration_ms:
          type: integer
          minimum: 0
        model_calls:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        est_cost_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        tool_calls:
          type: integer
          minimum: 0
        tool_errors:
          type: integer
          minimum: 0
        rules_failed:
          type: integer
          minimum: 0
    OpsTraceListResponse:
      type: object
      required: [traces]
      additionalProperties: false
      properties:
        traces:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OpsTraceSummary'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 200
    OpsToolCall:
      description: Một lần gọi tool trong lượt (từ `step_timings` có `step` là tên đầy đủ `<target>___<tool>`).
      type: object
      required: [target, tool, ms, status]
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [ledger, forecast, knowledge, planner, audit, ingest]
        tool:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        ms:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ok, error, denied]
        code:
          $ref: '#/components/schemas/ErrorCode'
    OpsTraceDetail:
      description: |
        Mọi bước của một lượt cho màn trace X1. `steps` là `step_timings` nguyên thứ tự; `tool_calls` là phần của nó ứng với lần gọi tool.
        `data_used` đã che PII (`pii_masked` luôn đúng); không có câu hỏi, câu trả lời hay nội dung khối.
      type: object
      required: [trace_id, created_at, user_ref, outcome, duration_ms, steps, tool_calls, rules_checked, data_used, blocks_emitted, token_usage, est_cost_vnd, pii_masked]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        user_ref:
          $ref: '#/components/schemas/UserRef'
        intent:
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
        outcome:
          type: string
          enum: [ok, rejected, error]
        code:
          $ref: '#/components/schemas/ErrorCode'
        duration_ms:
          type: integer
          minimum: 0
        steps:
          type: array
          maxItems: 30
          items:
            $ref: '../tools/audit.results.schema.json#/$defs/TraceStep'
        tool_calls:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/OpsToolCall'
        rules_checked:
          type: array
          maxItems: 20
          items:
            $ref: '../blocks/explain.schema.json#/$defs/RuleCheck'
        data_used:
          type: array
          maxItems: 20
          items:
            $ref: '../blocks/explain.schema.json#/$defs/DataUsed'
        confidence:
          $ref: '../blocks/explain.schema.json#/$defs/ExplainConfidence'
        blocks_emitted:
          type: array
          maxItems: 40
          items:
            $ref: '../tools/audit.results.schema.json#/$defs/TraceBlockRef'
        token_usage:
          $ref: '../tools/audit.results.schema.json#/$defs/TokenUsage'
        est_cost_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        pii_masked:
          const: true
    OpsDayModelCalls:
      description: |
        Lượt gọi model của một ngày. Trần gọi model tính theo TỪNG model (`yofina_core.llm`), nên so với trần thì dùng `by_model`; `cap`
        chỉ là tổng trần của mọi model, để tham khảo.
      type: object
      required: [day, model_calls, cap]
      additionalProperties: false
      properties:
        day:
          description: |
            Ngày theo múi giờ tính trần gọi model (`budget_timezone` của `llm_defaults.json`, hiện `Asia/Ho_Chi_Minh`), đúng khóa `day`
            của bảng `yofina-usage`; theo thời điểm thật, không theo ngày mô phỏng. Khi không đọc được `yofina-usage`, số lấy từ bản ghi
            lượt của agent (`app_ops_model_calls_by_day`, chỉ lượt gọi của agent nên thấp hơn số thật), ngày là ngày UTC và không có `by_model`.
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        model_calls:
          description: Tổng lượt gọi model trong ngày (mọi model, mọi thành phần).
          type: integer
          minimum: 0
        cap:
          description: Tổng trần ngày của mọi model đang cấu hình (không phải trần của một model nào).
          type: integer
          minimum: 1
        by_model:
          description: |
            Tách theo model id (khóa `model` của `yofina-usage`), chỉ model có lượt gọi trong ngày, xếp theo `model`. Tổng `model_calls`
            bằng `model_calls` của ngày. Vắng khi số lấy từ bản ghi lượt (không đọc được `yofina-usage`).
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/OpsModelDayCalls'
    OpsModelDayCalls:
      description: Lượt gọi một model trong ngày so với trần ngày của chính model đó.
      type: object
      required: [model, model_calls]
      additionalProperties: false
      properties:
        model:
          description: Model id hoặc inference profile id của Bedrock như trong `llm_defaults.json` (ví dụ `global.amazon.nova-2-lite-v1:0`).
          type: string
          minLength: 1
          maxLength: 200
        model_calls:
          type: integer
          minimum: 0
        cap:
          description: |
            Trần ngày của model này (lớn nhất trong các vai dùng nó, `daily_cap` của `llm_defaults.json` hoặc giá trị ghi đè). Vắng khi
            model không còn trong cấu hình hiện tại.
          type: integer
          minimum: 0
    OpsSummaryResponse:
      description: Số tổng hợp trong `from`..`to`. `latency_ms` vắng khi không có lượt nào.
      type: object
      required: [from, to, turns, turns_rejected, turns_error, tool_calls, tool_errors, tool_error_rate, rule_fails, model_calls_by_day, est_cost_vnd]
      additionalProperties: false
      properties:
        from:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        to:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        turns:
          type: integer
          minimum: 0
        turns_rejected:
          type: integer
          minimum: 0
        turns_error:
          type: integer
          minimum: 0
        latency_ms:
          type: object
          required: [p50, p95]
          additionalProperties: false
          properties:
            p50:
              type: integer
              minimum: 0
            p95:
              type: integer
              minimum: 0
        tool_calls:
          type: integer
          minimum: 0
        tool_errors:
          type: integer
          minimum: 0
        tool_error_rate:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        rule_fails:
          type: integer
          minimum: 0
        model_calls_by_day:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/OpsDayModelCalls'
        est_cost_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    CashflowPeriod:
      description: Kỳ đang xem. `day_index` là ngày thứ mấy của kỳ (ngày lương là 1); `days_total` là số ngày của cả kỳ.
      type: object
      required: [kind, from_date, to_date, end_date, day_index, days_total]
      additionalProperties: false
      properties:
        kind:
          description: '`pay_period` (theo ngày lương trong hồ sơ) hoặc `calendar_month` (chưa khai ngày lương).'
          type: string
          enum: [pay_period, calendar_month]
        from_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        to_date:
          description: Hôm nay (ngày mô phỏng).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        end_date:
          description: Ngày cuối của kỳ (hôm trước ngày lương kế tiếp).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        day_index:
          type: integer
          minimum: 1
          maximum: 31
        days_total:
          type: integer
          minimum: 1
          maximum: 31
    CashflowTotals:
      description: |
        Tổng của một khoảng, cùng số với `data` của tool `get_cashflow_summary` cho đúng khoảng `from_date`..`to_date`. Ba trường tách
        (`obligation_vnd`, `credit_vnd`, `regular_spent_vnd`) chỉ có khi `split_complete` đúng.
      type: object
      required: [from_date, to_date, salary_income_vnd, other_income_vnd, spent_vnd, net_vnd]
      additionalProperties: false
      properties:
        from_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        to_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        end_date:
          description: Chỉ ở `previous`, ngày cuối của cả kỳ trước (`previous_daily` kéo tới đây).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        salary_income_vnd:
          description: Tiền vào loại lương. Đây là thu nhập.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        other_income_vnd:
          description: Mọi tiền vào khác lương. KHÔNG tính là thu nhập.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        spent_vnd:
          description: Tổng chi của ví (như tool).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        net_vnd:
          description: Lương trừ chi (`salary_income_vnd` − `spent_vnd`), không tính tiền vào khác. Âm khi chi nhiều hơn lương.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        obligation_vnd:
          description: Phần chi là khoản trả nghĩa vụ (dòng có `obligation_id`).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        credit_vnd:
          description: Phần chi trả bằng Trả sau (mô phỏng), không gắn nghĩa vụ.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        regular_spent_vnd:
          description: Chi thường ngày = `spent_vnd` − `obligation_vnd` (gồm món mua bằng Trả sau).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    CashflowJar:
      description: |
        Chi của một hũ kỳ này (`spent_vnd`, `tx_count` như `by_jar` của tool), kèm kỳ trước cùng thời điểm khi có `previous`
        (`previous_spent_vnd`, `change_vnd`, cùng có hoặc cùng vắng) và phần tách khi `split_complete`. Hũ chỉ có chi ở kỳ trước vẫn
        có mặt với `spent_vnd` 0. Mảng sắp theo `spent_vnd` giảm dần.
      type: object
      required: [jar, name, spent_vnd, tx_count]
      additionalProperties: false
      properties:
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        spent_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        tx_count:
          type: integer
          minimum: 0
        obligation_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        credit_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        previous_spent_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        change_vnd:
          description: '`spent_vnd` − `previous_spent_vnd`.'
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    CashflowDay:
      description: Một ngày của kỳ. `cumulative_vnd` là lũy kế `spent_vnd` từ đầu kỳ; hai trường tách chỉ có khi `split_complete`.
      type: object
      required: [date, day_index, spent_vnd, cumulative_vnd]
      additionalProperties: false
      properties:
        date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        day_index:
          type: integer
          minimum: 1
          maximum: 31
        spent_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        cumulative_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        obligation_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        regular_cumulative_vnd:
          description: Lũy kế chi thường ngày (bỏ khoản trả nghĩa vụ).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    CashflowResponse:
      type: object
      required: [as_of, app_date, period, current, by_jar, daily, unclassified_pending_vnd, split_complete]
      additionalProperties: false
      properties:
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        period:
          $ref: '#/components/schemas/CashflowPeriod'
        current:
          $ref: '#/components/schemas/CashflowTotals'
        previous:
          description: Kỳ trước tính tới cùng số ngày. Vắng khi chưa có giao dịch nào từ ngày đầu kỳ trước trở về trước.
          $ref: '#/components/schemas/CashflowTotals'
        change:
          description: Kỳ này trừ kỳ trước cùng thời điểm. Có khi và chỉ khi có `previous`.
          type: object
          required: [spent_vnd]
          additionalProperties: false
          properties:
            spent_vnd:
              $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
            regular_vnd:
              description: Chênh lệch chi thường ngày (chỉ khi `split_complete`).
              $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        by_jar:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/CashflowJar'
        daily:
          description: Từ ngày đầu kỳ tới hôm nay, mỗi ngày một phần tử (ngày không chi có `spent_vnd` 0).
          type: array
          minItems: 1
          maxItems: 31
          items:
            $ref: '#/components/schemas/CashflowDay'
        previous_daily:
          description: Cả kỳ trước, mỗi ngày một phần tử. Có khi và chỉ khi có `previous`.
          type: array
          minItems: 1
          maxItems: 31
          items:
            $ref: '#/components/schemas/CashflowDay'
        unclassified_pending_vnd:
          description: Như tool. Đã chi nhưng đang ở hũ Chưa phân loại (giá trị tuyệt đối của số dư âm, số hiện tại, không theo kỳ).
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        split_complete:
          description: Đúng khi có các trường tách nghĩa vụ và Trả sau (đọc hết và khớp tool ở cả hai kỳ).
          type: boolean
  responses:
    BadRequest:
      description: PARAMS_INVALID (tham số sai định dạng hoặc vô lý).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: UNAUTHENTICATED. JWT authorizer có thể trả thân rỗng 401 trước khi tới Lambda.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN, TOKEN_INVALID, TOKEN_EXPIRED hoặc CONSENT_REQUIRED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: JAR_NOT_FOUND, TRANSACTION_NOT_FOUND, OBLIGATION_NOT_FOUND, PAYEE_NOT_FOUND, SALARY_EVENT_NOT_FOUND, TRACE_NOT_FOUND, NUDGE_NOT_FOUND, FEE_SCHEDULE_NOT_FOUND, FORECAST_NOT_APPLICABLE, INGEST_JOB_NOT_FOUND, ROADMAP_NOT_FOUND, SHOCK_NOT_FOUND hoặc MEMORY_RECORD_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: TOKEN_REUSED, PARAMS_MISMATCH, ALREADY_APPLIED, DUPLICATE_TRANSACTION, INGEST_JOB_NOT_READY, INGEST_DUPLICATE_FILE hoặc ROADMAP_VERSION_CONFLICT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: INSUFFICIENT_FUNDS, AMOUNT_LIMIT_EXCEEDED, CREDIT_LIMIT_EXCEEDED, JAR_PROTECTED, PROFILE_INCOMPLETE, SCENARIO_INVALID, INGEST_NOT_FINANCIAL hoặc ROADMAP_INVALID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: OFFER_EXPIRED. Đề nghị đã quá hạn; hãy hỏi lại để có đề nghị mới.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NeedsConfirmation:
      description: NEEDS_CONFIRMATION. Chưa ghi gì; hãy lấy token ở `POST /confirmations`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: INGEST_TOO_LARGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: INGEST_UNSUPPORTED_TYPE (thông điệp liệt kê loại tệp được hỗ trợ).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: DATABASE_UNAVAILABLE, FORECAST_UNAVAILABLE hoặc MEMORY_UNAVAILABLE. Thử lại sau vài giây (Aurora có thể đang thức dậy).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
