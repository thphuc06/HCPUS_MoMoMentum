        và sau, số ngày trụ được của toàn bộ tiền và của riêng hũ Dự phòng, khoản thiếu. CÙNG khối với tool `forecast___stress_test`.
        Không LLM, không ghi gì (POST chỉ để có thân yêu cầu). Mã cú sốc lạ thì 404 `SHOCK_NOT_FOUND`.
