        đang dùng thì bản mới nhất). `version` chọn đúng một phiên bản; `which` chọn theo trạng thái (`active`, `proposed` là bản mới
        chờ người dùng chọn, `latest`). Trạng thái từng bước (`pending`, `accepted`, `rejected`) đã được gộp vào khối. Chưa có lộ
