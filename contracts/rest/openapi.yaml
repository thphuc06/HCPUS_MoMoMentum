      x-http-status:
        UNAUTHENTICATED: 401
        FORBIDDEN: 403
        PARAMS_INVALID: 400
        JAR_NOT_FOUND: 404
        INSUFFICIENT_FUNDS: 422
        AMOUNT_LIMIT_EXCEEDED: 422
        NEEDS_CONFIRMATION: 428
        TOKEN_INVALID: 403
        TOKEN_EXPIRED: 403
        TOKEN_REUSED: 409
        PARAMS_MISMATCH: 409
        ALREADY_APPLIED: 409
        RATE_LIMITED: 429
        MODEL_BUDGET_EXCEEDED: 503
        DATABASE_UNAVAILABLE: 503
        INTERNAL_ERROR: 500
        PROFILE_INCOMPLETE: 422
        TRANSACTION_NOT_FOUND: 404
        OBLIGATION_NOT_FOUND: 404
        PAYEE_NOT_FOUND: 404
        SALARY_EVENT_NOT_FOUND: 404
        JAR_PROTECTED: 422
        CREDIT_LIMIT_EXCEEDED: 422
        DUPLICATE_TRANSACTION: 409
        FORECAST_UNAVAILABLE: 503
        OFFER_EXPIRED: 410
        TRACE_NOT_FOUND: 404
        NUDGE_NOT_FOUND: 404
        FEE_SCHEDULE_NOT_FOUND: 404
        FORECAST_NOT_APPLICABLE: 404
        SCENARIO_INVALID: 422
        CONSENT_REQUIRED: 403
        INGEST_JOB_NOT_FOUND: 404
        INGEST_JOB_NOT_READY: 409
        INGEST_UNSUPPORTED_TYPE: 415
        INGEST_TOO_LARGE: 413
        INGEST_NOT_FINANCIAL: 422
        INGEST_DUPLICATE_FILE: 409
        ROADMAP_NOT_FOUND: 404
        ROADMAP_INVALID: 422
        ROADMAP_VERSION_CONFLICT: 409
        SHOCK_NOT_FOUND: 404
        MEMORY_RECORD_NOT_FOUND: 404
        MEMORY_UNAVAILABLE: 503
        INGEST_NO_TRANSACTIONS: 422
      x-meaning:
        UNAUTHENTICATED: Thiếu hoặc sai access token.
        FORBIDDEN: Không được phép (token xác nhận không thuộc người dùng này, v.v.).
        PARAMS_INVALID: Tham số sai định dạng hoặc vô lý (cùng hũ, số tiền không dương...).
        JAR_NOT_FOUND: Mã hũ không tồn tại với người dùng này.
        INSUFFICIENT_FUNDS: Hũ nguồn không đủ số dư.
        AMOUNT_LIMIT_EXCEEDED: Vượt hạn mức số tiền một lần (cấu hình, cùng giá trị với luật Cedar).
        NEEDS_CONFIRMATION: Thao tác ghi cần xác nhận; chưa ghi gì.
        TOKEN_INVALID: Token sai định dạng, chữ ký sai, cho tool khác hoặc cho người dùng khác.
        TOKEN_EXPIRED: Token đã hết hạn (quá 2 phút kể từ lúc cấp).
        TOKEN_REUSED: Token đã được dùng (replay).
        PARAMS_MISMATCH: Tham số khác với tham số đã được xác nhận (hash không khớp), hoặc `confirm_block_id` không thuộc thao tác này.
        ALREADY_APPLIED: Đề nghị (`confirm_block_id`) này đã được thực hiện rồi; không ghi thêm gì, kể cả khi có token mới hợp lệ.
        RATE_LIMITED: Quá giới hạn tần suất.
        MODEL_BUDGET_EXCEEDED: Chạm trần lượt gọi model trong ngày (agent, không phải REST).
        DATABASE_UNAVAILABLE: Aurora đang thức dậy hoặc không sẵn sàng; thử lại sau vài giây.
        INTERNAL_ERROR: Lỗi không lường trước; xem log theo trace_id.
        PROFILE_INCOMPLETE: Chưa khai lương và ngày nhận lương nên chưa làm được việc này (ví dụ dự báo).
        TRANSACTION_NOT_FOUND: Mã giao dịch không tồn tại với người dùng này.
        OBLIGATION_NOT_FOUND: Mã nghĩa vụ không tồn tại với người dùng này.
        PAYEE_NOT_FOUND: Mã người nhận không tồn tại với người dùng này.
        SALARY_EVENT_NOT_FOUND: Mã sự kiện lương không tồn tại với người dùng này.
        JAR_PROTECTED: Hũ hệ thống hoặc hũ còn tiền hay còn nghĩa vụ nên không sửa hoặc bỏ được.
        CREDIT_LIMIT_EXCEEDED: Vượt hạn mức Trả sau (mô phỏng) còn lại.
        DUPLICATE_TRANSACTION: Giao dịch trùng khóa khử trùng (cùng ngày, số tiền, đối tác, mã tham chiếu) với giao dịch đã có.
        FORECAST_UNAVAILABLE: Chưa có dự báo cho hũ này và chưa tính được ngay; thử lại sau ít phút.
        OFFER_EXPIRED: Đề nghị (khối confirm hoặc confirm_action) đã quá `expires_at`; hãy hỏi lại. Khác TOKEN_EXPIRED (token quá 2 phút).
        TRACE_NOT_FOUND: Không có trace này với người dùng (không tồn tại hoặc của người khác; không phân biệt).
        NUDGE_NOT_FOUND: Mã lời nhắc không tồn tại với người dùng này (hủy lời nhắc đã hủy hoặc đã gửi).
        FEE_SCHEDULE_NOT_FOUND: Không có biểu phí cho loại phí hoặc sản phẩm này.
        FORECAST_NOT_APPLICABLE: Hũ hệ thống (Tiền vào khác, Chưa phân loại) không có dự báo.
        SCENARIO_INVALID: Kịch bản đúng dạng nhưng vô lý (ngày đã qua, hũ sai loại, vượt khoảng dự báo).
        CONSENT_REQUIRED: Chưa đồng ý cho nguồn nạp này (ảnh hoặc CSV); gửi lại với consent true sau khi người dùng đồng ý.
        INGEST_JOB_NOT_FOUND: Lần nạp (hoặc dòng của nó) không tồn tại với người dùng này.
        INGEST_JOB_NOT_READY: Lần nạp chưa ở trạng thái làm được việc này (chưa đọc xong, đã chốt, đã lỗi), hoặc dòng không còn mở.
        INGEST_UNSUPPORTED_TYPE: Loại tệp không được hỗ trợ; thông điệp liệt kê loại được hỗ trợ.
        INGEST_TOO_LARGE: Tệp lớn hơn giới hạn cấu hình của loại này.
        INGEST_NOT_FINANCIAL: Tệp không phải tài liệu tài chính (sao kê, hóa đơn, lịch sử giao dịch) nên không đọc dòng nào.
        INGEST_DUPLICATE_FILE: Cùng nội dung tệp đã được nạp ở một lần nạp khác còn hiệu lực.
        ROADMAP_NOT_FOUND: Chưa có lộ trình, hoặc không có phiên bản, bước hoặc lần sinh lại này với người dùng (của người khác thì cũng như không có).
        ROADMAP_INVALID: Lộ trình hoặc bước sai cấu trúc, hoặc vi phạm luật suitability mức block (thông điệp nêu mã luật để sửa); không lưu gì.
        ROADMAP_VERSION_CONFLICT: Phiên bản gốc đã bị thay hoặc bỏ, hoặc bản này không còn ở trạng thái làm được việc này (ví dụ không còn chờ chọn); hãy đọc lại lộ trình.
        SHOCK_NOT_FOUND: Mã cú sốc không có trong danh sách cú sốc mẫu.
        MEMORY_RECORD_NOT_FOUND: Không có bản ghi bộ nhớ này với người dùng (đã xóa, không tồn tại hoặc của người khác; không phân biệt).
        MEMORY_UNAVAILABLE: AgentCore Memory không trả lời hoặc từ chối (giới hạn tần suất); thử lại sau ít phút. Dữ liệu khác không bị ảnh hưởng.
        INGEST_NO_TRANSACTIONS: Tệp là chứng từ tài chính nhưng không còn giao dịch nào để duyệt sau khi lọc (màn chưa thực hiện, giao dịch không thành công, chỉ chuyển giữa tài khoản của chính mình, rút tiền mặt, không đọc được số tiền). Lý do con ở error_reason của job.
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Câu tiếng Việt hiển thị được cho người dùng, không chứa dữ liệu nhạy cảm.
              minLength: 1
              maxLength: 280
            trace_id:
              $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
    Profile:
      description: |
        Hồ sơ đã khai. `onboarded` đúng khi đã có cả lương và ngày nhận (hai thứ bắt buộc duy nhất).
        `display_name` luôn có: lấy từ hồ sơ, tài khoản chưa có hồ sơ thì server dùng claim `name`
        hoặc `cognito:username` của JWT (không dùng email).
      type: object
      required: [display_name, onboarded]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        onboarded:
          type: boolean
    ProfileResponse:
      type: object
      required: [app_date, as_of, profile]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        profile:
          $ref: '#/components/schemas/Profile'
    JarKind:
      description: spending (chi tiêu), saving (tiết kiệm), obligation (nghĩa vụ), system (hũ hệ thống Tiền vào khác và Chưa phân loại).
      type: string
      enum: [spending, saving, obligation, system]
    JarFull:
      description: |
        Một hũ, đủ để vẽ thẻ hũ trên Tổng quan và Danh sách hũ. `balance_vnd` có dấu: chỉ hũ hệ thống
        Chưa phân loại mới âm. Các trường dự báo (`status`, `runout_date`, `p_shortfall`, `confidence_band`) lấy từ
        lần chạy dự báo mới nhất có chứa hũ; vắng nếu hũ chưa có dự báo (hũ hệ thống không có dự báo).
        `p_shortfall` chỉ có khi đủ tin cậy (xem khối `forecast_timeline`).
      type: object
      required: [code, name, color_key, icon_key, kind, balance_vnd, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          $ref: '#/components/schemas/JarKind'
        system_role:
          type: string
          enum: [other_income, unclassified]
        balance_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        purpose:
          type: string
          enum: [buffer, sinking, goal, long_term]
          description: Vai trò tùy chọn của hũ để dành.
        sinking_items:
          type: array
          maxItems: 40
          items:
            $ref: '../blocks/jar_summary.schema.json#/$defs/SinkingItem'
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        status:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/JarStatus'
        runout_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        p_shortfall:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        forecast_floor_vnd:
          description: |
            Số dư dự báo (P50) THẤP NHẤT từ ngày dự báo đầu tiên tới trước kỳ lương của lần chạy mới nhất có chứa hũ, để vẽ vạch
            "mực dự báo" trên thẻ hũ. Có dấu (âm là hụt). Vắng khi hũ chưa có dự báo. Server tính từ bảng `forecasts` (hàm
            `app_get_forecast_summaries`, migration 0008); pipeline dự báo không ghi thêm gì.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    OverviewBalance:
      type: object
      required: [total_vnd, jars_total_vnd, other_income_vnd, unclassified_vnd]
      additionalProperties: false
      properties:
        total_vnd:
          description: Tổng số dư của mọi hũ, gồm Tiền vào khác và Chưa phân loại (= jars_total_vnd + other_income_vnd + unclassified_vnd).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        jars_total_vnd:
          description: Tổng số dư các hũ người dùng (không gồm hũ hệ thống).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        other_income_vnd:
          description: Số dư hũ Tiền vào khác. Không phải thu nhập.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        unclassified_vnd:
          description: Số dư hũ Chưa phân loại (có dấu, thường âm). Giao diện ghi "đã chi, chưa xếp hũ" theo giá trị tuyệt đối khi âm.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    NextPayday:
      type: object
      required: [date, days_until, state]
      additionalProperties: false
      properties:
        date:
          description: Ngày lương kế tiếp (sau hôm nay mô phỏng), theo ngày lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        days_until:
          type: integer
          minimum: 1
          maximum: 400
        expected_vnd:
          description: Lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        state:
          description: expected (chưa về), pending_confirmation (đã nhận, chờ xác nhận chia), confirmed (kỳ lương hiện tại đã xác nhận).
          type: string
          enum: [expected, pending_confirmation, confirmed]
        salary_event_id:
          description: Có khi state là pending_confirmation.
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    ForecastMeta:
      description: Chất lượng của lần chạy dự báo mới nhất, để hiện dải "độ phủ dữ liệu", "ước lượng ban đầu", "số liệu cũ".
      type: object
      required: [computed_at, run_app_date, stale, is_initial_estimate, confidence_band, history_days, model]
      additionalProperties: false
      properties:
        computed_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        run_app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        stale:
          description: Quá hạn độ tươi hoặc ngày mô phỏng đã sang ngày khác so với run_app_date. Tổng quan không tự tính lại; bấm vào hũ (GET /forecasts/{jar_code}) sẽ tính lại.
          type: boolean
        is_initial_estimate:
          type: boolean
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        coverage:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        history_days:
          type: integer
          minimum: 0
        model:
          type: string
          minLength: 1
          maxLength: 40
    OverviewResponse:
      type: object
      required:
        - app_date
        - as_of
        - profile
        - balance
        - jars
        - system_jars
        - next_payday
        - forecast
        - proactive_card
        - credit_line
        - obligations_due
