  /roadmap/steps/{step_id}/decision:
    post:
      tags: [roadmap]
      operationId: decideRoadmapStep
      summary: Chấp nhận, từ chối hoặc đưa về chờ một bước
      x-lambda: ledger
      description: |
        Ghi trạng thái một bước của phiên bản `version` (bản `active` hoặc `proposed`), trả khối `roadmap` đã cập nhật. KHÔNG đổi số dư và
        KHÔNG tự thực hiện `action` của bước (muốn thực hiện thì dùng `POST /confirmations` rồi `POST /actions` với `action.tool` và
        `action.params`), nên không qua token. Idempotent: gửi lại cùng quyết định không đổi gì. Ghi một dòng `feedback`
        (`block_id` là id khối `roadmap`, `option_id` là `step_id`; `decision` accepted hoặc rejected, `reason` nếu có) và `audit_events`.
        `pending` xóa quyết định đã ghi (hoàn tác). Phiên bản đã bị thay hoặc bỏ thì 409 `ROADMAP_VERSION_CONFLICT`; bước hoặc phiên
        bản không có thì 404 `ROADMAP_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/StepIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapStepDecisionRequest'
      responses:
        '200':
          description: Khối `roadmap` sau khi cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /roadmap/steps/{step_id}/edit:
    post:
      tags: [roadmap]
      operationId: editRoadmapStep
      summary: Sửa một bước (lưu phiên bản mới, không sinh lại toàn bộ)
      x-lambda: ledger
      description: |
        Người dùng đổi số tiền hoặc ngày của MỘT bước. Server lưu một phiên bản MỚI (lý do `step_edited`, trạng thái `active` ngay,
        bản gốc `version` thành `superseded`, bản chờ nếu có bị bỏ), bước đã sửa có `edited` đúng và trạng thái `accepted`, các bước khác
        giữ nguyên trạng thái. Chạy lại luật suitability cho bước đã sửa (vi phạm mức block thì 422 `ROADMAP_INVALID`, không lưu), ghi
        một dòng `feedback` (accepted, lý do `edited`) và `audit_events`. KHÔNG sinh lại toàn bộ lộ trình, không gọi model, không đổi số dư.
        Trả khối `roadmap` của phiên bản mới. Bản gốc đã bị thay thì 409 `ROADMAP_VERSION_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/StepIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapStepEditRequest'
      responses:
        '200':
          description: Khối `roadmap` của phiên bản mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /roadmap/versions/{version}/decision:
    post:
      tags: [roadmap]
      operationId: decideRoadmapVersion
      summary: Dùng bản mới hoặc giữ bản cũ
      x-lambda: ledger
      description: |
        Quyết định với bản chờ (`proposed`) do hệ thống sinh lại: `adopt` ("Dùng bản mới") làm nó thành `active` và bản đang dùng
        thành `superseded`; `keep_previous` ("Giữ bản cũ") bỏ nó (`discarded`), bản đang dùng giữ nguyên. Idempotent: gửi lại cùng quyết
        định trả cùng kết quả. Trả khối `roadmap` của bản được chọn (ở `adopt` là bản mới, ở `keep_previous` là bản đã bỏ để giao diện
        hiện trạng thái). Bản không còn chờ chọn thì 409 `ROADMAP_VERSION_CONFLICT`; không có phiên bản đó thì 404 `ROADMAP_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/RoadmapVersionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapVersionDecisionRequest'
      responses:
        '200':
          description: Khối `roadmap` của bản được chọn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /roadmap/regenerate:
    post:
      tags: [roadmap]
      operationId: regenerateRoadmap
      summary: Yêu cầu sinh lại lộ trình (chạy nền)
      x-lambda: ledger
      description: |
        Ghi một dòng `roadmap_jobs` (trigger `user_request`), phát sự kiện `roadmap.regeneration_requested` rồi trả NGAY job (HTTP 200,
        `status` queued). Việc sinh (Roadmap agent, `optimize_allocation`, `check_suitability`, `save_roadmap`) chạy nền; giao diện hỏi tiến
        độ bằng `GET /roadmap/jobs/{job_id}` cho tới khi `done` (có `version`) hoặc `failed`. Đang có một lần sinh lại chưa xong thì trả
        CHÍNH job đó (không tạo thêm). `alternative_id` (một trong hai lựa chọn của bản `based_on_version` khi mục tiêu chưa khả thi)
        được áp khi sinh. Chưa có lộ trình thì job sinh bản đầu tiên. Bản mới ra là `proposed` (trừ bản đầu tiên): người dùng chọn bằng
        `POST /roadmap/versions/{version}/decision`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateRoadmapRequest'
      responses:
        '200':
          description: Job sinh lại (mới tạo hoặc đang chạy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /roadmap/jobs/{job_id}:
    get:
      tags: [roadmap]
      operationId: getRoadmapJob
      summary: Tiến độ một lần sinh lại lộ trình
      x-lambda: ledger
      description: |
        Hỏi tiến độ bằng polling (chu kỳ do giao diện chọn; trạng thái chỉ đổi theo các bước `context`, `draft`, `allocate`, `suitability`,
        `save`). `done` có `version` và `roadmap_id` của bản vừa lưu; `failed` có `error_code` và `error_message`. Job của người khác
        hoặc không tồn tại đều 404 `ROADMAP_NOT_FOUND` như nhau.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/RoadmapJobIdPath'
      responses:
        '200':
          description: Trạng thái job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /review:
    get:
      tags: [review]
      operationId: getReviewList
      summary: Danh sách "Xem lại" hoặc hỏi gộp (khối review_list)
      x-lambda: ledger
      description: |
        `mode` review (mặc định): giao dịch đã được tự gán hũ ở mức tin cậy vừa và cần soát (A1). `mode` daily_ask: giao dịch đang ở hũ
        Chưa phân loại kèm tối đa 2 gợi ý, hỏi MỘT lần mỗi ngày (A2), kèm trạng thái câu hỏi hôm nay (`ask`). Mới nhất trước, tối đa 50
        mục; `count` và `pending_total_vnd` là của toàn bộ tập (hiện ở Tổng quan và màn dự báo). Chỉ đọc, không ghi gì (việc "đã hỏi hôm
        nay" do pipeline phân loại ghi). Sửa hũ: `assign_jar` qua `POST /confirmations` rồi `POST /actions` (`remember` once hoặc
        always); "đúng rồi" với mục mức review là `assign_jar` với chính hũ hiện tại.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [review, daily_ask]
        - name: limit
          in: query
          required: false
          description: Số mục tối đa (1 đến 50, mặc định 20).
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Khối `review_list`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /review/daily-ask/skip:
    post:
      tags: [review]
      operationId: skipReviewAsk
      summary: Để sau câu hỏi gộp của một ngày
      x-lambda: ledger
      description: |
        Ghi `skipped` cho câu hỏi gộp của `ask_date` (ngày mô phỏng): các giao dịch vẫn ở hũ Chưa phân loại, chỉ là hôm nay không hỏi
        lại. Không đổi số dư, không qua token. Idempotent; câu hỏi đã được trả lời xong thì trả `answered`. Ngày đó không có câu hỏi gộp
        thì 400 `PARAMS_INVALID`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAskSkipRequest'
      responses:
        '200':
          description: Trạng thái câu hỏi gộp của ngày.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token Cognito (không phải ID token), gửi trong header Authorization: Bearer <token>.'
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context. Nếu có, trace-id của nó là `trace_id` của khối; nếu không server sinh.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    JobIdPath:
      name: job_id
      in: path
      required: true
      description: Id lần nạp (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    RowIdPath:
      name: row_id
      in: path
      required: true
      description: Id một dòng của lần nạp (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    JarCodePath:
      name: jar_code
      in: path
      required: true
      description: Mã hũ (khóa của hũ trong một người dùng).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
    TraceIdPath:
      name: trace_id
      in: path
      required: true
      description: Mã trace của câu trả lời cần giải thích (từ `trace_id` của khối).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
    StepIdPath:
      name: step_id
      in: path
      required: true
      description: Id một bước của lộ trình (`step_id`, ổn định trong một phiên bản).
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,31}$'
    RoadmapVersionPath:
      name: version
      in: path
      required: true
      description: Số phiên bản lộ trình.
      schema:
        $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
    RoadmapJobIdPath:
      name: job_id
      in: path
      required: true
      description: Id lần sinh lại lộ trình (UUID).
      schema:
        $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
  schemas:
    ErrorCode:
      type: string
      description: Mã lỗi máy đọc được; khớp yofina_core.errors.ErrorCode.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - PARAMS_INVALID
        - JAR_NOT_FOUND
        - INSUFFICIENT_FUNDS
        - AMOUNT_LIMIT_EXCEEDED
        - NEEDS_CONFIRMATION
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_REUSED
        - PARAMS_MISMATCH
        - ALREADY_APPLIED
        - RATE_LIMITED
        - MODEL_BUDGET_EXCEEDED
        - DATABASE_UNAVAILABLE
        - INTERNAL_ERROR
        - PROFILE_INCOMPLETE
        - TRANSACTION_NOT_FOUND
        - OBLIGATION_NOT_FOUND
        - PAYEE_NOT_FOUND
        - SALARY_EVENT_NOT_FOUND
        - JAR_PROTECTED
        - CREDIT_LIMIT_EXCEEDED
        - DUPLICATE_TRANSACTION
        - FORECAST_UNAVAILABLE
        - OFFER_EXPIRED
        - TRACE_NOT_FOUND
        - NUDGE_NOT_FOUND
        - FEE_SCHEDULE_NOT_FOUND
        - FORECAST_NOT_APPLICABLE
        - SCENARIO_INVALID
        - CONSENT_REQUIRED
        - INGEST_JOB_NOT_FOUND
        - INGEST_JOB_NOT_READY
        - INGEST_UNSUPPORTED_TYPE
        - INGEST_TOO_LARGE
        - INGEST_NOT_FINANCIAL
        - INGEST_DUPLICATE_FILE
        - ROADMAP_NOT_FOUND
        - ROADMAP_INVALID
        - ROADMAP_VERSION_CONFLICT
        - SHOCK_NOT_FOUND
      x-http-status:
        UNAUTHENTICATED: 401
        FORBIDDEN: 403
        PARAMS_INVALID: 400
        JAR_NOT_FOUND: 404
        INSUFFICIENT_FUNDS: 422
        AMOUNT_LIMIT_EXCEEDED: 422
        NEEDS_CONFIRMATION: 428
        TOKEN_INVALID: 403
        TOKEN_EXPIRED: 403
        TOKEN_REUSED: 409
        PARAMS_MISMATCH: 409
        ALREADY_APPLIED: 409
        RATE_LIMITED: 429
        MODEL_BUDGET_EXCEEDED: 503
        DATABASE_UNAVAILABLE: 503
        INTERNAL_ERROR: 500
        PROFILE_INCOMPLETE: 422
        TRANSACTION_NOT_FOUND: 404
        OBLIGATION_NOT_FOUND: 404
        PAYEE_NOT_FOUND: 404
        SALARY_EVENT_NOT_FOUND: 404
        JAR_PROTECTED: 422
        CREDIT_LIMIT_EXCEEDED: 422
        DUPLICATE_TRANSACTION: 409
        FORECAST_UNAVAILABLE: 503
        OFFER_EXPIRED: 410
        TRACE_NOT_FOUND: 404
        NUDGE_NOT_FOUND: 404
        FEE_SCHEDULE_NOT_FOUND: 404
        FORECAST_NOT_APPLICABLE: 404
        SCENARIO_INVALID: 422
        CONSENT_REQUIRED: 403
        INGEST_JOB_NOT_FOUND: 404
        INGEST_JOB_NOT_READY: 409
        INGEST_UNSUPPORTED_TYPE: 415
        INGEST_TOO_LARGE: 413
        INGEST_NOT_FINANCIAL: 422
        INGEST_DUPLICATE_FILE: 409
        ROADMAP_NOT_FOUND: 404
        ROADMAP_INVALID: 422
        ROADMAP_VERSION_CONFLICT: 409
        SHOCK_NOT_FOUND: 404
      x-meaning:
        UNAUTHENTICATED: Thiếu hoặc sai access token.
        FORBIDDEN: Không được phép (token xác nhận không thuộc người dùng này, v.v.).
        PARAMS_INVALID: Tham số sai định dạng hoặc vô lý (cùng hũ, số tiền không dương...).
        JAR_NOT_FOUND: Mã hũ không tồn tại với người dùng này.
        INSUFFICIENT_FUNDS: Hũ nguồn không đủ số dư.
        AMOUNT_LIMIT_EXCEEDED: Vượt hạn mức số tiền một lần (cấu hình, cùng giá trị với luật Cedar).
        NEEDS_CONFIRMATION: Thao tác ghi cần xác nhận; chưa ghi gì.
        TOKEN_INVALID: Token sai định dạng, chữ ký sai, cho tool khác hoặc cho người dùng khác.
        TOKEN_EXPIRED: Token đã hết hạn (quá 2 phút kể từ lúc cấp).
        TOKEN_REUSED: Token đã được dùng (replay).
        PARAMS_MISMATCH: Tham số khác với tham số đã được xác nhận (hash không khớp), hoặc `confirm_block_id` không thuộc thao tác này.
        ALREADY_APPLIED: Đề nghị (`confirm_block_id`) này đã được thực hiện rồi; không ghi thêm gì, kể cả khi có token mới hợp lệ.
        RATE_LIMITED: Quá giới hạn tần suất.
        MODEL_BUDGET_EXCEEDED: Chạm trần lượt gọi model trong ngày (agent, không phải REST).
        DATABASE_UNAVAILABLE: Aurora đang thức dậy hoặc không sẵn sàng; thử lại sau vài giây.
        INTERNAL_ERROR: Lỗi không lường trước; xem log theo trace_id.
        PROFILE_INCOMPLETE: Chưa khai lương và ngày nhận lương nên chưa làm được việc này (ví dụ dự báo).
        TRANSACTION_NOT_FOUND: Mã giao dịch không tồn tại với người dùng này.
        OBLIGATION_NOT_FOUND: Mã nghĩa vụ không tồn tại với người dùng này.
        PAYEE_NOT_FOUND: Mã người nhận không tồn tại với người dùng này.
        SALARY_EVENT_NOT_FOUND: Mã sự kiện lương không tồn tại với người dùng này.
        JAR_PROTECTED: Hũ hệ thống hoặc hũ còn tiền hay còn nghĩa vụ nên không sửa hoặc bỏ được.
        CREDIT_LIMIT_EXCEEDED: Vượt hạn mức Trả sau (mô phỏng) còn lại.
        DUPLICATE_TRANSACTION: Giao dịch trùng khóa khử trùng (cùng ngày, số tiền, đối tác, mã tham chiếu) với giao dịch đã có.
        FORECAST_UNAVAILABLE: Chưa có dự báo cho hũ này và chưa tính được ngay; thử lại sau ít phút.
        OFFER_EXPIRED: Đề nghị (khối confirm hoặc confirm_action) đã quá `expires_at`; hãy hỏi lại. Khác TOKEN_EXPIRED (token quá 2 phút).
        TRACE_NOT_FOUND: Không có trace này với người dùng (không tồn tại hoặc của người khác; không phân biệt).
        NUDGE_NOT_FOUND: Mã lời nhắc không tồn tại với người dùng này (hủy lời nhắc đã hủy hoặc đã gửi).
        FEE_SCHEDULE_NOT_FOUND: Không có biểu phí cho loại phí hoặc sản phẩm này.
        FORECAST_NOT_APPLICABLE: Hũ hệ thống (Tiền vào khác, Chưa phân loại) không có dự báo.
        SCENARIO_INVALID: Kịch bản đúng dạng nhưng vô lý (ngày đã qua, hũ sai loại, vượt khoảng dự báo).
        CONSENT_REQUIRED: Chưa đồng ý cho nguồn nạp này (ảnh hoặc CSV); gửi lại với consent true sau khi người dùng đồng ý.
        INGEST_JOB_NOT_FOUND: Lần nạp (hoặc dòng của nó) không tồn tại với người dùng này.
        INGEST_JOB_NOT_READY: Lần nạp chưa ở trạng thái làm được việc này (chưa đọc xong, đã chốt, đã lỗi), hoặc dòng không còn mở.
        INGEST_UNSUPPORTED_TYPE: Loại tệp không được hỗ trợ; thông điệp liệt kê loại được hỗ trợ.
        INGEST_TOO_LARGE: Tệp lớn hơn giới hạn cấu hình của loại này.
        INGEST_NOT_FINANCIAL: Tệp không phải tài liệu tài chính (sao kê, hóa đơn, lịch sử giao dịch) nên không đọc dòng nào.
        INGEST_DUPLICATE_FILE: Cùng nội dung tệp đã được nạp ở một lần nạp khác còn hiệu lực.
        ROADMAP_NOT_FOUND: Chưa có lộ trình, hoặc không có phiên bản, bước hoặc lần sinh lại này với người dùng (của người khác thì cũng như không có).
        ROADMAP_INVALID: Lộ trình hoặc bước sai cấu trúc, hoặc vi phạm luật suitability mức block (thông điệp nêu mã luật để sửa); không lưu gì.
        ROADMAP_VERSION_CONFLICT: Phiên bản gốc đã bị thay hoặc bỏ, hoặc bản này không còn ở trạng thái làm được việc này (ví dụ không còn chờ chọn); hãy đọc lại lộ trình.
        SHOCK_NOT_FOUND: Mã cú sốc không có trong danh sách cú sốc mẫu.
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Câu tiếng Việt hiển thị được cho người dùng, không chứa dữ liệu nhạy cảm.
              minLength: 1
              maxLength: 280
            trace_id:
              $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
    Profile:
      description: |
        Hồ sơ đã khai. `onboarded` đúng khi đã có cả lương và ngày nhận (hai thứ bắt buộc duy nhất).
        `display_name` luôn có: lấy từ hồ sơ, tài khoản chưa có hồ sơ thì server dùng claim `name`
        hoặc `cognito:username` của JWT (không dùng email).
      type: object
      required: [display_name, onboarded]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        onboarded:
          type: boolean
    ProfileResponse:
      type: object
      required: [app_date, as_of, profile]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        profile:
          $ref: '#/components/schemas/Profile'
    JarKind:
      description: spending (chi tiêu), saving (tiết kiệm), obligation (nghĩa vụ), system (hũ hệ thống Tiền vào khác và Chưa phân loại).
      type: string
      enum: [spending, saving, obligation, system]
    JarFull:
      description: |
        Một hũ, đủ để vẽ thẻ hũ trên Tổng quan và Danh sách hũ. `balance_vnd` có dấu: chỉ hũ hệ thống
        Chưa phân loại mới âm. Các trường dự báo (`status`, `runout_date`, `p_shortfall`, `confidence_band`) lấy từ
        lần chạy dự báo mới nhất có chứa hũ; vắng nếu hũ chưa có dự báo (hũ hệ thống không có dự báo).
        `p_shortfall` chỉ có khi đủ tin cậy (xem khối `forecast_timeline`).
      type: object
      required: [code, name, color_key, icon_key, kind, balance_vnd, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          $ref: '#/components/schemas/JarKind'
        system_role:
          type: string
          enum: [other_income, unclassified]
        balance_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        status:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/JarStatus'
        runout_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        p_shortfall:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        forecast_floor_vnd:
          description: |
            Số dư dự báo (P50) THẤP NHẤT từ ngày dự báo đầu tiên tới trước kỳ lương của lần chạy mới nhất có chứa hũ, để vẽ vạch
            "mực dự báo" trên thẻ hũ. Có dấu (âm là hụt). Vắng khi hũ chưa có dự báo. Server tính từ bảng `forecasts` (hàm
            `app_get_forecast_summaries`, migration 0008); pipeline dự báo không ghi thêm gì.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    OverviewBalance:
      type: object
      required: [total_vnd, jars_total_vnd, other_income_vnd, unclassified_vnd]
      additionalProperties: false
      properties:
        total_vnd:
          description: Tổng số dư của mọi hũ, gồm Tiền vào khác và Chưa phân loại (= jars_total_vnd + other_income_vnd + unclassified_vnd).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        jars_total_vnd:
          description: Tổng số dư các hũ người dùng (không gồm hũ hệ thống).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        other_income_vnd:
          description: Số dư hũ Tiền vào khác. Không phải thu nhập.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        unclassified_vnd:
          description: Số dư hũ Chưa phân loại (có dấu, thường âm). Giao diện ghi "đã chi, chưa xếp hũ" theo giá trị tuyệt đối khi âm.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    NextPayday:
      type: object
      required: [date, days_until, state]
      additionalProperties: false
      properties:
        date:
          description: Ngày lương kế tiếp (sau hôm nay mô phỏng), theo ngày lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        days_until:
          type: integer
          minimum: 1
          maximum: 400
        expected_vnd:
          description: Lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        state:
          description: expected (chưa về), pending_confirmation (đã nhận, chờ xác nhận chia), confirmed (kỳ lương hiện tại đã xác nhận).
          type: string
          enum: [expected, pending_confirmation, confirmed]
        salary_event_id:
          description: Có khi state là pending_confirmation.
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    ForecastMeta:
      description: Chất lượng của lần chạy dự báo mới nhất, để hiện dải "độ phủ dữ liệu", "ước lượng ban đầu", "số liệu cũ".
      type: object
      required: [computed_at, run_app_date, stale, is_initial_estimate, confidence_band, history_days, model]
      additionalProperties: false
      properties:
        computed_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        run_app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        stale:
          description: Quá hạn độ tươi hoặc ngày mô phỏng đã sang ngày khác so với run_app_date. Tổng quan không tự tính lại; bấm vào hũ (GET /forecasts/{jar_code}) sẽ tính lại.
          type: boolean
        is_initial_estimate:
          type: boolean
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        coverage:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        history_days:
          type: integer
          minimum: 0
        model:
          type: string
          minLength: 1
          maxLength: 40
    OverviewResponse:
      type: object
      required:
        - app_date
        - as_of
        - profile
        - balance
        - jars
        - system_jars
        - next_payday
        - forecast
        - proactive_card
        - credit_line
        - obligations_due
        - recent_transactions
        - needs_review_count
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        profile:
          $ref: '#/components/schemas/Profile'
        balance:
          $ref: '#/components/schemas/OverviewBalance'
        jars:
          description: Hũ người dùng (không gồm hũ hệ thống), theo thứ tự hiển thị. Rỗng với tài khoản trắng.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarFull'
        system_jars:
          description: Hai hũ hệ thống Tiền vào khác và Chưa phân loại (rỗng nếu chưa tạo).
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/JarFull'
        next_payday:
          description: Null nếu chưa khai ngày nhận lương.
          oneOf:
            - $ref: '#/components/schemas/NextPayday'
            - type: 'null'
        forecast:
          description: Null nếu chưa có lần chạy dự báo nào.
          oneOf:
            - $ref: '#/components/schemas/ForecastMeta'
            - type: 'null'
        proactive_card:
          description: Một việc cần chú ý, hoặc null nếu không có.
          oneOf:
            - $ref: '../blocks/proactive_card.schema.json'
            - type: 'null'
        credit_line:
          oneOf:
            - $ref: '../tools/ledger.results.schema.json#/$defs/CreditLine'
            - type: 'null'
        obligations_due:
          description: Nghĩa vụ đang hoạt động đến hạn trong 30 ngày tới, gần nhất trước (tối đa 5).
          type: array
          maxItems: 5
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
        recent_transactions:
          description: 5 giao dịch gần nhất (không gồm dòng chuyển hũ).
          type: array
          maxItems: 5
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        needs_review_count:
          description: Số giao dịch cần xem lại hoặc đang ở Chưa phân loại.
          type: integer
          minimum: 0
    JarDetailResponse:
      type: object
      required: [app_date, as_of, jar, forecast, recent_transactions, obligations]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        jar:
          $ref: '#/components/schemas/JarFull'
        forecast:
          description: Null nếu hũ chưa có dự báo.
          oneOf:
            - $ref: '#/components/schemas/ForecastMeta'
            - type: 'null'
        recent_transactions:
          type: array
          maxItems: 10
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        obligations:
          description: Nghĩa vụ đang hoạt động có hũ trả là hũ này.
          type: array
          maxItems: 10
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
    TransactionsResponse:
      type: object
      required: [app_date, as_of, transactions]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        transactions:
          type: array
          maxItems: 50
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        next_cursor:
          description: Vắng ở trang cuối.
          type: string
          minLength: 1
          maxLength: 200
    TxType:
      type: object
      required: [tx_type, label, direction]
      additionalProperties: false
      properties:
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        label:
          type: string
          minLength: 1
          maxLength: 60
        direction:
          description: out (chi), in (tiền vào).
          type: string
          enum: [out, in]
        is_person_transfer:
          description: |
            Đúng với loại "chuyển tiền cho người khác" (`transfer_person`): màn chọn người nhận dùng cờ này, không đoán theo tên.
            Cờ ở bảng tra `tx_type_map.is_person_transfer` (migration 0008). Server luôn gửi.
          type: boolean
        default_jar:
          description: Hũ chuẩn của loại này (bước 0 của phân loại), nếu người dùng có hũ đó.
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        system_role:
          type: string
          enum: [other_income, unclassified]
    TxTypesResponse:
      type: object
      required: [tx_types]
      additionalProperties: false
      properties:
        tx_types:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/TxType'
    PayeesResponse:
      type: object
      required: [payees]
      additionalProperties: false
      properties:
        payees:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Payee'
    ObligationsResponse:
      type: object
      required: [app_date, obligations, total_due_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
        total_due_vnd:
          description: Tổng amount_vnd của các khoản active trong danh sách.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    FeeLine:
      description: Một dòng của biểu phí có cấu trúc (bảng fee_schedules), đang hiệu lực tại ngày mô phỏng.
      type: object
      required: [fee_type, period, condition_code, source_name, source_url, effective_from]
      additionalProperties: false
      properties:
        fee_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        rate_percent:
          type: number
          minimum: 0
        period:
          type: string
          enum: [per_month, per_transaction, once]
        condition_code:
          type: string
          enum: [always, month_has_transaction, overdue]
        condition_note:
          type: string
          maxLength: 200
        source_name:
          type: string
          maxLength: 200
        source_url:
          type: string
          pattern: '^https://'
        effective_from:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    CreditLineResponse:
      type: object
      required: [app_date, credit_line, fees]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        credit_line:
          oneOf:
            - $ref: '../tools/ledger.results.schema.json#/$defs/CreditLine'
            - type: 'null'
        fees:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FeeLine'
    SalaryEventsResponse:
      type: object
      required: [salary_events]
      additionalProperties: false
      properties:
        salary_events:
          type: array
          maxItems: 20
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/SalaryEvent'
    JarTemplate:
      type: object
      required: [code, name, color_key, icon_key, kind, default_split_percent, is_default]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        default_split_percent:
          type: number
          minimum: 0
          maximum: 100
        is_default:
          type: boolean
    JarTemplatesResponse:
      type: object
      required: [templates]
      additionalProperties: false
      properties:
        templates:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarTemplate'
    RecordTransactionParams:
      description: |
        Tham số của `record_transaction`. Chuẩn hóa ở server (contracts/README.md): điền `tx_type`
        mặc định (`other_expense` hoặc `income_other`), `funding` mặc định `jar`; nếu thiếu `jar` thì
        suy từ `tx_type` qua bảng tra, không suy được thì hũ Chưa phân loại; tiền vào luôn có `jar` là hũ
        Tiền vào khác. Bản chuẩn hóa mới là thứ được ký.
      type: object
      required: [kind, amount_vnd]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [expense, income]
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        funding:
          description: jar (mặc định) hoặc credit (hạn mức Trả sau mô phỏng; chỉ với chi tiêu). external (ngoài ví) chỉ vào sổ cái qua confirm_rows.
          type: string
          enum: [jar, credit]
        payee_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        counterparty:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: string
          minLength: 1
          maxLength: 200
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        client_ref:
          description: Mã chống ghi trùng khi gửi lại; vào `dedupe_key` của sổ cái.
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]+$'
    AssignJarParams:
      type: object
      required: [transaction_id, jar]
      additionalProperties: false
      properties:
        transaction_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        remember:
          description: once (mặc định) hoặc always (lưu luật `category_rules` cho người nhận hoặc đối tác).
          type: string
          enum: [once, always]
    ObligationChange:
      description: |
        Một thay đổi nghĩa vụ trong `update_profile`. `upsert` không có `obligation_id` là thêm mới và
        cần `kind`, `name` và số tiền (`amount_vnd`, hoặc cặp `amount_min_vnd` + `amount_max_vnd` khi đó
        `amount_vnd` là trung điểm làm tròn xuống); có `obligation_id` là sửa. `delete` cần `obligation_id`
        (đặt trạng thái cancelled). Khoản trả sau (`bnpl`) không khai được.

        **`due_day` hay `due_date`**: `due_day` (1 đến 31) là NGÀY TRONG THÁNG của khoản lặp (`monthly`, và cũng dùng cho `yearly`
        khi cần): kẹp ngày cuối tháng, giữ nguyên qua các kỳ. `due_date` là NGÀY ĐẾN HẠN CỤ THỂ kế tiếp. Khoản `once` bắt buộc
        `due_date`. Khoản `monthly` chỉ cần một trong hai: có `due_day` thì server suy `due_date` (ngày đó sớm nhất không trước
        hôm nay mô phỏng); có `due_date` mà không `due_day` thì `due_day` lấy theo ngày của `due_date`. Khoản `weekly` cần
        `due_date` (kỳ sau cộng 7 ngày; `due_day` không dùng). Khi sửa (`obligation_id`) không điền mặc định nào.
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [upsert, delete]
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        kind:
          type: string
          enum: [loan, rent, bill, subscription]
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_min_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_max_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        fee_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        due_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        cycle:
          type: string
          enum: [once, weekly, monthly, yearly]
        pay_jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        is_essential:
          type: boolean
    UpdateProfileParams:
      description: |
        Phải có ít nhất một trường. Tài khoản chưa có hồ sơ (onboarding): lần gọi đầu phải có cả
        `monthly_salary_vnd` và `payday_day`; server tạo hồ sơ, hai hũ hệ thống và (nếu chưa có hũ nào)
        các hũ `is_default` của `jar_templates` với tỷ lệ mặc định. Dự báo được tính lại sau khi ghi.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        obligation:
          $ref: '#/components/schemas/ObligationChange'
    JarSpec:
      description: |
        Một hũ trong `save_jars`. Có `code` là sửa hũ đó; không có là tạo hũ mới (server sinh `code` từ
        `name`). `color_key` và `icon_key` là khóa giao diện ánh xạ (xem `GET /jar-templates`).
      type: object
      required: [name, color_key, icon_key, kind, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    SaveJarsParams:
      description: |
        Thay cả danh sách hũ người dùng (không gồm hũ hệ thống) theo thứ tự trong mảng (thứ tự hiển thị).
        Tổng `split_percent` phải bằng 100. Hũ đang có mà không có trong danh sách chỉ bị bỏ khi số dư
        bằng 0 và không còn nghĩa vụ trả bằng hũ đó, nếu không trả 422 `JAR_PROTECTED`.
      type: object
      required: [jars]
      additionalProperties: false
      properties:
        jars:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarSpec'
    ConfirmSalaryParams:
      description: |
        split: chia số tiền lương vào hũ theo `split_percent` (làm tròn xuống từng hũ, phần dư vào hũ có tỷ lệ
        lớn nhất, hòa thì hũ đứng trước). keep_as_other: giữ ở Tiền vào khác (không phải lương). `update_declared_salary`
        chỉ có nghĩa khi `decision` là split: đặt lương đã khai bằng số vừa nhận.
      type: object
      required: [salary_event_id, decision]
      additionalProperties: false
      properties:
        salary_event_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [split, keep_as_other]
        update_declared_salary:
          type: boolean
    IngestSourceKind:
      description: image (ảnh chụp màn hình, hóa đơn) hoặc csv (tệp sao kê).
      type: string
      enum: [image, csv]
    IngestUploadRequest:
      type: object
      required: [source_kind, mime, size_bytes]
      additionalProperties: false
      properties:
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        mime:
          description: MIME của tệp (phải thuộc danh sách cho phép của loại này; S3 ép đúng giá trị này).
          type: string
          minLength: 3
          maxLength: 100
        size_bytes:
          description: Kích thước tệp (byte), không vượt giới hạn của loại này; S3 ép bằng content-length-range.
          type: integer
          minimum: 1
        consent:
          description: |
            Người dùng vừa đồng ý cho nguồn này (ảnh hoặc CSV) trên màn hình. Bắt buộc là true ở lần nạp đầu của nguồn (và sau khi
            rút đồng ý); server ghi `consents` với phiên bản văn bản đồng ý hiện hành (`ingest_consent_version`).
          type: boolean
    IngestUploadResponse:
      type: object
      required: [job_id, key, url, fields, expires_at, max_bytes, mime_types]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        key:
          description: Khóa S3 của tệp, dạng `{user_id}/{job_id}` (không có tên tệp gốc).
          type: string
          minLength: 1
          maxLength: 512
        url:
          description: URL của presigned POST (bucket `yofina-ingest-*`).
          type: string
          pattern: '^https://'
          maxLength: 2048
        fields:
          description: Các trường form phải gửi kèm (nguyên văn, trước trường `file`), gồm policy và chữ ký.
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        max_bytes:
          type: integer
          minimum: 1
        mime_types:
          description: Loại tệp được hỗ trợ của nguồn này (để hiển thị).
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
    IngestJobResponse:
      type: object
      required: [job_id, status, source_kind, progress, rows_total, created_at, updated_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJobStatus'
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        rows_total:
          type: integer
          minimum: 0
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        updated_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        review:
          description: Có từ trạng thái review (cả khi done).
          $ref: '../blocks/ingest_review.schema.json'
        coverage_change:
          description: Có khi done.
          $ref: '../blocks/coverage_change.schema.json'
    IngestJobSummary:
      description: |
        Một lần nạp trong danh sách gần đây; như `IngestJobResponse` nhưng không có `review` và `coverage_change`.
      type: object
      required: [job_id, status, source_kind, progress, rows_total, created_at, updated_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJobStatus'
        source_kind:
          $ref: '#/components/schemas/IngestSourceKind'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        rows_total:
          type: integer
          minimum: 0
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        updated_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    IngestJobListResponse:
      type: object
      required: [jobs]
      additionalProperties: false
      properties:
        jobs:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/IngestJobSummary'
    IngestRowJarRequest:
      type: object
      required: [jar]
      additionalProperties: false
      properties:
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
    IngestRowJarResponse:
      type: object
      required: [row_id, suggested_jar, jar_source]
      additionalProperties: false
      properties:
        row_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        suggested_jar:
          $ref: '../blocks/ingest_review.schema.json#/$defs/IngestJar'
        jar_source:
          const: user
    ConfirmRowsParams:
      description: |
        Tham số của `confirm_rows`. Chuẩn hóa (`yofina_core.params.normalize_confirm_rows`, idempotent, không cần trạng thái):
        `rows` sắp theo `row_id`, mỗi dòng `{row_id, jar?}`; `reject_row_ids` sắp tăng dần; một dòng không được vừa ghi vừa bỏ;
        ít nhất một dòng. Dòng ghi phải còn mở (`auto_added`, `pending`); dòng `duplicate` không ghi được.
      type: object
      required: [job_id]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        rows:
          type: array
          maxItems: 500
          items:
            type: object
            required: [row_id]
            additionalProperties: false
            properties:
              row_id:
                $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
              jar:
                $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        reject_row_ids:
          type: array
          maxItems: 500
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    ActionResponse:
      description: Biên nhận của `POST /actions`, phân biệt bằng `type`.
      oneOf:
        - $ref: '../blocks/receipt.schema.json'
        - $ref: '../blocks/receipt_action.schema.json'
    JarsResponse:
      type: object
      required: [app_date, as_of, jars, jars_total_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        jars:
          type: array
          maxItems: 20
          items:
            $ref: '../blocks/jar_summary.schema.json#/$defs/JarBalance'
        jars_total_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    ConversationSummary:
      type: object
      required: [conversation_id, turns, last_activity_at, preview]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: integer
          minimum: 1
          description: Số lượt đã lưu.
        last_activity_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        preview:
          type: string
          maxLength: 120
          description: Câu hỏi đầu tiên của cuộc hội thoại, cắt tối đa 120 ký tự.
    ConversationListResponse:
      type: object
      required: [conversations]
      additionalProperties: false
      properties:
        conversations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationSummary'
    ConversationTurn:
      type: object
      required: [trace_id, created_at, user_text, assistant_text, blocks, resolutions]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        user_text:
          type: string
          maxLength: 4000
        assistant_text:
          type: string
          maxLength: 8000
          description: Câu trả lời bằng chữ agent đã phát (có thể rỗng nếu lượt chỉ có khối).
        blocks:
          type: array
          maxItems: 20
          description: Khối UI đã phát ở lượt, theo thứ tự phát (`seq`).
          items:
            $ref: '../blocks/block.schema.json'
        resolutions:
          type: array
          maxItems: 20
          description: Trạng thái của từng khối `confirm` trong `blocks`, cùng thứ tự (một phần tử mỗi khối).
          items:
            $ref: '#/components/schemas/ConfirmResolution'
    ConversationResponse:
      type: object
      required: [conversation_id, turns]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationTurn'
    ConfirmConversationId:
      description: |
        Id cuộc hội thoại chứa khối `confirm` (session id của chat). Gửi cùng `confirm_block_id`
        hoặc không gửi cả hai.
      type: string
      minLength: 1
      maxLength: 256
    ConfirmBlockRef:
      description: |
        `id` của khối `confirm` đang được thực hiện, dạng `confirm:{trace_id}:{params_hash[:12]}`.
        12 ký tự cuối phải khớp hash của `params` đang gửi, nếu không trả PARAMS_MISMATCH. Một
        `confirm_block_id` của một người dùng chỉ được thực hiện một lần (ALREADY_APPLIED).
      type: string
      maxLength: 128
      pattern: '^confirm:[A-Za-z0-9_-]{1,64}:[0-9a-f]{12}$'
    ConfirmResolution:
      description: |
        Trạng thái một khối `confirm` hoặc `confirm_action` trong lượt, do server giữ. `done`: đã thực hiện,
        kèm `receipt` (đúng khối `POST /actions` đã trả) và `resolved_at`; thắng mọi trạng thái khác. `cancelled`:
        người dùng đã bấm "Không" (`POST /confirmations/cancel`), kèm `resolved_at`, không có `receipt`; cũng thắng
        `expired`. `expired`: chưa xử lý và đã quá `expires_at` của đề nghị lúc đọc. `pending`: còn hạn, chưa xử lý.
      oneOf:
        - type: object
          required: [block_id, status, resolved_at, receipt]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: done
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
            receipt:
              $ref: '#/components/schemas/ActionResponse'
        - type: object
          required: [block_id, status, resolved_at]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: cancelled
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - type: object
          required: [block_id, status]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              enum: [pending, expired]
    CancelConfirmationRequest:
      type: object
      required: [conversation_id, confirm_block_id]
      additionalProperties: false
      properties:
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
    CancelConfirmationResponse:
      type: object
      required: [block_id, status, resolved_at]
      additionalProperties: false
      properties:
        block_id:
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        status:
          const: cancelled
        resolved_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    ToolName:
      type: string
      description: |
        Tên tool ghi của Lambda `ledger` (ngắn, không có tiền tố target). Mỗi giá trị có schema `params` riêng, xem `allOf` của
        `ConfirmationRequest` và `ActionRequest` và bảng ở mô tả của `POST /actions`. `confirm_rows` (phase 5) không thuộc tập này:
        xem `IngestToolName`.
      enum: [move_between_jars, record_transaction, assign_jar, update_profile, save_jars, confirm_salary, schedule_nudge]
    ParamsByTool:
      description: |
        Ràng buộc `params` theo `tool` (dùng chung cho `ConfirmationRequest` và `ActionRequest`). `params` chưa chuẩn hóa
        cũng được nhận (server chuẩn hóa lại và chỉ ký bản chuẩn hóa); trường lạ và `user_id` bị từ chối.
      allOf:
        - if:
            properties:
              tool:
                const: move_between_jars
          then:
            properties:
              params:
                $ref: '../blocks/confirm.schema.json#/$defs/MoveParams'
        - if:
            properties:
              tool:
                const: record_transaction
          then:
            properties:
              params:
                $ref: '#/components/schemas/RecordTransactionParams'
        - if:
            properties:
              tool:
                const: assign_jar
          then:
            properties:
              params:
                $ref: '#/components/schemas/AssignJarParams'
        - if:
            properties:
              tool:
                const: update_profile
          then:
            properties:
              params:
                $ref: '#/components/schemas/UpdateProfileParams'
        - if:
            properties:
              tool:
                const: save_jars
          then:
            properties:
              params:
                $ref: '#/components/schemas/SaveJarsParams'
        - if:
            properties:
              tool:
                const: confirm_salary
          then:
            properties:
              params:
                $ref: '#/components/schemas/ConfirmSalaryParams'
        - if:
            properties:
              tool:
                const: schedule_nudge
          then:
            properties:
              params:
                $ref: '#/components/schemas/ScheduleNudgeParams'
    IngestToolName:
      type: string
      description: |
        Tool ghi của Lambda `ingest` (phase 5), chỉ một giá trị. Tool khác gửi tới `/ingest/*` bị `PARAMS_INVALID`.
      enum: [confirm_rows]
    IngestConfirmationRequest:
      description: |
        Thân của `POST /ingest/confirmations`: như `ConfirmationRequest` nhưng `tool` chỉ là `confirm_rows` và `params` theo
        `ConfirmRowsParams`. Màn hình duyệt không có khối `confirm_action`, nên bỏ `conversation_id`, `confirm_block_id`,
        `params_hash`; đường chat (có khối) gửi như `POST /confirmations`.
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/IngestToolName'
        params:
          $ref: '#/components/schemas/ConfirmRowsParams'
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Như `ConfirmationRequest.params_hash`.
    IngestActionRequest:
      description: |
        Thân của `POST /ingest/actions`; như `ActionRequest` nhưng `tool` chỉ là `confirm_rows`.
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/IngestToolName'
        params:
          $ref: '#/components/schemas/ConfirmRowsParams'
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        confirm_token:
          description: Token từ `POST /ingest/confirmations`. Vắng thì không ghi, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    ConfirmationRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: |
            Sao nguyên từ khối `confirm` hoặc `confirm_action` (đã chuẩn hóa), hoặc do màn hình tự dựng. Schema
            theo `tool` ở `ParamsByTool`.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        params_hash:
          description: |
            `params_hash` của khối `confirm` hoặc `confirm_action` người dùng đang nhìn. Nếu gửi, server so với hash
            tự tính từ `tool` và `params`; lệch thì trả PARAMS_MISMATCH. Màn hình không có khối thì bỏ trường này.
          type: string
          pattern: '^[0-9a-f]{64}$'
    ConfirmationResponse:
      type: object
      required: [confirm_token, expires_at, ttl_seconds, tool, params, params_hash]
      additionalProperties: false
      properties:
        confirm_token:
          type: string
          description: Token mờ, dùng một lần, gắn với người dùng, tool và tham số.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          minLength: 3
          maxLength: 1024
        expires_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        ttl_seconds:
          type: integer
          minimum: 1
          description: Thời gian sống của token, từ cấu hình; frontend đếm ngược theo đây.
        tool:
          description: Tool đã ký; `confirm_rows` khi do `POST /ingest/confirmations` cấp.
          anyOf:
            - $ref: '#/components/schemas/ToolName'
            - $ref: '#/components/schemas/IngestToolName'
        params:
          description: Bản tham số đã chuẩn hóa mà token đã ký.
          type: object
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        preview:
          description: |
            Bản XEM TRƯỚC do SERVER tính (không ghi gì), cùng hình dạng `changes` và `warnings` của khối `confirm_action`, để
            màn "Xem lại" không tự tính gì: số dư trước và sau của từng hũ, với Trả sau (mô phỏng) thì khoản phải trả ngày
            đến hạn (đã gồm phí lấy từ `fee_schedules`) và hạn mức còn lại, với lương thì phần chia vào từng hũ. Luôn có
            ở phase 2; `warnings` vắng khi không có.
          type: object
          required: [summary, changes]
          additionalProperties: false
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 120
            changes:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '../blocks/confirm_action.schema.json#/$defs/ActionChange'
            warnings:
              type: array
              maxItems: 5
              items:
                type: string
                minLength: 1
                maxLength: 140
    ActionRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: Như `ConfirmationRequest.params`; phải khớp bản đã xác nhận (hash khớp), nếu không PARAMS_MISMATCH.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        confirm_token:
          description: Token từ `POST /confirmations`. Vắng thì không ghi, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    ResetResponse:
      type: object
      required: [reset_at, app_date, clock_offset_days, jars_count, transactions_count]
      additionalProperties: false
      properties:
        reset_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          description: Ngày mô phỏng sau khi đặt lại (ngày neo).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        clock_offset_days:
          type: integer
        jars_count:
          type: integer
          minimum: 0
        transactions_count:
          type: integer
          minimum: 0
        obligations_count:
          description: Số nghĩa vụ đã seed (phase 2).
          type: integer
          minimum: 0
        forecast_ready:
          description: Đúng nếu đã tính xong dự báo đồng bộ trước khi trả lời (phase 2), để mở app là có số.
          type: boolean
    ScheduleNudgeParams:
      description: |
        Tham số của `schedule_nudge` (target planner của agent, và REST). `op` mặc định `create`. create: bắt buộc `kind` và
        `fire_on` (ngày mô phỏng, sau hôm nay), tùy chọn `jar_code`, `note`, `scenario_id`. cancel (nút Hoàn tác): bắt buộc `nudge_id`
        (`reference_id` của biên nhận lúc đặt), không có trường khác. Chuẩn hóa: bỏ khóa null, `op` điền `create`, chuỗi cắt
        khoảng trắng, mã hũ chữ thường, uuid chữ thường; idempotent.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        op:
          type: string
          enum: [create, cancel]
        kind:
          type: string
          enum: [runout_warning, obligation_due, salary_pending, review_needed, low_data, purchase_review]
        fire_on:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        jar_code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        note:
          type: string
          minLength: 1
          maxLength: 120
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        nudge_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
      if:
        required: [op]
        properties:
          op:
            const: cancel
      then:
        required: [nudge_id]
        not:
          anyOf:
            - required: [kind]
            - required: [fire_on]
      else:
        required: [kind, fire_on]
        not:
          required: [nudge_id]
    AffordabilityRequest:
      description: |
        Yêu cầu kiểm tra trước khi quẹt. `funding_source` vắng thì xét cả hai nguồn. `jar` chỉ có nghĩa khi nguồn là hũ. `date` vắng
        thì hôm nay mô phỏng. Không có `user_id`.
      type: object
      required: [amount_vnd]
      additionalProperties: false
      properties:
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        funding_source:
          type: string
          enum: [jar, credit]
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        label:
          type: string
          minLength: 1
          maxLength: 60
        date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    AffordabilityResponse:
      description: Khối `affordability_card` (cả phong bì), cùng khối với tool `forecast___affordability_check`.
      $ref: '../blocks/affordability_card.schema.json'
    TraceResponse:
      description: >-
        Bản ghi lượt cho bảng "Vì sao", gồm khối `explain` đã dựng và chi tiết kỹ thuật. Cùng `data` của tool `audit___get_trace`.
      $ref: '../tools/audit.results.schema.json#/$defs/TraceData'
    FeedbackRequest:
      type: object
      required: [trace_id, option_id, decision]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        block_id:
          description: Id khối `options` hoặc `affordability_card` chứa phương án.
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        option_id:
          description: '`option_id` của phương án trong khối.'
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        decision:
          type: string
          enum: [accepted, rejected]
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        reason:
          description: Lý do ngắn người dùng nêu (tùy chọn, không chứa PII).
          type: string
          minLength: 1
          maxLength: 200
    FeedbackResponse:
      type: object
      required: [feedback_id, decision, recorded_at]
      additionalProperties: false
      properties:
        feedback_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [accepted, rejected]
        recorded_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    ResilienceScoreResponse:
      description: Khối `resilience_score` (cả phong bì), cùng khối với tool `forecast___get_resilience_score`.
      $ref: '../blocks/resilience_score.schema.json'
    StressRequest:
      description: Yêu cầu chạy một cú sốc mẫu. `shock_id` là một trong các mã của `GET /resilience/shocks`.
      type: object
      required: [shock_id]
      additionalProperties: false
      properties:
        shock_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
    StressResultResponse:
      description: Khối `stress_result` (cả phong bì), cùng khối với tool `forecast___stress_test`.
      $ref: '../blocks/stress_result.schema.json'
    ShocksResponse:
      description: Các cú sốc mẫu đọc từ `shocks.json`.
      $ref: '../tools/forecast.results.schema.json#/$defs/ListShocksData'
    RoadmapResponse:
      description: Khối `roadmap` (cả phong bì), cùng khối với tool `planner___get_roadmap`.
      $ref: '../blocks/roadmap.schema.json'
    RoadmapDiffResponse:
      description: Khối `roadmap_diff` (cả phong bì).
      $ref: '../blocks/roadmap_diff.schema.json'
    ReviewListResponse:
      description: Khối `review_list` (cả phong bì).
      $ref: '../blocks/review_list.schema.json'
    RoadmapJob:
      description: |
        Một lần sinh lại lộ trình chạy nền (bảng `roadmap_jobs`), cùng hình dạng với `yofina_core.roadmap.RoadmapJob`. `stage` là bước đang
        chạy; `progress` 0 đến 100. `done` có `version` và `roadmap_id`; `failed` có `error_code` và `error_message`.
      type: object
      required: [job_id, status, trigger, progress, requested_at]
      additionalProperties: false
      properties:
        job_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        status:
          type: string
          enum: [queued, running, done, failed]
        trigger:
          type: string
          enum: [user_request, behavior_changed, goal_changed, income_changed, forecast_drift]
        stage:
          type: string
          enum: [context, draft, allocate, suitability, save]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        requested_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        finished_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        roadmap_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        error_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        error_message:
          type: string
          minLength: 1
          maxLength: 280
    RoadmapVersionSummary:
      description: Một dòng của danh sách phiên bản, cùng hình dạng với `yofina_core.roadmap.RoadmapVersionSummary`.
      type: object
      required: [roadmap_id, version, status, reason_code, reason_text, created_at, app_date, feasibility, counts]
      additionalProperties: false
      properties:
        roadmap_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        status:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersionStatus'
        reason_code:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapReasonCode'
        reason_text:
          type: string
          minLength: 1
          maxLength: 160
        based_on_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        feasibility:
          type: string
          enum: [on_track, relaxed, infeasible]
        counts:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapCounts'
    RoadmapVersionsResponse:
      description: |
        Các phiên bản (mới nhất trước). `active_version` và `proposed_version` chỉ có khi có bản ở trạng thái đó; `current_job` chỉ có khi
        đang có một lần sinh lại chưa xong (queued hoặc running).
      type: object
      required: [versions]
      additionalProperties: false
      properties:
        versions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RoadmapVersionSummary'
        active_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        proposed_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        current_job:
          $ref: '#/components/schemas/RoadmapJob'
    RoadmapStepDecisionRequest:
      description: |
        Quyết định cho một bước của phiên bản `version`. `reason` (tùy chọn, không chứa PII) chỉ có nghĩa khi `rejected` ("hỏi một câu lý do"
        khi từ chối). Không có `user_id`.
      type: object
      required: [version, decision]
      additionalProperties: false
      properties:
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        decision:
          type: string
          enum: [accepted, rejected, pending]
        reason:
          type: string
          minLength: 1
          maxLength: 200
    RoadmapStepEditRequest:
      description: |
        Sửa một bước của phiên bản `version`: đổi số tiền (`amount_vnd`, số nguyên dương) hoặc ngày (`due_date`, ngày mô phỏng), ít nhất một
        trong hai. Không có `user_id`.
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        due_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
      anyOf:
        - required: [amount_vnd]
        - required: [due_date]
    RoadmapVersionDecisionRequest:
      description: '`adopt` là "Dùng bản mới", `keep_previous` là "Giữ bản cũ" (áp cho bản đang chờ chọn).'
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [adopt, keep_previous]
    RegenerateRoadmapRequest:
      description: |
        Yêu cầu sinh lại lộ trình. Mọi trường tùy chọn. `based_on_version` vắng thì lấy bản đang dùng. `alternative_id` là `option_id` của một
        trong hai lựa chọn của bản gốc khi mục tiêu chưa khả thi. `note` là ghi chú tự do của người dùng (lưu ở job, không đi vào sự kiện).
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 200
        alternative_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        based_on_version:
          $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
    ReviewAskSkipRequest:
      description: Để sau câu hỏi gộp của `ask_date` (ngày mô phỏng).
      type: object
      required: [ask_date]
      additionalProperties: false
      properties:
        ask_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    ReviewAskResponse:
      description: Trạng thái câu hỏi gộp của ngày (cùng `ReviewAsk` của khối `review_list`).
      $ref: '../blocks/review_list.schema.json#/$defs/ReviewAsk'
  responses:
    BadRequest:
      description: PARAMS_INVALID (tham số sai định dạng hoặc vô lý).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: UNAUTHENTICATED. JWT authorizer có thể trả thân rỗng 401 trước khi tới Lambda.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN, TOKEN_INVALID, TOKEN_EXPIRED hoặc CONSENT_REQUIRED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: JAR_NOT_FOUND, TRANSACTION_NOT_FOUND, OBLIGATION_NOT_FOUND, PAYEE_NOT_FOUND, SALARY_EVENT_NOT_FOUND, TRACE_NOT_FOUND, NUDGE_NOT_FOUND, FEE_SCHEDULE_NOT_FOUND, FORECAST_NOT_APPLICABLE, INGEST_JOB_NOT_FOUND, ROADMAP_NOT_FOUND hoặc SHOCK_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: TOKEN_REUSED, PARAMS_MISMATCH, ALREADY_APPLIED, DUPLICATE_TRANSACTION, INGEST_JOB_NOT_READY, INGEST_DUPLICATE_FILE hoặc ROADMAP_VERSION_CONFLICT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: INSUFFICIENT_FUNDS, AMOUNT_LIMIT_EXCEEDED, CREDIT_LIMIT_EXCEEDED, JAR_PROTECTED, PROFILE_INCOMPLETE, SCENARIO_INVALID, INGEST_NOT_FINANCIAL hoặc ROADMAP_INVALID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: OFFER_EXPIRED. Đề nghị đã quá hạn; hãy hỏi lại để có đề nghị mới.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NeedsConfirmation:
      description: NEEDS_CONFIRMATION. Chưa ghi gì; hãy lấy token ở `POST /confirmations`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: INGEST_TOO_LARGE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: INGEST_UNSUPPORTED_TYPE (thông điệp liệt kê loại tệp được hỗ trợ).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: DATABASE_UNAVAILABLE hoặc FORECAST_UNAVAILABLE. Thử lại sau vài giây (Aurora có thể đang thức dậy).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
