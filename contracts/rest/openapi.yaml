  /jars/split-proposal:
    post:
      tags: [wallet]
      operationId: proposeJarSplit
      summary: Tỷ lệ chia lương đề xuất theo số đã khai (onboarding bước 3)
      x-lambda: ledger
      description: |
        Chỉ đọc, không ghi gì (dùng POST để có thân yêu cầu). Server tính tỷ lệ hũ Nghĩa vụ = tổng nghĩa vụ đã khai trả từ
        hũ này, quy về tháng (tuần x 52/12, năm / 12, khoản một lần không lặp), chia lương ĐÃ KHAI, làm tròn lên điểm
        nguyên. `sinking_items` là các khoản biết trước trong 12 tháng tới CHƯA lưu: có khai thì đề xuất Quỹ dồn với tỷ lệ =
        tổng (phần còn thiếu / số kỳ lương còn lại trước ngày cần) / lương, làm tròn lên. Phần chênh lấy từ hoặc trả về Chi
        hằng ngày trước, rồi Dự phòng không xuống dưới sàn `buffer_min_split_percent`.

        `status`: `proposed` (lệch từ 1 điểm hoặc có khoản biết trước mới; `params` là tham số `save_jars` sẵn để xác nhận
        qua `POST /confirmations` rồi `POST /actions`), `aligned` (không cần đổi), `no_declarations` (chưa khai gì, giữ tỷ lệ
        mẫu, `obligation_basis` là `template`), `infeasible` (Nghĩa vụ + Quỹ dồn + sàn Dự phòng vượt 100%: không có `params`,
        `priority_obligations` theo thứ tự nhà ở, điện nước, rồi nợ; giao diện mở lộ trình, không gợi ý cắt khoản thiết yếu),
        `salary_mismatch` (lương nhận gần nhất lệch lương đã khai quá ngưỡng BR-12: hỏi cập nhật lương trước), `no_salary`,
        `no_obligation_jar`. `checks` so các khoản đến hạn trước ngày lương của kỳ hiện tại và kỳ kế tiếp với số dư cộng
        phần chia, nêu khoản đầu tiên bị thiếu và số thiếu. Mọi số do server tính (BR-47, BR-48).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitProposalRequest'
      responses:
        '200':
          description: Đề xuất (có thể là không cần đổi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
