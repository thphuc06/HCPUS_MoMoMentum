      summary: Chốt các dòng của một lần nạp vào sổ cái với token xác nhận (`confirm_rows`)
      x-lambda: ingest
      description: |
        Như `POST /actions` nhưng CHỈ nhận `tool` = `confirm_rows`; tool khác bị từ chối `PARAMS_INVALID`. Kiểm token (chữ ký,
        hạn, tool, sub, hash tham số, `jti` chưa dùng) rồi ghi các dòng đã chọn vào sổ cái với `funding_source = external` (KHÔNG
        đổi số dư hũ), đánh dấu dòng bị bỏ, ghi `audit_events` và kích hoạt tính lại dự báo trong một lần. Thiếu `confirm_token`
        thì không ghi, trả 428 `NEEDS_CONFIRMATION`. Thành công trả khối `receipt_action` có `coverage_change` (độ phủ dữ liệu
        trước và sau). Chốt lại một lần đã chốt (job `done`) trả 409 `ALREADY_APPLIED`, không ghi gì.
