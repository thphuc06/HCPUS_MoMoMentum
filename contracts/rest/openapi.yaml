  /ingest/confirmations:
    post:
      tags: [ingest]
      operationId: createIngestConfirmation
      summary: Cấp token xác nhận cho việc chốt các dòng của một lần nạp (`confirm_rows`)
      x-lambda: ingest
      description: |
        Như `POST /confirmations` nhưng CHỈ nhận `tool` = `confirm_rows`; tool khác bị từ chối `PARAMS_INVALID` (và ngược lại
        `POST /confirmations` của `ledger` không nhận `confirm_rows`). Cùng khóa HMAC, cùng bảng `jti`, cùng thời gian sống token
        và cùng cách chuẩn hóa tham số (`normalize_confirm_rows`). Server kiểm job thuộc người gọi và đang `review`, các dòng
        còn mở (`auto_added`, `pending`; dòng `duplicate` không chốt được), hũ là hũ người dùng; trả bản xem trước (`preview`):
        số dòng và tổng tiền sẽ ghi, dòng bỏ, và cảnh báo. Không ghi gì.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestConfirmationRequest'
      responses:
