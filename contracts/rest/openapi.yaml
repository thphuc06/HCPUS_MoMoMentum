      x-lambda: forecast
      description: |
        Đọc bản mới nhất của `behavior_profiles` không sau hôm nay mô phỏng (batch đêm ghi; đặt lại dữ liệu demo tính lại). CÙNG `data`
        với tool `forecast___get_behavior_profile`. Mỗi nhận xét có bằng chứng số đọc từ sổ cái (số trong câu nhận xét đều có trong
        `evidence`). Chưa đủ lịch sử hoặc batch chưa chạy thì 200 với `ready` sai và không có nhận xét (không phải lỗi). Màn Hồ sơ dựng
