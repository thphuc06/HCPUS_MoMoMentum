  /roadmap/diff:
    get:
      tags: [roadmap]
      operationId: getRoadmapDiff
      summary: So hai phiên bản lộ trình (khối roadmap_diff)
      x-lambda: ledger
      description: |
        Bước thêm, bỏ, đổi giữa hai phiên bản (so theo `step_id`) kèm lý do sinh lại của bản mới; dùng cho "so với bản cũ" ở màn L3. Vắng
        `to_version` thì lấy bản chờ chọn (`proposed`), không có thì bản đang dùng; vắng `from_version` thì lấy `based_on_version` của
        bản `to`. `can_adopt` đúng khi bản `to` đang chờ chọn. Hai phiên bản trùng nhau thì 400; phiên bản không có thì 404
        `ROADMAP_NOT_FOUND`.
