        Mới nhất trước, chỉ của người gọi. Mỗi phần tử có `status` và `progress` nhưng không có bảng duyệt; mở một lần nạp bằng
        `GET /ingest/jobs/{job_id}`. Chưa có lần nào thì `jobs` rỗng. Dùng để người dùng quay lại thấy lần nạp đang `review`
        thay vì phải tải lại.
      parameters:
