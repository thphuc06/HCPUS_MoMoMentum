        `to_version` thì lấy bản chờ chọn (`proposed`), không có thì bản đang dùng; vắng `from_version` thì lấy `based_on_version` của
        bản `to`. `can_adopt` đúng khi bản `to` đang chờ chọn. Hai phiên bản trùng nhau thì 400; phiên bản không có thì 404
