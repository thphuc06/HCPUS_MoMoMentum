  /resilience:
    get:
      tags: [resilience]
      operationId: getResilienceScore
      summary: Điểm chống chịu 0 đến 100 và bốn thành phần (khối resilience_score)
      x-lambda: forecast
      description: |
        Trả đúng khối `resilience_score`, cùng khối và cùng số với tool `forecast___get_resilience_score` trong chat. Đọc điểm đã lưu
        (batch đêm, đặt lại dữ liệu); quá cũ (ngày mô phỏng đã sang ngày khác, hoặc cấu hình trọng số đã đổi) thì tính lại trước khi trả.
        Bốn thành phần Save, Spend, Borrow, Plan, mỗi thành phần có điểm, trọng số, đầu vào đã dùng và câu giải thích do code dựng. Thành
        phần không áp dụng được (chưa có mục tiêu thì Plan) có `applicable` sai và trọng số bị chuẩn hóa lại cho các thành phần còn lại.
        Nhóm điểm (yếu, vừa, tốt) luôn hiện bằng chữ. Chưa khai lương thì 422 `PROFILE_INCOMPLETE`; chưa có dự báo và không tính được
        ngay thì 503 `FORECAST_UNAVAILABLE`. Điểm này KHÔNG phải điểm tín dụng (`disclaimer`).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Khối `resilience_score`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResilienceScoreResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
