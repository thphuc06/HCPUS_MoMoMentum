          description: Hũ người dùng (không gồm hũ hệ thống), theo thứ tự hiển thị. Rỗng với tài khoản trắng.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarFull'
        system_jars:
          description: Hai hũ hệ thống Tiền vào khác và Chưa phân loại (rỗng nếu chưa tạo).
