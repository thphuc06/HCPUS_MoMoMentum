            $ref: '../blocks/roadmap.schema.json#/$defs/RoadmapVersion'
      responses:
        '200':
          description: Khối `roadmap_diff`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapDiffResponse'
