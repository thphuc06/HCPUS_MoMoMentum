  /forecasts/{jar_code}:
    get:
      tags: [forecast]
      operationId: getForecast
      summary: Dự báo 30 ngày của một hũ (khối forecast_timeline)
      x-lambda: forecast
      description: |
        Trả đúng khối `forecast_timeline`, cùng một khối và cùng số với tool `forecast___get_forecast` trong chat.
        Số liệu đọc từ bảng `forecasts` (lần chạy mới nhất có chứa hũ). Quá hạn độ tươi (cấu hình) hoặc ngày mô
        phỏng đã sang ngày khác so với `origin_date` thì tính lại trước khi trả; không tính lại được thì trả
        bản cũ với `stale` true; chưa có bản nào và không tính được thì 503 `FORECAST_UNAVAILABLE`. Hũ HỆ THỐNG (Tiền vào khác,
        Chưa phân loại) không có dự báo: 404 `FORECAST_NOT_APPLICABLE` (phase 2 trả 503; từ phase 3 503 chỉ còn nghĩa là lỗi tạm thời).

        Hiển thị: `p_shortfall` có thì hiện kèm `confidence_band`; vắng thì chỉ hiện `confidence_band` (Cao, Vừa,
        Thấp); `is_initial_estimate` thì ghi "ước lượng ban đầu".
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/JarCodePath'
      responses:
        '200':
          description: Khối dự báo của hũ.
          content:
            application/json:
              schema:
                $ref: '../blocks/forecast_timeline.schema.json'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /affordability:
    post:
      tags: [affordability]
      operationId: checkAffordability
      summary: Kiểm tra trước khi quẹt (thẻ đủ, sát, hụt)
      x-lambda: forecast
      description: |
        Dùng cho màn chuyển tiền (T3a, T3b, T3c), KHÔNG qua LLM và không ghi gì. Chạy đúng engine của tool
        `forecast___affordability_check` nên trả CÙNG khối `affordability_card` và cùng số với chat. Nguồn là hũ: đủ, sát (cạn
        sớm N ngày) hay hụt (M đồng trước kỳ lương), kiểm từng hũ chi tiêu khi không chỉ định `jar`. Nguồn Trả sau (mô phỏng):
        chi phí của món này (`credit.cost.item_cost_vnd`, gồm phần phí phát sinh thêm) TÁCH khỏi tổng phải trả ngày đến hạn
        (`credit.cost.total_due_vnd`, cộng dồn nghĩa vụ đã có), hũ nào hụt khi đến hạn, tỷ lệ nghĩa vụ trên thu nhập so với
        ngưỡng của luật. Kèm phương án tất định (hoãn, đổi hũ, chia nhỏ, trả ngay). Không có `funding_source` thì xét cả hai
        nguồn. Ngưỡng đủ, sát, hụt nằm trong cấu hình. Mục tiêu độ trễ: p95 dưới 2 giây.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffordabilityRequest'
      responses:
        '200':
          description: Khối `affordability_card`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffordabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
