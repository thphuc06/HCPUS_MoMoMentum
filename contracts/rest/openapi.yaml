  /roadmap/regenerate:
    post:
      tags: [roadmap]
      operationId: regenerateRoadmap
      summary: Yêu cầu sinh lại lộ trình (chạy nền)
      x-lambda: ledger
      description: |
        Ghi một dòng `roadmap_jobs` (trigger `user_request`), phát sự kiện `roadmap.regeneration_requested` rồi trả NGAY job (HTTP 200,
        `status` queued). Việc sinh (Roadmap agent, `optimize_allocation`, `check_suitability`, `save_roadmap`) chạy nền; giao diện hỏi tiến
        độ bằng `GET /roadmap/jobs/{job_id}` cho tới khi `done` (có `version`) hoặc `failed`. Đang có một lần sinh lại chưa xong thì trả
        CHÍNH job đó (không tạo thêm). `alternative_id` (một trong hai lựa chọn của bản `based_on_version` khi mục tiêu chưa khả thi)
        được áp khi sinh. Chưa có lộ trình thì job sinh bản đầu tiên. Bản mới ra là `proposed` (trừ bản đầu tiên): người dùng chọn bằng
        `POST /roadmap/versions/{version}/decision`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateRoadmapRequest'
