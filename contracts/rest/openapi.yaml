      x-lambda: ingest
      description: |
        Kiểm loại tệp và kích thước khai báo theo cấu hình (`ingest_image_max_bytes`, `ingest_csv_max_bytes`,
        `ingest_image_mime_types`, `ingest_csv_mime_types`), ghi đồng ý của nguồn này (bảng `consents`) khi `consent` đúng,
        tạo job `awaiting_upload` rồi trả presigned POST của S3 (`url`, `fields`) với khóa
        `{user_id}/{job_id}` (không có tên tệp gốc) và chính sách `content-length-range` cùng `Content-Type` cố định, hết hạn sau
        `ingest_upload_url_ttl_seconds`.

        **Đồng ý**: người dùng chưa đồng ý (hoặc đã rút) cho nguồn này mà không gửi `consent: true` thì 403 `CONSENT_REQUIRED`
        và không tạo gì. Đã đồng ý thì `consent` có thể bỏ.

        **Bắt đầu job**: không có endpoint "bắt đầu". Tải lên thành công thì sự kiện S3 `ObjectCreated` (qua SQS có DLQ) tự đưa
        job sang `queued` rồi `processing`; frontend chỉ cần `GET /ingest/jobs/{job_id}`. Lý do: tải lên chính là tín hiệu bắt
        đầu, không có trạng thái "đã tải mà quên bấm bắt đầu", và không có thêm một đường ghi từ client. Tệp tới mà job không
        còn ở `awaiting_upload` (tải lại cùng URL) thì bị bỏ qua. Cùng nội dung tệp với một job còn sống thì job mới thành
        `rejected` với `INGEST_DUPLICATE_FILE` (so `content_sha256`).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestUploadRequest'
      responses:
        '200':
          description: Đã tạo job và cấp URL tải lên.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ingest/jobs:
