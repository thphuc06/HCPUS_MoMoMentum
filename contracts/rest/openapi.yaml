          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        - name: needs_review
          in: query
          required: false
          description: true chỉ lấy giao dịch cần xem lại.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Số dòng tối đa (1 đến 50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Một trang giao dịch (rỗng nếu không có).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
