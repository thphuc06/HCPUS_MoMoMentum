        (khối `ingest_review`, id `ingest_review:{job_id}`); `done` có thêm `coverage_change` (khối của lần chốt).
        `failed` và `rejected` có `error_code` (ví dụ `INGEST_NOT_FINANCIAL`) và câu `error_message` hiển thị được.
        Job không có hoặc không thuộc người gọi: 404 `INGEST_JOB_NOT_FOUND` (không phân biệt).
