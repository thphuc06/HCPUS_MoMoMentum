openapi: 3.1.0
info:
  title: Yofina Foresight REST API
  version: 1.0.0
  summary: Màn hình không cần LLM, cấp token xác nhận, thực hiện thao tác ghi, đặt lại dữ liệu demo.
  description: |
    API Gateway HTTP API với JWT authorizer của Cognito, cùng một Lambda `ledger` với đường Gateway
    của agent (một mã, hai đường vào). Chi tiết thiết kế: ADR-0002 (xác nhận trước khi ghi) và
    ADR-0003 (đồng hồ mô phỏng); quy ước chung: contracts/README.md.

    **Danh tính**: `sub` của access token Cognito là người dùng; không endpoint nào nhận `user_id`
    từ client.

    **Tiền** là số nguyên VND. **Ngày** là ngày mô phỏng của người dùng (ADR-0003), trừ trường nói
    rõ là thời điểm thật (`as_of`, `occurred_at`, `expires_at`: RFC 3339, UTC).

    **Luồng ghi**: (1) agent hoặc UI lấy khối `confirm` / `confirm_action` (tool trả
    NEEDS_CONFIRMATION, hoặc màn hình tự dựng bản xem lại từ `params` của mình); (2) người dùng
    bấm xác nhận → `POST /confirmations` cấp token dùng một lần; (3) `POST /actions` kèm token →
    ghi và trả khối `receipt` (chuyển hũ) hoặc `receipt_action` (mọi thao tác ghi khác). LLM không
    nằm trên đường ghi.

    **Không có đường ghi tắt.** Mọi thao tác GHI, kể cả khi người dùng bấm trực tiếp trên màn hình
    (khai lương, tạo hũ, ghi chi tiêu, chuyển tiền cho người nhận, xác nhận lương về, onboarding),
    đều là `tool` + `params` đi qua `POST /confirmations` rồi `POST /actions`. Chỉ có hai khác biệt
    so với đường chat: màn hình không có khối `confirm`, nên `conversation_id` và `confirm_block_id`
    được bỏ; và màn hình tự dựng bản xem lại từ `params` đã nhập. Các endpoint `GET` còn lại
    không ghi gì. Bảng `tool` -> việc trên màn hình nằm ở mô tả của `POST /actions`.

    **Lambda phục vụ**: trường `x-lambda` của thao tác (`ledger`, `forecast`, `audit` hoặc `ingest`) cho CDK nối route
    vào đúng Lambda; không có thì mặc định là `ledger`. `GET /forecasts/{jar_code}` và `POST /affordability` do `forecast`;
    `GET /traces/{trace_id}` và `POST /feedback` do `ledger` (phase 3: mã tool `audit`, `planner`, `knowledge` chạy chung Lambda `yofina-ledger`).

    **Phase 3**: thêm `POST /affordability` (kiểm tra trước khi quẹt, tất định, KHÔNG qua LLM), `GET /traces/{trace_id}`
    (bảng "Vì sao", chỉ của chính người dùng) và `POST /feedback` (chấp nhận hoặc từ chối một phương án). `POST /affordability`
    chỉ dùng POST để có thân yêu cầu, không ghi gì. `POST /feedback` ghi một dòng phản hồi không đụng tiền nên KHÔNG đi qua
    token xác nhận (lý do ở "Quyết định hợp đồng phase 3"). Lời nhắc (`schedule_nudge`) là thao tác ghi thật nên vẫn đi qua
    `POST /confirmations` rồi `POST /actions`, không có endpoint ghi riêng.
    Sáu route `/ingest/*` (phase 5) do `ingest`: `POST /ingest/uploads`, `GET /ingest/jobs`, `GET /ingest/jobs/{job_id}`,
    `POST /ingest/rows/{row_id}/jar`, `POST /ingest/confirmations`, `POST /ingest/actions`. Tool `confirm_rows` CHỈ đi qua hai
    route `/ingest/confirmations` và `/ingest/actions` (cùng luồng token, cùng khóa HMAC và bảng `jti` với ledger); `POST /confirmations` và
    `POST /actions` của `ledger` không nhận nó. Việc đổi hũ dùng POST (không PATCH) vì CORS của HTTP API chung chỉ cho GET, POST, OPTIONS.

    **Phase 4** (chống chịu, lộ trình, phân hũ tự động): 13 endpoint mới. Điểm chống chịu và cú sốc (`GET /resilience`,
    `GET /resilience/shocks`, `POST /resilience/stress`, `x-lambda: forecast`, tất định, không qua LLM, không ghi gì; `POST` chỉ để có
    thân yêu cầu). Lộ trình (`GET /roadmap`, `GET /roadmap/versions`, `GET /roadmap/diff`, `POST /roadmap/steps/{step_id}/decision`,
    `POST /roadmap/steps/{step_id}/edit`, `POST /roadmap/versions/{version}/decision`, `POST /roadmap/regenerate`,
    `GET /roadmap/jobs/{job_id}`, `x-lambda: ledger`): lưu và đổi trạng thái lộ trình là thao tác ghi KHÔNG đổi số dư nên KHÔNG qua
    token xác nhận (như `POST /feedback`); hành động đổi tiền gắn trong một bước (`action`) vẫn đi qua `POST /confirmations` rồi
    `POST /actions`, và chấp nhận một bước không tự thực hiện nó. Sinh lại chạy nền: `POST /roadmap/regenerate` trả ngay một job, giao
    diện hỏi tiến độ bằng `GET /roadmap/jobs/{job_id}` (polling). Danh sách "Xem lại" và hỏi gộp (`GET /review`,
    `POST /review/daily-ask/skip`, `x-lambda: ledger`): sửa hũ dùng lại `assign_jar` qua `POST /confirmations` và `POST /actions` (đừng
    tạo đường ghi thứ hai); `remember` once hoặc always chọn phạm vi luật.

    Mã lỗi (`ErrorCode`) dùng chung với kết quả tool và `notice.data.code`; ánh xạ HTTP status ở
    `x-http-status`. Schema khối UI và tham số được tham chiếu tới `../blocks/*.schema.json` và
    `../tools/*.results.schema.json`.
servers:
  - url: https://{host}
    description: Domain API do CDK xuất ra (output của stack YofinaTools); không gắn cứng trong repo.
    variables:
      host:
        default: api.yofina.invalid
security:
  - bearerAuth: []
tags:
  - name: ledger
    description: Số dư hũ và thao tác ghi sổ cái.
  - name: wallet
    description: Màn hình ví mô phỏng (Tổng quan, hũ, giao dịch, nghĩa vụ, hạn mức, lương). Chỉ đọc.
  - name: forecast
    description: Dự báo 30 ngày theo hũ (F1). Chỉ đọc.
  - name: conversations
    description: Đọc lại các lượt hội thoại đã lưu (không cần LLM).
  - name: affordability
    description: Kiểm tra trước khi quẹt (F3). Tất định, không qua LLM, không ghi.
  - name: audit
    description: Bảng "Vì sao" (trace của chính người dùng) và phản hồi về phương án.
  - name: demo
    description: Chỉ cho tài khoản demo.
  - name: ingest
    description: |
      Nạp chi tiêu và thu nhập NGOÀI ví từ ảnh hoặc CSV (phase 5, F6). Tải lên bằng presigned POST thẳng vào S3; S3 tự bắt
      đầu job (sự kiện ObjectCreated qua SQS). Đọc trạng thái và bảng duyệt; đổi hũ đề xuất của một dòng (không ghi sổ cái).
      Chốt dòng vào sổ cái là tool `confirm_rows` qua `POST /ingest/confirmations` rồi `POST /ingest/actions` (không có đường ghi tắt).
  - name: resilience
    description: Điểm chống chịu 0 đến 100 với bốn thành phần và ba cú sốc mẫu (F4). Tất định, không qua LLM, không ghi.
  - name: roadmap
    description: Lộ trình theo giai đoạn có phiên bản (F5). Đọc, đổi trạng thái từng bước, so phiên bản, yêu cầu sinh lại (chạy nền, hỏi tiến độ bằng polling). Không đổi số dư, không qua token.
  - name: review
    description: Danh sách "Xem lại" và hỏi gộp một lần mỗi ngày của phân hũ tự động (F2). Sửa hũ đi qua `assign_jar` ở `POST /confirmations` và `POST /actions`.
paths:
  /jars:
    get:
      tags: [ledger]
      operationId: getJars
      summary: Số dư các hũ của người dùng đang đăng nhập
      description: Cùng nguồn số liệu với tool `ledger___get_jar_balances` và khối `jar_summary`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách hũ theo thứ tự hiển thị.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JarsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /confirmations:
    post:
      tags: [ledger]
      operationId: createConfirmation
      summary: Cấp token xác nhận dùng một lần
      description: |
        Gọi khi người dùng bấm nút trong khối `confirm`. Server xác thực người dùng bằng JWT, chuẩn
        hóa lại tham số, kiểm tra nghiệp vụ (hũ tồn tại, đủ số dư, hạn mức) rồi ký token
        HMAC trên (sub, tool, params_hash, hạn, jti). Token **mờ** với client: không phân tích nó.
        Nếu gửi `conversation_id` và `confirm_block_id` mà đề nghị đã được thực hiện hoặc đã bị hủy thì trả 409
        `ALREADY_APPLIED` và không cấp token; đề nghị đã quá `expires_at` của khối `confirm` đã lưu thì trả 410
        `OFFER_EXPIRED` ("đề nghị đã hết hạn, hãy hỏi lại"; phase 2 trả 403 `TOKEN_EXPIRED` cho trường hợp này): server ép hạn
        của đề nghị, không chỉ giao diện. `TOKEN_EXPIRED` (403) chỉ còn nghĩa là TOKEN quá 2 phút.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: Token đã cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /confirmations/cancel:
    post:
      tags: [ledger]
      operationId: cancelConfirmation
      summary: Ghi việc người dùng bấm "Không" với một đề nghị
      x-lambda: ledger
      description: |
        Lưu ở server trạng thái `cancelled` của đề nghị (khối `confirm` hoặc `confirm_action` có id `confirm_block_id`
        trong cuộc hội thoại `conversation_id`). Không ghi sổ cái, không cần token. Sau đó `GET /conversations/{id}` trả
        `resolutions` có phần tử `cancelled`, và `POST /confirmations` hoặc `POST /actions` với cùng `confirm_block_id`
        trả 409 `ALREADY_APPLIED` (thông điệp nói đề nghị đã bị hủy). Hủy lại đề nghị đã hủy trả đúng kết quả cũ
        (idempotent). Đề nghị đã thực hiện (`done`) thì không hủy được: 409 `ALREADY_APPLIED`. Đề nghị không có trong
        hội thoại của người gọi (hoặc của người khác): 400 `PARAMS_INVALID`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelConfirmationRequest'
      responses:
        '200':
          description: Đã ghi trạng thái hủy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /actions:
    post:
      tags: [ledger]
      operationId: applyAction
      summary: Thực hiện thao tác ghi với token xác nhận
      x-lambda: ledger
      description: |
        Kiểm token (chữ ký, hạn, tool, sub, hash tham số, `jti` chưa dùng) rồi ghi trong một
        transaction và ghi `audit_events`. Thiếu `confirm_token` thì không ghi, trả 428
        `NEEDS_CONFIRMATION`. Thành công trả khối `receipt` (chuyển hũ) hoặc `receipt_action`.

        **Bảng `tool` -> việc trên màn hình** (mọi dòng đều theo luồng `POST /confirmations` rồi
        `POST /actions`; `params` được chuẩn hóa ở server, xem contracts/README.md mục "Chuẩn hóa
        tham số"):

        | `tool` | Việc | Agent gọi được |
        |---|---|---|
        | `move_between_jars` | Chuyển tiền giữa hai hũ (kể cả từ hũ Tiền vào khác sang hũ để gán) | có |
        | `record_transaction` | Chi tiêu trên ví mô phỏng bằng tiền hũ hoặc bằng hạn mức Trả sau (mô phỏng); chuyển tiền cho người nhận; nhận tiền vào (lương hoặc tiền vào khác); trả một nghĩa vụ (`obligation_id`) | có |
        | `assign_jar` | Gán hoặc sửa hũ của một giao dịch (Chưa phân loại, Tiền vào khác), tùy chọn nhớ thành luật | có |
        | `update_profile` | Khai và sửa lương, ngày nhận, mức rủi ro, tên; thêm, sửa, xóa MỘT nghĩa vụ mỗi lần. Onboarding tài khoản trắng: lần gọi đầu có lương và ngày nhận (bắt buộc cả hai) tạo hồ sơ, hai hũ hệ thống và hũ mặc định từ `GET /jar-templates` | có |
        | `save_jars` | Tạo, sửa hũ, tỷ lệ chia lương, mục tiêu và hạn (thay cả danh sách hũ của người dùng, tổng tỷ lệ bằng 100) | không (chỉ màn hình) |
        | `confirm_salary` | Xác nhận một chạm lương về: chia vào hũ theo luật, hoặc giữ ở Tiền vào khác; tùy chọn cập nhật lương đã khai | không (chỉ màn hình) |
        | `schedule_nudge` | Đặt (`op` create) hoặc hủy (`op` cancel, nút Hoàn tác) một lời nhắc vào một ngày mô phỏng; ghi bảng `nudges`. Agent gọi qua target `planner` | có |

        `confirm_rows` (phase 5) KHÔNG nằm ở đây: nó đi qua `POST /ingest/confirmations` và `POST /ingest/actions`.

        **Một đề nghị chỉ được thực hiện một lần.** Khi client gửi `conversation_id` và
        `confirm_block_id` (id của khối `confirm` đang được thực hiện), server lưu khối `receipt`
        gắn với đề nghị đó trong CÙNG transaction với sổ cái; `GET /conversations/{id}` trả lại nó
        (`resolutions`). Đề nghị đã thực hiện rồi thì trả 409 `ALREADY_APPLIED` và không ghi gì, kể
        cả khi token mới hợp lệ. Không gửi hai trường này (gọi REST trực tiếp) thì hành vi như cũ.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: |
            Đã ghi. `move_between_jars` trả khối `receipt` (như phase 1); mọi tool khác trả khối
            `receipt_action`. Phân biệt bằng `type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/NeedsConfirmation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: Các cuộc hội thoại gần đây của người dùng đang đăng nhập
      description: |
        Mỗi cuộc hội thoại là một `session id` của chat (frontend sinh, giữ ổn định theo cuộc hội thoại).
        Sắp theo hoạt động gần nhất trước. Chỉ gồm lượt đã được agent lưu (`ledger___save_turn`).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: limit
          in: query
          required: false
          description: Số cuộc hội thoại tối đa (1 đến 50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Danh sách cuộc hội thoại (rỗng nếu chưa có).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /conversations/{conversation_id}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Các lượt của một cuộc hội thoại, để vẽ lại khi tải lại trang
      description: |
        Trả các lượt đã lưu của cuộc hội thoại theo thứ tự cũ tới mới (tối đa 50 lượt gần nhất), mỗi
        lượt kèm câu hỏi, câu trả lời bằng chữ và các khối UI đã phát (nguyên văn, đúng thứ tự phát).
        Cuộc hội thoại không có hoặc không thuộc người gọi: **200 với `turns` rỗng** (không phân biệt hai
        trường hợp để không lộ sự tồn tại của hội thoại người khác). Khối `confirm` được lưu như lúc
        phát; trạng thái của từng khối `confirm` (chưa bấm, đã thực hiện kèm biên nhận, hết hạn) nằm ở
        `resolutions` của lượt, do server giữ (nguồn sự thật, không suy từ số dư).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: Các lượt đã lưu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /overview:
    get:
      tags: [wallet]
      operationId: getOverview
      summary: Mọi thứ Tổng quan cần, trong một lần gọi
      x-lambda: ledger
      description: |
        Một lệnh gọi cho màn Tổng quan (không cần LLM): hồ sơ (kể cả `display_name`), ngày mô phỏng,
        tổng số dư, hũ kèm trạng thái đủ/sát/hụt và ngày cạn lấy từ dự báo mới nhất, hai hũ hệ thống,
        thẻ chủ động (tối đa một), kỳ lương kế, nghĩa vụ sắp đến hạn, hạn mức Trả sau (mô phỏng),
        giao dịch gần đây. Số liệu đọc từ Aurora bằng ba truy vấn (`app_get_overview_extras`,
        `app_list_jars`, `app_get_forecast_summaries`), không tính lại dự báo ở đây.

        **Tổng số dư** `balance.total_vnd` là tổng số dư của MỌI hũ, gồm hũ Tiền vào khác và hũ Chưa
        phân loại (số dư hũ này thường âm: tiền đã chi chưa xếp hũ). Tiền vào khác lương nằm ở hũ
        Tiền vào khác, vẫn tính vào tổng nhưng KHÔNG phải thu nhập.

        **Tài khoản trắng** (chưa khai lương và ngày nhận): `profile.onboarded` là false,
        `jars` rỗng, `next_payday`, `forecast`, `proactive_card` là null; giao diện chuyển sang
        onboarding (`update_profile`).

        **Thẻ chủ động** (`proactive_card`): phase 2 do server chọn bằng luật tất định theo thứ tự ưu
        tiên: lương về chờ xác nhận, hũ hụt có ngày cạn sớm nhất, hũ sát, nghĩa vụ đến hạn trong 3
        ngày, giao dịch cần xem lại, dữ liệu ít (ước lượng ban đầu); không có việc nào thì null.
        `snooze` và `mute_kind` chỉ lưu phía giao diện ở phase 2.

        **Kỳ lương kế** (`next_payday.state`): gọi L là ngày lương gần nhất không sau hôm nay mô
        phỏng. `confirmed` nếu có sự kiện lương đã xác nhận với `period_date` bằng L; `pending_confirmation`
        nếu có sự kiện lương đang chờ (kèm `salary_event_id`); còn lại `expected`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Dữ liệu Tổng quan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
