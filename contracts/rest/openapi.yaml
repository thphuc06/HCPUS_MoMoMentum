      x-lambda: ingest
      description: |
        Mới nhất trước, chỉ của người gọi. Mỗi phần tử có `status` và `progress` nhưng không có bảng duyệt; mở một lần nạp bằng
        `GET /ingest/jobs/{job_id}`. Chưa có lần nào thì `jobs` rỗng. Dùng để người dùng quay lại thấy lần nạp đang `review`
        thay vì phải tải lại.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: limit
          in: query
          required: false
          description: Số lần nạp tối đa (1 đến 20). Mặc định 10.
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Danh sách lần nạp gần đây (rỗng nếu chưa có).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /ingest/jobs/{job_id}:
    get:
      tags: [ingest]
