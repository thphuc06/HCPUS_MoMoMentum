openapi: 3.1.0
info:
  title: Yofina Foresight REST API
  version: 1.0.0
  summary: Màn hình không cần LLM, cấp token xác nhận, thực hiện thao tác ghi, đặt lại dữ liệu demo.
  description: |
    API Gateway HTTP API với JWT authorizer của Cognito, cùng một Lambda `ledger` với đường Gateway
    của agent (một mã, hai đường vào). Chi tiết thiết kế: ADR-0002 (xác nhận trước khi ghi) và
    ADR-0003 (đồng hồ mô phỏng); quy ước chung: contracts/README.md.

    **Danh tính**: `sub` của access token Cognito là người dùng; không endpoint nào nhận `user_id`
    từ client.

    **Tiền** là số nguyên VND. **Ngày** là ngày mô phỏng của người dùng (ADR-0003), trừ trường nói
    rõ là thời điểm thật (`as_of`, `occurred_at`, `expires_at`: RFC 3339, UTC).

    **Luồng ghi**: (1) agent hoặc UI lấy khối `confirm` / `confirm_action` (tool trả
    NEEDS_CONFIRMATION, hoặc màn hình tự dựng bản xem lại từ `params` của mình); (2) người dùng
    bấm xác nhận → `POST /confirmations` cấp token dùng một lần; (3) `POST /actions` kèm token →
    ghi và trả khối `receipt` (chuyển hũ) hoặc `receipt_action` (mọi thao tác ghi khác). LLM không
    nằm trên đường ghi.

    **Không có đường ghi tắt.** Mọi thao tác GHI, kể cả khi người dùng bấm trực tiếp trên màn hình
    (khai lương, tạo hũ, ghi chi tiêu, chuyển tiền cho người nhận, xác nhận lương về, onboarding),
    đều là `tool` + `params` đi qua `POST /confirmations` rồi `POST /actions`. Chỉ có hai khác biệt
    so với đường chat: màn hình không có khối `confirm`, nên `conversation_id` và `confirm_block_id`
    được bỏ; và màn hình tự dựng bản xem lại từ `params` đã nhập. Các endpoint `GET` còn lại
    không ghi gì. Bảng `tool` -> việc trên màn hình nằm ở mô tả của `POST /actions`.

    **Lambda phục vụ**: trường `x-lambda` của thao tác (`ledger`, `forecast` hoặc `audit`) cho CDK nối route
    vào đúng Lambda; không có thì mặc định là `ledger`. `GET /forecasts/{jar_code}` và `POST /affordability` do `forecast`;
    `GET /traces/{trace_id}` và `POST /feedback` do `ledger` (phase 3: mã tool `audit`, `planner`, `knowledge` chạy chung Lambda `yofina-ledger`).

    **Phase 3**: thêm `POST /affordability` (kiểm tra trước khi quẹt, tất định, KHÔNG qua LLM), `GET /traces/{trace_id}`
    (bảng "Vì sao", chỉ của chính người dùng) và `POST /feedback` (chấp nhận hoặc từ chối một phương án). `POST /affordability`
    chỉ dùng POST để có thân yêu cầu, không ghi gì. `POST /feedback` ghi một dòng phản hồi không đụng tiền nên KHÔNG đi qua
    token xác nhận (lý do ở "Quyết định hợp đồng phase 3"). Lời nhắc (`schedule_nudge`) là thao tác ghi thật nên vẫn đi qua
    `POST /confirmations` rồi `POST /actions`, không có endpoint ghi riêng.

    Mã lỗi (`ErrorCode`) dùng chung với kết quả tool và `notice.data.code`; ánh xạ HTTP status ở
    `x-http-status`. Schema khối UI và tham số được tham chiếu tới `../blocks/*.schema.json` và
    `../tools/*.results.schema.json`.
servers:
  - url: https://{host}
    description: Domain API do CDK xuất ra (output của stack YofinaTools); không gắn cứng trong repo.
    variables:
      host:
        default: api.yofina.invalid
security:
  - bearerAuth: []
tags:
  - name: ledger
    description: Số dư hũ và thao tác ghi sổ cái.
  - name: wallet
    description: Màn hình ví mô phỏng (Tổng quan, hũ, giao dịch, nghĩa vụ, hạn mức, lương). Chỉ đọc.
  - name: forecast
    description: Dự báo 30 ngày theo hũ (F1). Chỉ đọc.
  - name: conversations
    description: Đọc lại các lượt hội thoại đã lưu (không cần LLM).
  - name: affordability
    description: Kiểm tra trước khi quẹt (F3). Tất định, không qua LLM, không ghi.
  - name: audit
    description: Bảng "Vì sao" (trace của chính người dùng) và phản hồi về phương án.
  - name: demo
    description: Chỉ cho tài khoản demo.
paths:
  /jars:
    get:
      tags: [ledger]
      operationId: getJars
      summary: Số dư các hũ của người dùng đang đăng nhập
      description: Cùng nguồn số liệu với tool `ledger___get_jar_balances` và khối `jar_summary`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách hũ theo thứ tự hiển thị.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JarsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /confirmations:
    post:
      tags: [ledger]
      operationId: createConfirmation
      summary: Cấp token xác nhận dùng một lần
      description: |
        Gọi khi người dùng bấm nút trong khối `confirm`. Server xác thực người dùng bằng JWT, chuẩn
        hóa lại tham số, kiểm tra nghiệp vụ (hũ tồn tại, đủ số dư, hạn mức) rồi ký token
        HMAC trên (sub, tool, params_hash, hạn, jti). Token **mờ** với client: không phân tích nó.
        Nếu gửi `conversation_id` và `confirm_block_id` mà đề nghị đã được thực hiện hoặc đã bị hủy thì trả 409
        `ALREADY_APPLIED` và không cấp token; đề nghị đã quá `expires_at` của khối `confirm` đã lưu thì trả 410
        `OFFER_EXPIRED` ("đề nghị đã hết hạn, hãy hỏi lại"; phase 2 trả 403 `TOKEN_EXPIRED` cho trường hợp này): server ép hạn
        của đề nghị, không chỉ giao diện. `TOKEN_EXPIRED` (403) chỉ còn nghĩa là TOKEN quá 2 phút.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: Token đã cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /confirmations/cancel:
    post:
      tags: [ledger]
      operationId: cancelConfirmation
      summary: Ghi việc người dùng bấm "Không" với một đề nghị
      x-lambda: ledger
      description: |
        Lưu ở server trạng thái `cancelled` của đề nghị (khối `confirm` hoặc `confirm_action` có id `confirm_block_id`
        trong cuộc hội thoại `conversation_id`). Không ghi sổ cái, không cần token. Sau đó `GET /conversations/{id}` trả
        `resolutions` có phần tử `cancelled`, và `POST /confirmations` hoặc `POST /actions` với cùng `confirm_block_id`
        trả 409 `ALREADY_APPLIED` (thông điệp nói đề nghị đã bị hủy). Hủy lại đề nghị đã hủy trả đúng kết quả cũ
        (idempotent). Đề nghị đã thực hiện (`done`) thì không hủy được: 409 `ALREADY_APPLIED`. Đề nghị không có trong
        hội thoại của người gọi (hoặc của người khác): 400 `PARAMS_INVALID`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelConfirmationRequest'
      responses:
        '200':
          description: Đã ghi trạng thái hủy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelConfirmationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /actions:
    post:
      tags: [ledger]
      operationId: applyAction
      summary: Thực hiện thao tác ghi với token xác nhận
      x-lambda: ledger
      description: |
        Kiểm token (chữ ký, hạn, tool, sub, hash tham số, `jti` chưa dùng) rồi ghi trong một
        transaction và ghi `audit_events`. Thiếu `confirm_token` thì không ghi, trả 428
        `NEEDS_CONFIRMATION`. Thành công trả khối `receipt` (chuyển hũ) hoặc `receipt_action`.

        **Bảng `tool` -> việc trên màn hình** (mọi dòng đều theo luồng `POST /confirmations` rồi
        `POST /actions`; `params` được chuẩn hóa ở server, xem contracts/README.md mục "Chuẩn hóa
        tham số"):

        | `tool` | Việc | Agent gọi được |
        |---|---|---|
        | `move_between_jars` | Chuyển tiền giữa hai hũ (kể cả từ hũ Tiền vào khác sang hũ để gán) | có |
        | `record_transaction` | Chi tiêu trên ví mô phỏng bằng tiền hũ hoặc bằng hạn mức Trả sau (mô phỏng); chuyển tiền cho người nhận; nhận tiền vào (lương hoặc tiền vào khác); trả một nghĩa vụ (`obligation_id`) | có |
        | `assign_jar` | Gán hoặc sửa hũ của một giao dịch (Chưa phân loại, Tiền vào khác), tùy chọn nhớ thành luật | có |
        | `update_profile` | Khai và sửa lương, ngày nhận, mức rủi ro, tên; thêm, sửa, xóa MỘT nghĩa vụ mỗi lần. Onboarding tài khoản trắng: lần gọi đầu có lương và ngày nhận (bắt buộc cả hai) tạo hồ sơ, hai hũ hệ thống và hũ mặc định từ `GET /jar-templates` | có |
        | `save_jars` | Tạo, sửa hũ, tỷ lệ chia lương, mục tiêu và hạn (thay cả danh sách hũ của người dùng, tổng tỷ lệ bằng 100) | không (chỉ màn hình) |
        | `confirm_salary` | Xác nhận một chạm lương về: chia vào hũ theo luật, hoặc giữ ở Tiền vào khác; tùy chọn cập nhật lương đã khai | không (chỉ màn hình) |
        | `schedule_nudge` | Đặt (`op` create) hoặc hủy (`op` cancel, nút Hoàn tác) một lời nhắc vào một ngày mô phỏng; ghi bảng `nudges`. Agent gọi qua target `planner` | có |

        **Một đề nghị chỉ được thực hiện một lần.** Khi client gửi `conversation_id` và
        `confirm_block_id` (id của khối `confirm` đang được thực hiện), server lưu khối `receipt`
        gắn với đề nghị đó trong CÙNG transaction với sổ cái; `GET /conversations/{id}` trả lại nó
        (`resolutions`). Đề nghị đã thực hiện rồi thì trả 409 `ALREADY_APPLIED` và không ghi gì, kể
        cả khi token mới hợp lệ. Không gửi hai trường này (gọi REST trực tiếp) thì hành vi như cũ.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: |
            Đã ghi. `move_between_jars` trả khối `receipt` (như phase 1); mọi tool khác trả khối
            `receipt_action`. Phân biệt bằng `type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/NeedsConfirmation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: Các cuộc hội thoại gần đây của người dùng đang đăng nhập
      description: |
        Mỗi cuộc hội thoại là một `session id` của chat (frontend sinh, giữ ổn định theo cuộc hội thoại).
        Sắp theo hoạt động gần nhất trước. Chỉ gồm lượt đã được agent lưu (`ledger___save_turn`).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: limit
          in: query
          required: false
          description: Số cuộc hội thoại tối đa (1 đến 50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Danh sách cuộc hội thoại (rỗng nếu chưa có).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /conversations/{conversation_id}:
    get:
      tags: [conversations]
      operationId: getConversation
      summary: Các lượt của một cuộc hội thoại, để vẽ lại khi tải lại trang
      description: |
        Trả các lượt đã lưu của cuộc hội thoại theo thứ tự cũ tới mới (tối đa 50 lượt gần nhất), mỗi
        lượt kèm câu hỏi, câu trả lời bằng chữ và các khối UI đã phát (nguyên văn, đúng thứ tự phát).
        Cuộc hội thoại không có hoặc không thuộc người gọi: **200 với `turns` rỗng** (không phân biệt hai
        trường hợp để không lộ sự tồn tại của hội thoại người khác). Khối `confirm` được lưu như lúc
        phát; trạng thái của từng khối `confirm` (chưa bấm, đã thực hiện kèm biên nhận, hết hạn) nằm ở
        `resolutions` của lượt, do server giữ (nguồn sự thật, không suy từ số dư).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: Các lượt đã lưu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /overview:
    get:
      tags: [wallet]
      operationId: getOverview
      summary: Mọi thứ Tổng quan cần, trong một lần gọi
      x-lambda: ledger
      description: |
        Một lệnh gọi cho màn Tổng quan (không cần LLM): hồ sơ (kể cả `display_name`), ngày mô phỏng,
        tổng số dư, hũ kèm trạng thái đủ/sát/hụt và ngày cạn lấy từ dự báo mới nhất, hai hũ hệ thống,
        thẻ chủ động (tối đa một), kỳ lương kế, nghĩa vụ sắp đến hạn, hạn mức Trả sau (mô phỏng),
        giao dịch gần đây. Số liệu đọc từ Aurora bằng ba truy vấn (`app_get_overview_extras`,
        `app_list_jars`, `app_get_forecast_summaries`), không tính lại dự báo ở đây.

        **Tổng số dư** `balance.total_vnd` là tổng số dư của MỌI hũ, gồm hũ Tiền vào khác và hũ Chưa
        phân loại (số dư hũ này thường âm: tiền đã chi chưa xếp hũ). Tiền vào khác lương nằm ở hũ
        Tiền vào khác, vẫn tính vào tổng nhưng KHÔNG phải thu nhập.

        **Tài khoản trắng** (chưa khai lương và ngày nhận): `profile.onboarded` là false,
        `jars` rỗng, `next_payday`, `forecast`, `proactive_card` là null; giao diện chuyển sang
        onboarding (`update_profile`).

        **Thẻ chủ động** (`proactive_card`): phase 2 do server chọn bằng luật tất định theo thứ tự ưu
        tiên: lương về chờ xác nhận, hũ hụt có ngày cạn sớm nhất, hũ sát, nghĩa vụ đến hạn trong 3
        ngày, giao dịch cần xem lại, dữ liệu ít (ước lượng ban đầu); không có việc nào thì null.
        `snooze` và `mute_kind` chỉ lưu phía giao diện ở phase 2.

        **Kỳ lương kế** (`next_payday.state`): gọi L là ngày lương gần nhất không sau hôm nay mô
        phỏng. `confirmed` nếu có sự kiện lương đã xác nhận với `period_date` bằng L; `pending_confirmation`
        nếu có sự kiện lương đang chờ (kèm `salary_event_id`); còn lại `expected`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Dữ liệu Tổng quan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile:
    get:
      tags: [wallet]
      operationId: getProfile
      summary: Hồ sơ đã khai (lương, ngày nhận, mức rủi ro)
      x-lambda: ledger
      description: |
        Sửa hồ sơ đi qua `POST /confirmations` và `POST /actions` với `tool` là `update_profile`
        (không có PUT). Tài khoản chưa có hồ sơ nhận `onboarded` false và các trường khai báo vắng.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Hồ sơ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /jars/{jar_code}:
    get:
      tags: [wallet]
      operationId: getJar
      summary: Chi tiết một hũ (kể cả hũ hệ thống)
      x-lambda: ledger
      description: |
        Thông tin hũ, tóm tắt dự báo mới nhất, giao dịch gần đây của hũ (tối đa 10) và nghĩa vụ đang
        hoạt động trả bằng hũ này. Chuỗi 30 ngày lấy ở `GET /forecasts/{jar_code}` (màn Chi tiết hũ gọi
        song song hai endpoint).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/JarCodePath'
      responses:
        '200':
          description: Chi tiết hũ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JarDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /transactions:
    get:
      tags: [wallet]
      operationId: listTransactions
      summary: Danh sách giao dịch (màn Hoạt động), lọc và phân trang con trỏ
      x-lambda: ledger
      description: |
        Mới nhất trước. `next_cursor` là con trỏ mờ (client truyền lại nguyên văn qua `cursor`), vắng ở
        trang cuối. Sổ cái không có dòng sửa số tiền; chuyển hũ và chia lương là các dòng `kind`
        `transfer` cùng `transfer_id`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: jar
          in: query
          required: false
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [expense, income, transfer]
        - name: tx_type
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,39}$'
        - name: from
          in: query
          required: false
          description: Từ ngày mô phỏng (gồm).
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        - name: to
          in: query
          required: false
          description: Đến ngày mô phỏng (gồm).
          schema:
            $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        - name: needs_review
          in: query
          required: false
          description: true chỉ lấy giao dịch cần xem lại.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Số dòng tối đa (1 đến 50). Mặc định 20.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Một trang giao dịch (rỗng nếu không có).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /tx-types:
    get:
      tags: [wallet]
      operationId: listTxTypes
      summary: Loại giao dịch người dùng chọn được khi ghi giao dịch
      x-lambda: ledger
      description: Đọc bảng tra `tx_type_map` (chỉ các loại `is_selectable`). Giao diện không gắn cứng danh sách này.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách loại giao dịch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxTypesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /payees:
    get:
      tags: [wallet]
      operationId: listPayees
      summary: Người nhận đã lưu của ví mô phỏng
      x-lambda: ledger
      description: Màn chọn người nhận (T1). Yêu thích trước, rồi dùng gần nhất. Không bao giờ có số tài khoản đầy đủ.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách người nhận (tối đa 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayeesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /obligations:
    get:
      tags: [wallet]
      operationId: listObligations
      summary: Nghĩa vụ đã khai hoặc tự sinh
      x-lambda: ledger
      description: |
        Thêm, sửa, xóa nghĩa vụ đi qua `POST /confirmations` và `POST /actions` với `tool`
        `update_profile` (trường `obligation`). Khoản trả sau không khai được: tự sinh khi mua bằng hạn mức.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: status
          in: query
          required: false
          description: Mặc định active.
          schema:
            type: string
            enum: [active, paid, cancelled, all]
        - name: within_days
          in: query
          required: false
          description: Chỉ lấy khoản đến hạn trong N ngày tới tính từ hôm nay mô phỏng.
          schema:
            type: integer
            minimum: 0
            maximum: 400
      responses:
        '200':
          description: Danh sách nghĩa vụ theo ngày đến hạn tăng dần (tối đa 100).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObligationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /credit-line:
    get:
      tags: [wallet]
      operationId: getCreditLine
      summary: Hạn mức Trả sau (mô phỏng) và biểu phí có nguồn
      x-lambda: ledger
      description: |
        Hạn mức, dư nợ gốc còn lại và biểu phí đang hiệu lực (đọc bảng `fee_schedules`, kèm tên nguồn và
        đường dẫn để giao diện ghi rõ). Người dùng chưa có hạn mức nhận `credit_line` null.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Hạn mức và biểu phí.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLineResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /salary-events:
    get:
      tags: [wallet]
      operationId: listSalaryEvents
      summary: Lương về chờ xác nhận (hoặc đã xử lý)
      x-lambda: ledger
      description: |
        Bước "xác nhận lương về": khi tiền vào được nhận diện là lương, một sự kiện `pending` được sinh. Người dùng
        xác nhận một chạm bằng `tool` `confirm_salary`. `ask_update_salary` đúng khi số nhận lệch nhiều so
        với lương đã khai (ngưỡng ở cấu hình): giao diện hỏi có cập nhật lương không và gửi
        `update_declared_salary` trong `params`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - name: status
          in: query
          required: false
          description: Mặc định pending.
          schema:
            type: string
            enum: [pending, confirmed, kept_other, all]
      responses:
        '200':
          description: Danh sách sự kiện lương (tối đa 20).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /jar-templates:
    get:
      tags: [wallet]
      operationId: listJarTemplates
      summary: Gợi ý hũ cho onboarding
      x-lambda: ledger
      description: |
        Đọc bảng `jar_templates` (seed ở `db/seed/jar_templates.sql`). Giao diện onboarding hiện các hũ này kèm
        tỷ lệ gợi ý để người dùng sửa; không gắn cứng. Người dùng chỉ khai lương và ngày nhận thì server tự dùng các
        hũ `is_default` này khi tạo hồ sơ.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Danh sách hũ gợi ý.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JarTemplatesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /forecasts/{jar_code}:
    get:
      tags: [forecast]
      operationId: getForecast
      summary: Dự báo 30 ngày của một hũ (khối forecast_timeline)
      x-lambda: forecast
      description: |
        Trả đúng khối `forecast_timeline`, cùng một khối và cùng số với tool `forecast___get_forecast` trong chat.
        Số liệu đọc từ bảng `forecasts` (lần chạy mới nhất có chứa hũ). Quá hạn độ tươi (cấu hình) hoặc ngày mô
        phỏng đã sang ngày khác so với `origin_date` thì tính lại trước khi trả; không tính lại được thì trả
        bản cũ với `stale` true; chưa có bản nào và không tính được thì 503 `FORECAST_UNAVAILABLE`. Hũ HỆ THỐNG (Tiền vào khác,
        Chưa phân loại) không có dự báo: 404 `FORECAST_NOT_APPLICABLE` (phase 2 trả 503; từ phase 3 503 chỉ còn nghĩa là lỗi tạm thời).

        Hiển thị: `p_shortfall` có thì hiện kèm `confidence_band`; vắng thì chỉ hiện `confidence_band` (Cao, Vừa,
        Thấp); `is_initial_estimate` thì ghi "ước lượng ban đầu".
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/JarCodePath'
      responses:
        '200':
          description: Khối dự báo của hũ.
          content:
            application/json:
              schema:
                $ref: '../blocks/forecast_timeline.schema.json'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /affordability:
    post:
      tags: [affordability]
      operationId: checkAffordability
      summary: Kiểm tra trước khi quẹt (thẻ đủ, sát, hụt)
      x-lambda: forecast
      description: |
        Dùng cho màn chuyển tiền (T3a, T3b, T3c), KHÔNG qua LLM và không ghi gì. Chạy đúng engine của tool
        `forecast___affordability_check` nên trả CÙNG khối `affordability_card` và cùng số với chat. Nguồn là hũ: đủ, sát (cạn
        sớm N ngày) hay hụt (M đồng trước kỳ lương), kiểm từng hũ chi tiêu khi không chỉ định `jar`. Nguồn Trả sau (mô phỏng):
        chi phí của món này (`credit.cost.item_cost_vnd`, gồm phần phí phát sinh thêm) TÁCH khỏi tổng phải trả ngày đến hạn
        (`credit.cost.total_due_vnd`, cộng dồn nghĩa vụ đã có), hũ nào hụt khi đến hạn, tỷ lệ nghĩa vụ trên thu nhập so với
        ngưỡng của luật. Kèm phương án tất định (hoãn, đổi hũ, chia nhỏ, trả ngay). Không có `funding_source` thì xét cả hai
        nguồn. Ngưỡng đủ, sát, hụt nằm trong cấu hình. Mục tiêu độ trễ: p95 dưới 2 giây.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffordabilityRequest'
      responses:
        '200':
          description: Khối `affordability_card`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffordabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /traces/{trace_id}:
    get:
      tags: [audit]
      operationId: getTrace
      summary: Bản ghi một lượt trả lời cho bảng "Vì sao"
      x-lambda: ledger
      description: |
        Dữ liệu cho bảng "Vì sao" (H4): khối `explain` (dữ liệu đã dùng, luật đã kiểm, nhóm tin cậy Cao/Vừa/Thấp kèm lý do) cộng
        chi tiết kỹ thuật (ý định, khối đã phát, token, thời lượng từng bước). Chỉ của CHÍNH người dùng: trace của người khác
        và trace không tồn tại đều trả 404 `TRACE_NOT_FOUND` như nhau (không lộ sự tồn tại; RLS lọc theo `sub`). Không cần model.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/TraceIdPath'
      responses:
        '200':
          description: Bản ghi lượt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /feedback:
    post:
      tags: [audit]
      operationId: submitFeedback
      summary: Ghi người dùng chấp nhận hoặc từ chối một phương án
      x-lambda: ledger
      description: |
        Ghi một dòng vào bảng `feedback` (không đụng tiền, không đổi số dư), nên KHÔNG đi qua token xác nhận. Idempotent theo
        (`trace_id`, `block_id`, `option_id`): gửi lại thì cập nhật quyết định và lý do (người dùng đổi ý), trả 200. `trace_id` và
        `scenario_id` phải thuộc người gọi, nếu không 404 `TRACE_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Đã ghi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      summary: Đặt lại dữ liệu của chính người dùng về trạng thái ban đầu
      description: |
        Xóa dữ liệu của người gọi (hũ, giao dịch, khối đã lưu), sinh lại persona tất định theo seed,
        đặt `clock_offset_days` để ngày mô phỏng quay về ngày neo (ADR-0003). `audit_events` chỉ
        thêm, không xóa. Không có thân yêu cầu.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Đã đặt lại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token Cognito (không phải ID token), gửi trong header Authorization: Bearer <token>.'
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context. Nếu có, trace-id của nó là `trace_id` của khối; nếu không server sinh.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    JarCodePath:
      name: jar_code
      in: path
      required: true
      description: Mã hũ (khóa của hũ trong một người dùng).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
    TraceIdPath:
      name: trace_id
      in: path
      required: true
      description: Mã trace của câu trả lời cần giải thích (từ `trace_id` của khối).
      schema:
        $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
  schemas:
    ErrorCode:
      type: string
      description: Mã lỗi máy đọc được; khớp yofina_core.errors.ErrorCode.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - PARAMS_INVALID
        - JAR_NOT_FOUND
        - INSUFFICIENT_FUNDS
        - AMOUNT_LIMIT_EXCEEDED
        - NEEDS_CONFIRMATION
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TOKEN_REUSED
        - PARAMS_MISMATCH
        - ALREADY_APPLIED
        - RATE_LIMITED
        - MODEL_BUDGET_EXCEEDED
        - DATABASE_UNAVAILABLE
        - INTERNAL_ERROR
        - PROFILE_INCOMPLETE
        - TRANSACTION_NOT_FOUND
        - OBLIGATION_NOT_FOUND
        - PAYEE_NOT_FOUND
        - SALARY_EVENT_NOT_FOUND
        - JAR_PROTECTED
        - CREDIT_LIMIT_EXCEEDED
        - DUPLICATE_TRANSACTION
        - FORECAST_UNAVAILABLE
        - OFFER_EXPIRED
        - TRACE_NOT_FOUND
        - NUDGE_NOT_FOUND
        - FEE_SCHEDULE_NOT_FOUND
        - FORECAST_NOT_APPLICABLE
        - SCENARIO_INVALID
      x-http-status:
        UNAUTHENTICATED: 401
        FORBIDDEN: 403
        PARAMS_INVALID: 400
        JAR_NOT_FOUND: 404
        INSUFFICIENT_FUNDS: 422
        AMOUNT_LIMIT_EXCEEDED: 422
        NEEDS_CONFIRMATION: 428
        TOKEN_INVALID: 403
        TOKEN_EXPIRED: 403
        TOKEN_REUSED: 409
        PARAMS_MISMATCH: 409
        ALREADY_APPLIED: 409
        RATE_LIMITED: 429
        MODEL_BUDGET_EXCEEDED: 503
        DATABASE_UNAVAILABLE: 503
        INTERNAL_ERROR: 500
        PROFILE_INCOMPLETE: 422
        TRANSACTION_NOT_FOUND: 404
        OBLIGATION_NOT_FOUND: 404
        PAYEE_NOT_FOUND: 404
        SALARY_EVENT_NOT_FOUND: 404
        JAR_PROTECTED: 422
        CREDIT_LIMIT_EXCEEDED: 422
        DUPLICATE_TRANSACTION: 409
        FORECAST_UNAVAILABLE: 503
        OFFER_EXPIRED: 410
        TRACE_NOT_FOUND: 404
        NUDGE_NOT_FOUND: 404
        FEE_SCHEDULE_NOT_FOUND: 404
        FORECAST_NOT_APPLICABLE: 404
        SCENARIO_INVALID: 422
      x-meaning:
        UNAUTHENTICATED: Thiếu hoặc sai access token.
        FORBIDDEN: Không được phép (token xác nhận không thuộc người dùng này, v.v.).
        PARAMS_INVALID: Tham số sai định dạng hoặc vô lý (cùng hũ, số tiền không dương...).
        JAR_NOT_FOUND: Mã hũ không tồn tại với người dùng này.
        INSUFFICIENT_FUNDS: Hũ nguồn không đủ số dư.
        AMOUNT_LIMIT_EXCEEDED: Vượt hạn mức số tiền một lần (cấu hình, cùng giá trị với luật Cedar).
        NEEDS_CONFIRMATION: Thao tác ghi cần xác nhận; chưa ghi gì.
        TOKEN_INVALID: Token sai định dạng, chữ ký sai, cho tool khác hoặc cho người dùng khác.
        TOKEN_EXPIRED: Token đã hết hạn (quá 2 phút kể từ lúc cấp).
        TOKEN_REUSED: Token đã được dùng (replay).
        PARAMS_MISMATCH: Tham số khác với tham số đã được xác nhận (hash không khớp), hoặc `confirm_block_id` không thuộc thao tác này.
        ALREADY_APPLIED: Đề nghị (`confirm_block_id`) này đã được thực hiện rồi; không ghi thêm gì, kể cả khi có token mới hợp lệ.
        RATE_LIMITED: Quá giới hạn tần suất.
        MODEL_BUDGET_EXCEEDED: Chạm trần lượt gọi model trong ngày (agent, không phải REST).
        DATABASE_UNAVAILABLE: Aurora đang thức dậy hoặc không sẵn sàng; thử lại sau vài giây.
        INTERNAL_ERROR: Lỗi không lường trước; xem log theo trace_id.
        PROFILE_INCOMPLETE: Chưa khai lương và ngày nhận lương nên chưa làm được việc này (ví dụ dự báo).
        TRANSACTION_NOT_FOUND: Mã giao dịch không tồn tại với người dùng này.
        OBLIGATION_NOT_FOUND: Mã nghĩa vụ không tồn tại với người dùng này.
        PAYEE_NOT_FOUND: Mã người nhận không tồn tại với người dùng này.
        SALARY_EVENT_NOT_FOUND: Mã sự kiện lương không tồn tại với người dùng này.
        JAR_PROTECTED: Hũ hệ thống hoặc hũ còn tiền hay còn nghĩa vụ nên không sửa hoặc bỏ được.
        CREDIT_LIMIT_EXCEEDED: Vượt hạn mức Trả sau (mô phỏng) còn lại.
        DUPLICATE_TRANSACTION: Giao dịch trùng khóa khử trùng (cùng ngày, số tiền, đối tác, mã tham chiếu) với giao dịch đã có.
        FORECAST_UNAVAILABLE: Chưa có dự báo cho hũ này và chưa tính được ngay; thử lại sau ít phút.
        OFFER_EXPIRED: Đề nghị (khối confirm hoặc confirm_action) đã quá `expires_at`; hãy hỏi lại. Khác TOKEN_EXPIRED (token quá 2 phút).
        TRACE_NOT_FOUND: Không có trace này với người dùng (không tồn tại hoặc của người khác; không phân biệt).
        NUDGE_NOT_FOUND: Mã lời nhắc không tồn tại với người dùng này (hủy lời nhắc đã hủy hoặc đã gửi).
        FEE_SCHEDULE_NOT_FOUND: Không có biểu phí cho loại phí hoặc sản phẩm này.
        FORECAST_NOT_APPLICABLE: Hũ hệ thống (Tiền vào khác, Chưa phân loại) không có dự báo.
        SCENARIO_INVALID: Kịch bản đúng dạng nhưng vô lý (ngày đã qua, hũ sai loại, vượt khoảng dự báo).
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Câu tiếng Việt hiển thị được cho người dùng, không chứa dữ liệu nhạy cảm.
              minLength: 1
              maxLength: 280
            trace_id:
              $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
    Profile:
      description: |
        Hồ sơ đã khai. `onboarded` đúng khi đã có cả lương và ngày nhận (hai thứ bắt buộc duy nhất).
        `display_name` luôn có: lấy từ hồ sơ, tài khoản chưa có hồ sơ thì server dùng claim `name`
        hoặc `cognito:username` của JWT (không dùng email).
      type: object
      required: [display_name, onboarded]
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        onboarded:
          type: boolean
    ProfileResponse:
      type: object
      required: [app_date, as_of, profile]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        profile:
          $ref: '#/components/schemas/Profile'
    JarKind:
      description: spending (chi tiêu), saving (tiết kiệm), obligation (nghĩa vụ), system (hũ hệ thống Tiền vào khác và Chưa phân loại).
      type: string
      enum: [spending, saving, obligation, system]
    JarFull:
      description: |
        Một hũ, đủ để vẽ thẻ hũ trên Tổng quan và Danh sách hũ. `balance_vnd` có dấu: chỉ hũ hệ thống
        Chưa phân loại mới âm. Các trường dự báo (`status`, `runout_date`, `p_shortfall`, `confidence_band`) lấy từ
        lần chạy dự báo mới nhất có chứa hũ; vắng nếu hũ chưa có dự báo (hũ hệ thống không có dự báo).
        `p_shortfall` chỉ có khi đủ tin cậy (xem khối `forecast_timeline`).
      type: object
      required: [code, name, color_key, icon_key, kind, balance_vnd, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          $ref: '#/components/schemas/JarKind'
        system_role:
          type: string
          enum: [other_income, unclassified]
        balance_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        status:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/JarStatus'
        runout_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        p_shortfall:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        forecast_floor_vnd:
          description: |
            Số dư dự báo (P50) THẤP NHẤT từ ngày dự báo đầu tiên tới trước kỳ lương của lần chạy mới nhất có chứa hũ, để vẽ vạch
            "mực dự báo" trên thẻ hũ. Có dấu (âm là hụt). Vắng khi hũ chưa có dự báo. Server tính từ bảng `forecasts` (hàm
            `app_get_forecast_summaries`, migration 0008); pipeline dự báo không ghi thêm gì.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    OverviewBalance:
      type: object
      required: [total_vnd, jars_total_vnd, other_income_vnd, unclassified_vnd]
      additionalProperties: false
      properties:
        total_vnd:
          description: Tổng số dư của mọi hũ, gồm Tiền vào khác và Chưa phân loại (= jars_total_vnd + other_income_vnd + unclassified_vnd).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        jars_total_vnd:
          description: Tổng số dư các hũ người dùng (không gồm hũ hệ thống).
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
        other_income_vnd:
          description: Số dư hũ Tiền vào khác. Không phải thu nhập.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        unclassified_vnd:
          description: Số dư hũ Chưa phân loại (có dấu, thường âm). Giao diện ghi "đã chi, chưa xếp hũ" theo giá trị tuyệt đối khi âm.
          $ref: '../blocks/envelope.schema.json#/$defs/VndSigned'
    NextPayday:
      type: object
      required: [date, days_until, state]
      additionalProperties: false
      properties:
        date:
          description: Ngày lương kế tiếp (sau hôm nay mô phỏng), theo ngày lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        days_until:
          type: integer
          minimum: 1
          maximum: 400
        expected_vnd:
          description: Lương đã khai.
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        state:
          description: expected (chưa về), pending_confirmation (đã nhận, chờ xác nhận chia), confirmed (kỳ lương hiện tại đã xác nhận).
          type: string
          enum: [expected, pending_confirmation, confirmed]
        salary_event_id:
          description: Có khi state là pending_confirmation.
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
    ForecastMeta:
      description: Chất lượng của lần chạy dự báo mới nhất, để hiện dải "độ phủ dữ liệu", "ước lượng ban đầu", "số liệu cũ".
      type: object
      required: [computed_at, run_app_date, stale, is_initial_estimate, confidence_band, history_days, model]
      additionalProperties: false
      properties:
        computed_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        run_app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        stale:
          description: Quá hạn độ tươi hoặc ngày mô phỏng đã sang ngày khác so với run_app_date. Tổng quan không tự tính lại; bấm vào hũ (GET /forecasts/{jar_code}) sẽ tính lại.
          type: boolean
        is_initial_estimate:
          type: boolean
        confidence_band:
          $ref: '../blocks/forecast_timeline.schema.json#/$defs/ConfidenceBand'
        coverage:
          $ref: '../blocks/envelope.schema.json#/$defs/Ratio'
        history_days:
          type: integer
          minimum: 0
        model:
          type: string
          minLength: 1
          maxLength: 40
    OverviewResponse:
      type: object
      required:
        - app_date
        - as_of
        - profile
        - balance
        - jars
        - system_jars
        - next_payday
        - forecast
        - proactive_card
        - credit_line
        - obligations_due
        - recent_transactions
        - needs_review_count
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        profile:
          $ref: '#/components/schemas/Profile'
        balance:
          $ref: '#/components/schemas/OverviewBalance'
        jars:
          description: Hũ người dùng (không gồm hũ hệ thống), theo thứ tự hiển thị. Rỗng với tài khoản trắng.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarFull'
        system_jars:
          description: Hai hũ hệ thống Tiền vào khác và Chưa phân loại (rỗng nếu chưa tạo).
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/JarFull'
        next_payday:
          description: Null nếu chưa khai ngày nhận lương.
          oneOf:
            - $ref: '#/components/schemas/NextPayday'
            - type: 'null'
        forecast:
          description: Null nếu chưa có lần chạy dự báo nào.
          oneOf:
            - $ref: '#/components/schemas/ForecastMeta'
            - type: 'null'
        proactive_card:
          description: Một việc cần chú ý, hoặc null nếu không có.
          oneOf:
            - $ref: '../blocks/proactive_card.schema.json'
            - type: 'null'
        credit_line:
          oneOf:
            - $ref: '../tools/ledger.results.schema.json#/$defs/CreditLine'
            - type: 'null'
        obligations_due:
          description: Nghĩa vụ đang hoạt động đến hạn trong 30 ngày tới, gần nhất trước (tối đa 5).
          type: array
          maxItems: 5
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
        recent_transactions:
          description: 5 giao dịch gần nhất (không gồm dòng chuyển hũ).
          type: array
          maxItems: 5
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        needs_review_count:
          description: Số giao dịch cần xem lại hoặc đang ở Chưa phân loại.
          type: integer
          minimum: 0
    JarDetailResponse:
      type: object
      required: [app_date, as_of, jar, forecast, recent_transactions, obligations]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        jar:
          $ref: '#/components/schemas/JarFull'
        forecast:
          description: Null nếu hũ chưa có dự báo.
          oneOf:
            - $ref: '#/components/schemas/ForecastMeta'
            - type: 'null'
        recent_transactions:
          type: array
          maxItems: 10
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        obligations:
          description: Nghĩa vụ đang hoạt động có hũ trả là hũ này.
          type: array
          maxItems: 10
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
    TransactionsResponse:
      type: object
      required: [app_date, as_of, transactions]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        transactions:
          type: array
          maxItems: 50
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Transaction'
        next_cursor:
          description: Vắng ở trang cuối.
          type: string
          minLength: 1
          maxLength: 200
    TxType:
      type: object
      required: [tx_type, label, direction]
      additionalProperties: false
      properties:
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        label:
          type: string
          minLength: 1
          maxLength: 60
        direction:
          description: out (chi), in (tiền vào).
          type: string
          enum: [out, in]
        is_person_transfer:
          description: |
            Đúng với loại "chuyển tiền cho người khác" (`transfer_person`): màn chọn người nhận dùng cờ này, không đoán theo tên.
            Cờ ở bảng tra `tx_type_map.is_person_transfer` (migration 0008). Server luôn gửi.
          type: boolean
        default_jar:
          description: Hũ chuẩn của loại này (bước 0 của phân loại), nếu người dùng có hũ đó.
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        system_role:
          type: string
          enum: [other_income, unclassified]
    TxTypesResponse:
      type: object
      required: [tx_types]
      additionalProperties: false
      properties:
        tx_types:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/TxType'
    PayeesResponse:
      type: object
      required: [payees]
      additionalProperties: false
      properties:
        payees:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Payee'
    ObligationsResponse:
      type: object
      required: [app_date, obligations, total_due_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        obligations:
          type: array
          maxItems: 100
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/Obligation'
        total_due_vnd:
          description: Tổng amount_vnd của các khoản active trong danh sách.
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    FeeLine:
      description: Một dòng của biểu phí có cấu trúc (bảng fee_schedules), đang hiệu lực tại ngày mô phỏng.
      type: object
      required: [fee_type, period, condition_code, source_name, source_url, effective_from]
      additionalProperties: false
      properties:
        fee_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        rate_percent:
          type: number
          minimum: 0
        period:
          type: string
          enum: [per_month, per_transaction, once]
        condition_code:
          type: string
          enum: [always, month_has_transaction, overdue]
        condition_note:
          type: string
          maxLength: 200
        source_name:
          type: string
          maxLength: 200
        source_url:
          type: string
          pattern: '^https://'
        effective_from:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    CreditLineResponse:
      type: object
      required: [app_date, credit_line, fees]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        credit_line:
          oneOf:
            - $ref: '../tools/ledger.results.schema.json#/$defs/CreditLine'
            - type: 'null'
        fees:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/FeeLine'
    SalaryEventsResponse:
      type: object
      required: [salary_events]
      additionalProperties: false
      properties:
        salary_events:
          type: array
          maxItems: 20
          items:
            $ref: '../tools/ledger.results.schema.json#/$defs/SalaryEvent'
    JarTemplate:
      type: object
      required: [code, name, color_key, icon_key, kind, default_split_percent, is_default]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        default_split_percent:
          type: number
          minimum: 0
          maximum: 100
        is_default:
          type: boolean
    JarTemplatesResponse:
      type: object
      required: [templates]
      additionalProperties: false
      properties:
        templates:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarTemplate'
    RecordTransactionParams:
      description: |
        Tham số của `record_transaction`. Chuẩn hóa ở server (contracts/README.md): điền `tx_type`
        mặc định (`other_expense` hoặc `income_other`), `funding` mặc định `jar`; nếu thiếu `jar` thì
        suy từ `tx_type` qua bảng tra, không suy được thì hũ Chưa phân loại; tiền vào luôn có `jar` là hũ
        Tiền vào khác. Bản chuẩn hóa mới là thứ được ký.
      type: object
      required: [kind, amount_vnd]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [expense, income]
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        tx_type:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,39}$'
        funding:
          description: jar (mặc định) hoặc credit (hạn mức Trả sau mô phỏng; chỉ với chi tiêu).
          type: string
          enum: [jar, credit]
        payee_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        counterparty:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: string
          minLength: 1
          maxLength: 200
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        client_ref:
          description: Mã chống ghi trùng khi gửi lại; vào `dedupe_key` của sổ cái.
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]+$'
    AssignJarParams:
      type: object
      required: [transaction_id, jar]
      additionalProperties: false
      properties:
        transaction_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        remember:
          description: once (mặc định) hoặc always (lưu luật `category_rules` cho người nhận hoặc đối tác).
          type: string
          enum: [once, always]
    ObligationChange:
      description: |
        Một thay đổi nghĩa vụ trong `update_profile`. `upsert` không có `obligation_id` là thêm mới và
        cần `kind`, `name` và số tiền (`amount_vnd`, hoặc cặp `amount_min_vnd` + `amount_max_vnd` khi đó
        `amount_vnd` là trung điểm làm tròn xuống); có `obligation_id` là sửa. `delete` cần `obligation_id`
        (đặt trạng thái cancelled). Khoản trả sau (`bnpl`) không khai được.

        **`due_day` hay `due_date`**: `due_day` (1 đến 31) là NGÀY TRONG THÁNG của khoản lặp (`monthly`, và cũng dùng cho `yearly`
        khi cần): kẹp ngày cuối tháng, giữ nguyên qua các kỳ. `due_date` là NGÀY ĐẾN HẠN CỤ THỂ kế tiếp. Khoản `once` bắt buộc
        `due_date`. Khoản `monthly` chỉ cần một trong hai: có `due_day` thì server suy `due_date` (ngày đó sớm nhất không trước
        hôm nay mô phỏng); có `due_date` mà không `due_day` thì `due_day` lấy theo ngày của `due_date`. Khoản `weekly` cần
        `due_date` (kỳ sau cộng 7 ngày; `due_day` không dùng). Khi sửa (`obligation_id`) không điền mặc định nào.
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [upsert, delete]
        obligation_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        kind:
          type: string
          enum: [loan, rent, bill, subscription]
        name:
          type: string
          minLength: 1
          maxLength: 80
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_min_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        amount_max_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        fee_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
        due_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        due_day:
          type: integer
          minimum: 1
          maximum: 31
        cycle:
          type: string
          enum: [once, weekly, monthly, yearly]
        pay_jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        is_essential:
          type: boolean
    UpdateProfileParams:
      description: |
        Phải có ít nhất một trường. Tài khoản chưa có hồ sơ (onboarding): lần gọi đầu phải có cả
        `monthly_salary_vnd` và `payday_day`; server tạo hồ sơ, hai hũ hệ thống và (nếu chưa có hũ nào)
        các hũ `is_default` của `jar_templates` với tỷ lệ mặc định. Dự báo được tính lại sau khi ghi.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        monthly_salary_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        payday_day:
          type: integer
          minimum: 1
          maximum: 31
        risk_tolerance:
          type: string
          enum: [low, medium, high]
        obligation:
          $ref: '#/components/schemas/ObligationChange'
    JarSpec:
      description: |
        Một hũ trong `save_jars`. Có `code` là sửa hũ đó; không có là tạo hũ mới (server sinh `code` từ
        `name`). `color_key` và `icon_key` là khóa giao diện ánh xạ (xem `GET /jar-templates`).
      type: object
      required: [name, color_key, icon_key, kind, split_percent]
      additionalProperties: false
      properties:
        code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        name:
          type: string
          minLength: 1
          maxLength: 40
        color_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        icon_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        kind:
          type: string
          enum: [spending, saving, obligation]
        split_percent:
          type: number
          minimum: 0
          maximum: 100
        goal_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        goal_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    SaveJarsParams:
      description: |
        Thay cả danh sách hũ người dùng (không gồm hũ hệ thống) theo thứ tự trong mảng (thứ tự hiển thị).
        Tổng `split_percent` phải bằng 100. Hũ đang có mà không có trong danh sách chỉ bị bỏ khi số dư
        bằng 0 và không còn nghĩa vụ trả bằng hũ đó, nếu không trả 422 `JAR_PROTECTED`.
      type: object
      required: [jars]
      additionalProperties: false
      properties:
        jars:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/JarSpec'
    ConfirmSalaryParams:
      description: |
        split: chia số tiền lương vào hũ theo `split_percent` (làm tròn xuống từng hũ, phần dư vào hũ có tỷ lệ
        lớn nhất, hòa thì hũ đứng trước). keep_as_other: giữ ở Tiền vào khác (không phải lương). `update_declared_salary`
        chỉ có nghĩa khi `decision` là split: đặt lương đã khai bằng số vừa nhận.
      type: object
      required: [salary_event_id, decision]
      additionalProperties: false
      properties:
        salary_event_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [split, keep_as_other]
        update_declared_salary:
          type: boolean
    ActionResponse:
      description: Biên nhận của `POST /actions`, phân biệt bằng `type`.
      oneOf:
        - $ref: '../blocks/receipt.schema.json'
        - $ref: '../blocks/receipt_action.schema.json'
    JarsResponse:
      type: object
      required: [app_date, as_of, jars, jars_total_vnd]
      additionalProperties: false
      properties:
        app_date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        as_of:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        jars:
          type: array
          maxItems: 20
          items:
            $ref: '../blocks/jar_summary.schema.json#/$defs/JarBalance'
        jars_total_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/Vnd'
    ConversationSummary:
      type: object
      required: [conversation_id, turns, last_activity_at, preview]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: integer
          minimum: 1
          description: Số lượt đã lưu.
        last_activity_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        preview:
          type: string
          maxLength: 120
          description: Câu hỏi đầu tiên của cuộc hội thoại, cắt tối đa 120 ký tự.
    ConversationListResponse:
      type: object
      required: [conversations]
      additionalProperties: false
      properties:
        conversations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationSummary'
    ConversationTurn:
      type: object
      required: [trace_id, created_at, user_text, assistant_text, blocks, resolutions]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        created_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        user_text:
          type: string
          maxLength: 4000
        assistant_text:
          type: string
          maxLength: 8000
          description: Câu trả lời bằng chữ agent đã phát (có thể rỗng nếu lượt chỉ có khối).
        blocks:
          type: array
          maxItems: 20
          description: Khối UI đã phát ở lượt, theo thứ tự phát (`seq`).
          items:
            $ref: '../blocks/block.schema.json'
        resolutions:
          type: array
          maxItems: 20
          description: Trạng thái của từng khối `confirm` trong `blocks`, cùng thứ tự (một phần tử mỗi khối).
          items:
            $ref: '#/components/schemas/ConfirmResolution'
    ConversationResponse:
      type: object
      required: [conversation_id, turns]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          minLength: 1
          maxLength: 256
        turns:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ConversationTurn'
    ConfirmConversationId:
      description: |
        Id cuộc hội thoại chứa khối `confirm` (session id của chat). Gửi cùng `confirm_block_id`
        hoặc không gửi cả hai.
      type: string
      minLength: 1
      maxLength: 256
    ConfirmBlockRef:
      description: |
        `id` của khối `confirm` đang được thực hiện, dạng `confirm:{trace_id}:{params_hash[:12]}`.
        12 ký tự cuối phải khớp hash của `params` đang gửi, nếu không trả PARAMS_MISMATCH. Một
        `confirm_block_id` của một người dùng chỉ được thực hiện một lần (ALREADY_APPLIED).
      type: string
      maxLength: 128
      pattern: '^confirm:[A-Za-z0-9_-]{1,64}:[0-9a-f]{12}$'
    ConfirmResolution:
      description: |
        Trạng thái một khối `confirm` hoặc `confirm_action` trong lượt, do server giữ. `done`: đã thực hiện,
        kèm `receipt` (đúng khối `POST /actions` đã trả) và `resolved_at`; thắng mọi trạng thái khác. `cancelled`:
        người dùng đã bấm "Không" (`POST /confirmations/cancel`), kèm `resolved_at`, không có `receipt`; cũng thắng
        `expired`. `expired`: chưa xử lý và đã quá `expires_at` của đề nghị lúc đọc. `pending`: còn hạn, chưa xử lý.
      oneOf:
        - type: object
          required: [block_id, status, resolved_at, receipt]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: done
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
            receipt:
              $ref: '#/components/schemas/ActionResponse'
        - type: object
          required: [block_id, status, resolved_at]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              const: cancelled
            resolved_at:
              $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        - type: object
          required: [block_id, status]
          additionalProperties: false
          properties:
            block_id:
              $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
            status:
              enum: [pending, expired]
    CancelConfirmationRequest:
      type: object
      required: [conversation_id, confirm_block_id]
      additionalProperties: false
      properties:
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
    CancelConfirmationResponse:
      type: object
      required: [block_id, status, resolved_at]
      additionalProperties: false
      properties:
        block_id:
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        status:
          const: cancelled
        resolved_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
    ToolName:
      type: string
      description: |
        Tên tool ghi (ngắn, không có tiền tố target). Mỗi giá trị có schema `params` riêng, xem `allOf` của
        `ConfirmationRequest` và `ActionRequest` và bảng ở mô tả của `POST /actions`.
      enum: [move_between_jars, record_transaction, assign_jar, update_profile, save_jars, confirm_salary, schedule_nudge]
    ParamsByTool:
      description: |
        Ràng buộc `params` theo `tool` (dùng chung cho `ConfirmationRequest` và `ActionRequest`). `params` chưa chuẩn hóa
        cũng được nhận (server chuẩn hóa lại và chỉ ký bản chuẩn hóa); trường lạ và `user_id` bị từ chối.
      allOf:
        - if:
            properties:
              tool:
                const: move_between_jars
          then:
            properties:
              params:
                $ref: '../blocks/confirm.schema.json#/$defs/MoveParams'
        - if:
            properties:
              tool:
                const: record_transaction
          then:
            properties:
              params:
                $ref: '#/components/schemas/RecordTransactionParams'
        - if:
            properties:
              tool:
                const: assign_jar
          then:
            properties:
              params:
                $ref: '#/components/schemas/AssignJarParams'
        - if:
            properties:
              tool:
                const: update_profile
          then:
            properties:
              params:
                $ref: '#/components/schemas/UpdateProfileParams'
        - if:
            properties:
              tool:
                const: save_jars
          then:
            properties:
              params:
                $ref: '#/components/schemas/SaveJarsParams'
        - if:
            properties:
              tool:
                const: confirm_salary
          then:
            properties:
              params:
                $ref: '#/components/schemas/ConfirmSalaryParams'
        - if:
            properties:
              tool:
                const: schedule_nudge
          then:
            properties:
              params:
                $ref: '#/components/schemas/ScheduleNudgeParams'
    ConfirmationRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: |
            Sao nguyên từ khối `confirm` hoặc `confirm_action` (đã chuẩn hóa), hoặc do màn hình tự dựng. Schema
            theo `tool` ở `ParamsByTool`.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        params_hash:
          description: |
            `params_hash` của khối `confirm` hoặc `confirm_action` người dùng đang nhìn. Nếu gửi, server so với hash
            tự tính từ `tool` và `params`; lệch thì trả PARAMS_MISMATCH. Màn hình không có khối thì bỏ trường này.
          type: string
          pattern: '^[0-9a-f]{64}$'
    ConfirmationResponse:
      type: object
      required: [confirm_token, expires_at, ttl_seconds, tool, params, params_hash]
      additionalProperties: false
      properties:
        confirm_token:
          type: string
          description: Token mờ, dùng một lần, gắn với người dùng, tool và tham số.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          minLength: 3
          maxLength: 1024
        expires_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        ttl_seconds:
          type: integer
          minimum: 1
          description: Thời gian sống của token, từ cấu hình; frontend đếm ngược theo đây.
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: Bản tham số đã chuẩn hóa mà token đã ký.
          type: object
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        preview:
          description: |
            Bản XEM TRƯỚC do SERVER tính (không ghi gì), cùng hình dạng `changes` và `warnings` của khối `confirm_action`, để
            màn "Xem lại" không tự tính gì: số dư trước và sau của từng hũ, với Trả sau (mô phỏng) thì khoản phải trả ngày
            đến hạn (đã gồm phí lấy từ `fee_schedules`) và hạn mức còn lại, với lương thì phần chia vào từng hũ. Luôn có
            ở phase 2; `warnings` vắng khi không có.
          type: object
          required: [summary, changes]
          additionalProperties: false
          properties:
            summary:
              type: string
              minLength: 1
              maxLength: 120
            changes:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '../blocks/confirm_action.schema.json#/$defs/ActionChange'
            warnings:
              type: array
              maxItems: 5
              items:
                type: string
                minLength: 1
                maxLength: 140
    ActionRequest:
      allOf:
        - $ref: '#/components/schemas/ParamsByTool'
      type: object
      required: [tool, params]
      additionalProperties: false
      properties:
        tool:
          $ref: '#/components/schemas/ToolName'
        params:
          description: Như `ConfirmationRequest.params`; phải khớp bản đã xác nhận (hash khớp), nếu không PARAMS_MISMATCH.
          type: object
        conversation_id:
          $ref: '#/components/schemas/ConfirmConversationId'
        confirm_block_id:
          $ref: '#/components/schemas/ConfirmBlockRef'
        confirm_token:
          description: Token từ `POST /confirmations`. Vắng thì không ghi, trả 428 NEEDS_CONFIRMATION.
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          maxLength: 1024
    ResetResponse:
      type: object
      required: [reset_at, app_date, clock_offset_days, jars_count, transactions_count]
      additionalProperties: false
      properties:
        reset_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
        app_date:
          description: Ngày mô phỏng sau khi đặt lại (ngày neo).
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        clock_offset_days:
          type: integer
        jars_count:
          type: integer
          minimum: 0
        transactions_count:
          type: integer
          minimum: 0
        obligations_count:
          description: Số nghĩa vụ đã seed (phase 2).
          type: integer
          minimum: 0
        forecast_ready:
          description: Đúng nếu đã tính xong dự báo đồng bộ trước khi trả lời (phase 2), để mở app là có số.
          type: boolean
    ScheduleNudgeParams:
      description: |
        Tham số của `schedule_nudge` (target planner của agent, và REST). `op` mặc định `create`. create: bắt buộc `kind` và
        `fire_on` (ngày mô phỏng, sau hôm nay), tùy chọn `jar_code`, `note`, `scenario_id`. cancel (nút Hoàn tác): bắt buộc `nudge_id`
        (`reference_id` của biên nhận lúc đặt), không có trường khác. Chuẩn hóa: bỏ khóa null, `op` điền `create`, chuỗi cắt
        khoảng trắng, mã hũ chữ thường, uuid chữ thường; idempotent.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        op:
          type: string
          enum: [create, cancel]
        kind:
          type: string
          enum: [runout_warning, obligation_due, salary_pending, review_needed, low_data, purchase_review]
        fire_on:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
        jar_code:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        note:
          type: string
          minLength: 1
          maxLength: 120
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        nudge_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
      if:
        required: [op]
        properties:
          op:
            const: cancel
      then:
        required: [nudge_id]
        not:
          anyOf:
            - required: [kind]
            - required: [fire_on]
      else:
        required: [kind, fire_on]
        not:
          required: [nudge_id]
    AffordabilityRequest:
      description: |
        Yêu cầu kiểm tra trước khi quẹt. `funding_source` vắng thì xét cả hai nguồn. `jar` chỉ có nghĩa khi nguồn là hũ. `date` vắng
        thì hôm nay mô phỏng. Không có `user_id`.
      type: object
      required: [amount_vnd]
      additionalProperties: false
      properties:
        amount_vnd:
          $ref: '../blocks/envelope.schema.json#/$defs/VndPositive'
        funding_source:
          type: string
          enum: [jar, credit]
        jar:
          $ref: '../blocks/envelope.schema.json#/$defs/JarCode'
        label:
          type: string
          minLength: 1
          maxLength: 60
        date:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDate'
    AffordabilityResponse:
      description: Khối `affordability_card` (cả phong bì), cùng khối với tool `forecast___affordability_check`.
      $ref: '../blocks/affordability_card.schema.json'
    TraceResponse:
      description: >-
        Bản ghi lượt cho bảng "Vì sao", gồm khối `explain` đã dựng và chi tiết kỹ thuật. Cùng `data` của tool `audit___get_trace`.
      $ref: '../tools/audit.results.schema.json#/$defs/TraceData'
    FeedbackRequest:
      type: object
      required: [trace_id, option_id, decision]
      additionalProperties: false
      properties:
        trace_id:
          $ref: '../blocks/envelope.schema.json#/$defs/TraceId'
        block_id:
          description: Id khối `options` hoặc `affordability_card` chứa phương án.
          $ref: '../blocks/envelope.schema.json#/$defs/BlockId'
        option_id:
          description: '`option_id` của phương án trong khối.'
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        decision:
          type: string
          enum: [accepted, rejected]
        scenario_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        reason:
          description: Lý do ngắn người dùng nêu (tùy chọn, không chứa PII).
          type: string
          minLength: 1
          maxLength: 200
    FeedbackResponse:
      type: object
      required: [feedback_id, decision, recorded_at]
      additionalProperties: false
      properties:
        feedback_id:
          $ref: '../tools/ledger.results.schema.json#/$defs/Uuid'
        decision:
          type: string
          enum: [accepted, rejected]
        recorded_at:
          $ref: '../blocks/envelope.schema.json#/$defs/IsoDateTime'
  responses:
    BadRequest:
      description: PARAMS_INVALID (tham số sai định dạng hoặc vô lý).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: UNAUTHENTICATED. JWT authorizer có thể trả thân rỗng 401 trước khi tới Lambda.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN, TOKEN_INVALID hoặc TOKEN_EXPIRED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: JAR_NOT_FOUND, TRANSACTION_NOT_FOUND, OBLIGATION_NOT_FOUND, PAYEE_NOT_FOUND, SALARY_EVENT_NOT_FOUND, TRACE_NOT_FOUND, NUDGE_NOT_FOUND, FEE_SCHEDULE_NOT_FOUND hoặc FORECAST_NOT_APPLICABLE.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: TOKEN_REUSED, PARAMS_MISMATCH, ALREADY_APPLIED hoặc DUPLICATE_TRANSACTION.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: INSUFFICIENT_FUNDS, AMOUNT_LIMIT_EXCEEDED, CREDIT_LIMIT_EXCEEDED, JAR_PROTECTED, PROFILE_INCOMPLETE hoặc SCENARIO_INVALID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: OFFER_EXPIRED. Đề nghị đã quá hạn; hãy hỏi lại để có đề nghị mới.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NeedsConfirmation:
      description: NEEDS_CONFIRMATION. Chưa ghi gì; hãy lấy token ở `POST /confirmations`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: DATABASE_UNAVAILABLE hoặc FORECAST_UNAVAILABLE. Thử lại sau vài giây (Aurora có thể đang thức dậy).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
