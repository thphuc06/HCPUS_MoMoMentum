# Workspace uv ở gốc repo. Python 3.13 để dev; mã phải chạy được trên 3.12 và 3.13
# (runtime Lambda / AgentCore Runtime), nên requires-python giữ cả hai.
# Gói sản phẩm nằm ở libs/* (và các thư mục khác thêm vào `members` khi tới lượt).
[project]
name = "yofina-foresight"
version = "0.0.0"
description = "Yofina Foresight: workspace Python (không phải gói để phát hành)."
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["libs/*", "agent", "ml"]

[tool.uv.sources]
yofina-core = { workspace = true }
yofina-agent = { workspace = true }
yofina-ml = { workspace = true }

[dependency-groups]
dev = [
    "yofina-core",
    "yofina-agent",
    "yofina-ml",
    "httpx>=0.28",
    # credential `aws login` trên máy dev cần awscrt (không đưa vào zip Runtime)
    "awscrt>=0.23",
    # test tích hợp và script ledger (luồng B): gọi AWS thật, đăng nhập Cognito SRP
    "boto3>=1.43",
    "pycognito>=2024.5",
    "pytest>=8.3",
    "ruff>=0.8",
    # test hợp đồng (contracts/): JSON Schema, OpenAPI
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["libs/yofina_core/tests", "tests/unit"]
addopts = "-ra"
pythonpath = [
    "gateway/tools/ledger",
    "gateway/tools/planner",
    "gateway/tools/knowledge",
    "gateway/tools/audit",
    "data",
    "pipelines/forecast",
    "pipelines/roadmap",
]
markers = ["integration: gọi môi trường AWS đã deploy (chạy: pytest tests/integration -m integration)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "spikes", "frontend", "infra-cdk", "node_modules", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # chuỗi/comment tiếng Việt có ký tự Unicode
    "E501",  # độ dài dòng do `ruff format` lo; chuỗi và chú thích tiếng Việt dài được phép
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = [
    "yofina_core",
    "yofina_ledger",
    "yofina_ml",
    "yofina_forecast",
    "yofina_planner",
    "yofina_knowledge",
    "yofina_audit",
    "personas",
]
